# CrewRig — Gemini CLI model mapping (spec 0197 R38-R40).
#
# Normative shape: docs/model-mapping-format.md. Core layer, sync policy
# `strict` (.crewrig/core-paths.txt, docs/layers.md). This file DESCRIBES: it
# emits nothing and builds nothing. The resolution that reads it is seam (d)
# part 2 of epic #1100; the hermetic gate over it is
# scripts/check-model-mappings.sh (spec 0197 R46-R51).
#
# Grounding is per declaration (docs/model-mapping-format.md, Decision B).
# "RR" abbreviates the live-verification research report, issue #1111
# comment 5523492666.
#
# `encodes.intelligence` names the `-`-delimited vendor FAMILY token of each
# offering's identifier (`hydrogen`, `flash`, `argon`), never the rung itself —
# the rung distinction lives entirely in `provides.intelligence`. Each token
# appears as a segment of its own id (A10 clause (ii)), and none is a member of
# the closed intelligence domain, so clause (iii) of the checker's A10
# encodes-disagreement assertion is vacuous for this axis on this mapping.
# No offering is composite: Gemini CLI cannot set reasoning per agent, so
# none encodes or provides reasoning and a declared `reasoning` is dropped as
# unsupported-on-cli.

target: gemini

surfaces:
  - id: frontmatter
    kind: frontmatter
    items:
      - item: model
        key: model
        domain:
          values: [gemini-3.5-flash-lite, gemini-4-hydrogen, gemini-4-argon]
        grounds:
          - declares: key
            citation: >-
              RR -> Gemini CLI -> Declaration surface, citing the bundled
              subagents.md table, which documents the native `model` key on a
              `.gemini/agents/*.md` frontmatter surface.
          - declares: domain
            citation: >-
              https://aistudio.google.com/docs/models (fetched 2026-11-15)
              lists model codes "gemini-4-hydrogen" and "gemini-4-argon".
              "gemini-3.5-flash-lite" is the third identifier this mapping's
              offerings name; it rests on the owner's report of 2026-11-16
              (see that offering's assumption), not on that fetch. The bundled
              Gemini CLI documentation illustrates the model surface with
              concrete identifiers and documents no alias domain, so concrete
              identifiers are what this mapping names (spec 0197 Decision 5).
      - item: temperature
        key: temperature
        domain:
          type: number
          min: 0.0
          max: 2.0
        grounds:
          - declares: key
            citation: >-
              RR -> Gemini CLI -> Declaration surface, citing the bundled
              subagents.md table, which documents the native `temperature`
              key on the same frontmatter surface.
          - declares: domain
            citation: >-
              RR -> Gemini CLI -> Declaration surface: the bundled
              subagents.md table states the admitted range 0.0 through 2.0
              for `temperature`.
      - item: max-turns
        key: max_turns
        domain:
          type: integer
          min: 1
        grounds:
          - declares: key
            citation: >-
              RR -> Gemini CLI -> Declaration surface, citing the bundled
              subagents.md table, which documents the native `max_turns` key
              (snake_case, unlike this vocabulary's kebab-case `max-turns`
              item) on the same frontmatter surface.
          - declares: domain
            citation: >-
              RR -> Gemini CLI -> Declaration surface: the bundled
              subagents.md table states an integer of at least 1 for
              `max_turns`.

  - id: settings-overrides
    kind: out-of-band
    location: >-
      settings.json `modelConfigs.overrides`, matched to an agent by
      `overrideScope` (spec 0197 R40). Recorded as evidence directing no
      emission (R12) — this mapping declares no guidance surface, so
      reasoning and the three generation knobs below are dropped with the
      reason unsupported-on-cli rather than directed here.
    items:
      - item: reasoning
        grounds:
          - declares: item
            citation: >-
              RR -> Gemini CLI -> No native reasoning field: `thinkingLevel` /
              `thinkingBudget` are reachable only through `settings.json`
              `modelConfigs.overrides`, never through the agent-file
              frontmatter surface (spec 0197 Premise 2).
      - item: top-p
        grounds:
          - declares: item
            citation: >-
              RR -> Gemini CLI -> No native reasoning field: `topP` is
              reachable only through `settings.json`
              `modelConfigs.overrides`.
      - item: top-k
        grounds:
          - declares: item
            citation: >-
              RR -> Gemini CLI -> No native reasoning field: `topK` is
              reachable only through `settings.json`
              `modelConfigs.overrides`.
      - item: max-output-tokens
        grounds:
          - declares: item
            citation: >-
              RR -> Gemini CLI -> No native reasoning field: `maxOutputTokens`
              is reachable only through `settings.json`
              `modelConfigs.overrides`.

offerings:
  - id: gemini-3.5-flash-lite
    rank: 1
    native-value: gemini-3.5-flash-lite
    provides:
      intelligence: medium
      specialization: general
    encodes:
      intelligence: flash
    supports-reasoning-surface: false
    grounds:
      - declares: native-value
        assumption: >-
          Dated 2026-11-16: the owner reported that Gemini CLI accepts the
          concrete identifier `gemini-3.5-flash-lite`. The locally installed
          gemini-cli 0.28.2 bundle does not list it, so acceptance rests on the
          owner's report. It corrects the owner's report of 2026-11-15, which
          had named `gemini-4-hydrogen` here.
      - declares: provides.intelligence
        assumption: >-
          Dated 2026-11-16: the owner's report maps `gemini-3.5-flash-lite`
          (the haiku anchor) onto the spec 0195 R7 anchor rung `medium`. It is
          not a capability measurement (spec 0197 `## Open questions`).
      - declares: supports-reasoning-surface
        citation: >-
          This mapping's frontmatter surface declares no reasoning item
          (spec 0197 R40), so A17 forces false structurally.

  - id: gemini-4-hydrogen
    rank: 2
    native-value: gemini-4-hydrogen
    provides:
      intelligence: high
      specialization: general
    encodes:
      intelligence: hydrogen
    supports-reasoning-surface: false
    grounds:
      - declares: native-value
        assumption: >-
          Model code: https://aistudio.google.com/docs/models (fetched
          2026-11-15) lists model code "gemini-4-hydrogen". Dated 2026-11-16: the
          owner reported that Gemini CLI accepts the concrete identifier
          `gemini-4-hydrogen`. The locally installed gemini-cli 0.28.2 bundle
          does not list it, so acceptance rests on the owner's report.
      - declares: provides.intelligence
        assumption: >-
          Dated 2026-11-16: the owner's report maps `gemini-4-hydrogen` (the
          sonnet anchor) onto the spec 0195 R7 anchor rung `high`. It corrects
          the owner's report of 2026-11-15, which had made `gemini-4-hydrogen`
          the haiku anchor and kept `gemini-3.8-flash` as the sonnet anchor. It
          is not a capability measurement (spec 0197 `## Open questions`).
      - declares: supports-reasoning-surface
        citation: >-
          This mapping's frontmatter surface declares no reasoning item
          (spec 0197 R40), so A17 forces false structurally.

  - id: gemini-4-argon
    rank: 3
    native-value: gemini-4-argon
    provides:
      intelligence: xhigh
      specialization: general
    encodes:
      intelligence: argon
    supports-reasoning-surface: false
    grounds:
      - declares: native-value
        assumption: >-
          Model code: https://aistudio.google.com/docs/models (fetched
          2026-11-15) lists model code "gemini-4-argon". Dated 2026-11-15: the owner reported
          that Gemini CLI accepts the concrete identifier `gemini-4-argon`. The
          locally installed gemini-cli 0.28.2 bundle does not list it, so
          acceptance rests on the owner's report.
      - declares: provides.intelligence
        assumption: >-
          Dated 2026-11-15: the owner's report maps `gemini-4-argon` (the opus anchor) onto the spec
          0195 R7 anchor rung `xhigh`. It is not a capability
          measurement (spec 0197 `## Open questions`).
      - declares: supports-reasoning-surface
        citation: >-
          This mapping's frontmatter surface declares no reasoning item
          (spec 0197 R40), so A17 forces false structurally.
