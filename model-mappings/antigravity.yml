# CrewRig — Antigravity CLI model mapping (spec 0197 R43-R44).
#
# Normative shape: docs/model-mapping-format.md. Core layer, sync policy
# `strict` (.crewrig/core-paths.txt, docs/layers.md). This file DESCRIBES: it
# emits nothing and builds nothing. The resolution that reads it is seam (d)
# part 2 of epic #1100; the hermetic gate over it is
# scripts/check-model-mappings.sh (spec 0197 R46-R51).
#
# No frontmatter surface exists on this target (spec 0197 Premise 1): AGENT.md
# carries `name` and `description` alone, and `--model`/`--effort` are
# session-level flags of the whole invocation, not a per-agent field. The
# declination is stated on the guidance surface instead.
#
# Every offering here is composite (spec 0197 Decision 7): its native
# identifier encodes both a capability-class token (`flash`/`pro`) and a
# reasoning-rung token (`low`/`medium`/`high`) in one `-`-delimited value, so
# each offering declares `provides.reasoning` alongside `provides.intelligence`
# — matching what it encodes, per the checker's A10 clause (i) — and reasoning
# is served by model selection, not by a second field.

target: antigravity

surfaces:
  - id: guidance
    kind: guidance
    carries: [model]
    template: |
      Run this agent on the {{model}} model.
    items:
      - item: model
        grounds:
          - declares: item
            assumption: >-
              Same assumption spec 0197 R35 imposes on Claude Code's guidance
              surface: an orchestrating session asked in prose to run an
              agent on a named model does so. The whole of the evidence is
              the maintainer's live experience, recorded at the content gate
              of issue #1111; the live-verification research report tested
              no orchestrator behaviour (spec 0197 R43).

offerings:
  - id: gemini-3.8-flash-low
    rank: 1
    native-value: gemini-3.8-flash-low
    provides:
      intelligence: medium
      reasoning: low
      specialization: general
    encodes:
      intelligence: flash
      reasoning: low
    supports-reasoning-surface: false
    grounds:
      - declares: native-value
        citation: >-
          RR -> Antigravity CLI -> Declaration surface: `agy models` lists
          `gemini-3.8-flash-low` among its fourteen reported identifiers.
      - declares: provides.intelligence
        assumption: >-
          The rung rests on the vendor's own family naming — pro above
          flash — observable in the identifier but not a capability
          measurement (spec 0197 `## Open questions`).
      - declares: provides.reasoning
        assumption: >-
          The rung rests on the identifier's own suffix, observable but not a
          capability measurement, per the same open question.

  - id: gemini-3.8-flash-medium
