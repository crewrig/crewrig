        assumption: >-
          Dated 2026-11-15: `agy models` output reported by the owner on 2026-11-15 lists `gemini-4-hydrogen-medium`; the owner reported the gemini-4-hydrogen suffixes the same day without a verbatim extract. Within the `medium` rung this is the lowest rank (rank 1), so R23's lowest-rank pick selects it when reasoning is omitted (spec 0197 delta-01, issue #1134).
      - declares: provides.intelligence
        assumption: >-
          Dated 2026-11-15: the owner's report maps `gemini-4-hydrogen` (the haiku anchor) onto the spec 0195
          R7 anchor rung `medium`. It is not a capability measurement.
      - declares: provides.reasoning
        assumption: >-
          The rung rests on the identifier's own `-medium` suffix, observable but
          not a capability measurement, per spec 0197 `## Open questions`.

