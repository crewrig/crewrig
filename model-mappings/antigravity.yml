    rank: 5
    native-value: gemini-3.1-pro-high
    provides:
      intelligence: high
      reasoning: high
      specialization: general
    encodes:
      intelligence: pro
      reasoning: high
    supports-reasoning-surface: false
    grounds:
      - declares: native-value
        citation: >-
          RR -> Antigravity CLI -> Declaration surface: `agy models` lists
          `gemini-3.1-pro-high` among its fourteen reported identifiers. Under
          R17's ceiling clause this offering (rank 5, the lowest-ranked at the
          mapping's highest declared rung) also serves a declared `xhigh`,
          `xxhigh` or `max` rung — this mapping declares no higher rung, on
          the ground `## Open questions` and R44 record (the plan under which
          Antigravity CLI serves non-Google models is markedly less generous
          than the one serving the Google family).
      - declares: provides.intelligence
        assumption: >-
          Same ground as `gemini-3.1-pro-low` above: vendor family naming,
          not a capability measurement.
      - declares: provides.reasoning
        assumption: >-
          Same ground as `gemini-3.1-pro-low` above: the identifier's own
          suffix, not a capability measurement.

