# CrewRig — Claude Code model mapping (spec 0197 R34-R37).
#
# Normative shape: docs/model-mapping-format.md. Core layer, sync policy
# `strict` (.crewrig/core-paths.txt, docs/layers.md). This file DESCRIBES: it
# emits nothing and builds nothing. The resolution that reads it is seam (d)
# part 2 of epic #1100; the hermetic gate over it is
# scripts/check-model-mappings.sh (spec 0197 R46-R51).
#
# Grounding is per declaration (docs/model-mapping-format.md, Decision B):
# every offering, surface item and guard term carries a `grounds:` list, and
# each entry names the declaration it grounds and exactly one of `citation` or
# `assumption` (R5). "RR" abbreviates the live-verification research report,
# issue #1111 comment 5523492666.

target: claude

surfaces:
  - id: frontmatter
    kind: frontmatter
    items:
      - item: model
        key: model
        domain:
          values: [haiku, sonnet, opus, fable]
        grounds:
          - declares: key
            citation: >-
              RR -> Claude Code -> Per-agent frontmatter surface, citing
              artifacts/FORMAT.md's "Claude Code Overrides" table (line 103),
              which documents the native `model` key ("Model override") for a
              `context: fork` component.
          - declares: domain
            citation: >-
              RR -> Claude Code -> Declaration surface: `claude --help`
              illustrates its --model domain with the family aliases, which
              spec 0197 Decision 5 makes this mapping's declared domain in
              preference to concrete identifiers — the one thing the probe
              found inconsistent on disk.
      - item: reasoning
        key: effort
        domain:
          values: [low, medium, high, xhigh, max]
        projection:
          none: unmapped
          low: low
          medium: medium
          high: high
          xhigh: xhigh
          max: max
        grounds:
          - declares: key
            citation: >-
              RR -> Claude Code -> Per-agent frontmatter surface, citing
              artifacts/FORMAT.md's "Claude Code Overrides" table (line 103),
              which documents the native `effort` key ("Effort level
              override").
          - declares: domain
            citation: >-
              RR -> Claude Code -> Declaration surface: `claude --help` gives
              --effort the domain low|medium|high|xhigh|max, with no `none`.
          - declares: projection.none
            citation: >-
              The same observation: the domain admits no off state, so the
              `none` rung has no image and is declared unmapped rather than
              resolved to `low` (R24, spec 0195 R11).

  - id: guidance
    kind: guidance
    carries: [model, reasoning]
    template: |
      Run this agent on the {{model}} model.
      Give its work {{reasoning}} reasoning effort.
    items:
      - item: model
        grounds:
          - declares: item
            assumption: >-
              An orchestrating Claude Code session asked in prose to run an
              agent on a named model does so. The whole of the evidence is the
              maintainer's live experience, recorded at the content gate of
              issue #1111; no probe covers it, and RR tested no orchestrator
              behaviour (R35, spec 0197 Decision 6).
      - item: reasoning
        grounds:
          - declares: item
            assumption: >-
              Same ground as the model item above. Additionally unverified:
              whether prose naming a model inside a .claude/agents/ output
              disturbs a GitHub Copilot CLI reader — probe A set a `model:`
              field on every leg, so its verdict says nothing about prose.
              Tracked as probe C from content gate v2 of issue #1111.

offerings:
  - id: haiku
    rank: 1
    native-value: haiku
    provides:
      intelligence: medium
      specialization: general
    encodes:
      intelligence: haiku
    supports-reasoning-surface: true
    grounds:
      - declares: native-value
        citation: >-
          RR -> Claude Code -> Declaration surface: `haiku` is a known alias of
          the --model domain (not itself printed in the help example, which
          lists fable/opus/sonnet).
      - declares: provides.intelligence
        citation: >-
          Spec 0195 R7's normative anchor table calibrates rung 3 `medium` on
          Claude Code `haiku` (spec 0197 R36).
      - declares: supports-reasoning-surface
        citation: >-
          Live empirical verification on Claude Code 2.1.263: the `haiku` alias
          resolves to `claude-haiku-4-5-20251001`, which natively supports
          extended thinking. An agent defined with `model: haiku` and `effort:
          medium` cleanly executes and emits thinking tokens without error
          (spec 0197 delta-02 R36).
      - declares: supports-reasoning-surface.behavior
        citation: >-
          Spec 0197 delta-02 R36: with `supports-reasoning-surface: true`,
          Claude Code directs a declared reasoning rung to `effort:` in
          frontmatter and to the guidance surface prose without dropping.
  - id: sonnet
    rank: 2
    native-value: sonnet
    provides:
      intelligence: high
      specialization: general
    encodes:
      intelligence: sonnet
    supports-reasoning-surface: true
    grounds:
      - declares: native-value
        citation: >-
          RR -> Claude Code -> Declaration surface: `sonnet` appears in
          `claude --help`'s own --model example.
      - declares: provides.intelligence
        citation: >-
          Spec 0195 R7's normative anchor table calibrates rung 4 `high` on
          Claude Code `sonnet` (spec 0197 R36).
  - id: opus
    rank: 3
    native-value: opus
    provides:
      intelligence: xhigh
      specialization: general
    encodes:
      intelligence: opus
    supports-reasoning-surface: true
    grounds:
      - declares: native-value
        citation: >-
          RR -> Claude Code -> Declaration surface: `opus` appears in
          `claude --help`'s own --model example.
      - declares: provides.intelligence
        citation: >-
          Spec 0195 R7's normative anchor table calibrates rung 5 `xhigh` on
          Claude Code `opus` (spec 0197 R36).
  - id: fable
    rank: 4
    native-value: fable
    provides:
      intelligence: xxhigh
      specialization: general
    encodes:
      intelligence: fable
    supports-reasoning-surface: true
    grounds:
      - declares: native-value
        citation: >-
          RR -> Claude Code -> Declaration surface: `fable` appears in
          `claude --help`'s own --model example.
      - declares: provides.intelligence
        citation: >-
          Spec 0195 R7's normative anchor table calibrates rung 6 `xxhigh` on
          Claude Code `fable` (spec 0197 R36). Under R17's ceiling clause this
          offering also serves a declared `max` rung, satisfying spec 0195 R9.

guard:
  id: copilot-shared-read
  spec: specs/0291-agent-model-tools-allowlist.md R1, R3
  state: directed
  terms:
    - id: defect-not-established-fixed
      statement: >-
        On a standard GitHub-hosted account, the upstream defect
        github/copilot-cli#4437 is not established fixed.
      holds: false
      evidence: >-
        Probe of 2026-11-10 on GitHub Copilot CLI 1.0.109 (recorded in issue
        #1851), on a standard GitHub-hosted account: agents under
        .claude/agents/ declaring `model: sonnet`, `model: claude-sonnet-5-5`
        and `model: claude-sonnet-4.5` each produced a warning and a fallback
        to the session model; a subagent spawned through the `task` tool
        answered on the session model; every run succeeded. The probe does not
        cover a bring-your-own-key provider, where github/copilot-cli#4437 was
        reported (Copilot 1.0.79, Ollama), nor an account on which Claude
        models are served. Spec 0143 delta-01 R8 asked for evidence on
        BYOK/Ollama providers; spec 0291 R4 narrows that clause to the standard
        account and accepts the bring-your-own-key case as an unverified
        residual risk (rollback: guard.state back to withheld and the second
        term back to holds true; an organization re-withholds through its own
        mapping, docs/org-model-mapping-override.md).
      grounds:
        - declares: holds
          citation: >-
            Probe of 2026-11-10 on GitHub Copilot CLI 1.0.109, standard
            GitHub-hosted account, recorded in issue #1851 (spec 0291 R3, R4).
    - id: copilot-reader-fails-on-unserved-model
      statement: >-
        A GitHub Copilot CLI reader of .claude/agents/ fails, or silently
        misroutes a subagent, whose `model:` it cannot serve.
      holds: false
      evidence: >-
        Differs from defect-not-established-fixed: that term concerns the
        specific upstream defect (silent misrouting of a subagent on a
        standard account); this term concerns the observable outcome on a
        Copilot reader whatever the cause. The probe of 2026-11-10 on GitHub
        Copilot CLI 1.0.109 on a standard GitHub-hosted account saw a warning
        and a fallback to the session model, with the run succeeding, so this
        term does not hold there. The warning fires on agent invocation only,
        once per invocation, never at startup or discovery (coordinator probe
        of 2026-11-11, Copilot CLI 1.0.109: no warning without an agent, exactly
        one with `--agent`). Not covered: a bring-your-own-key provider and an
        account on which Claude models are served. An adopter on a
        bring-your-own-key provider flips this term, not the first, because it
        states what that adopter's Copilot readers may do, which no probe
        covers for them. Rollback: set guard.state to withheld and this term to
        holds true (rule A23 requires both).
      grounds:
        - declares: holds
          citation: >-
            Probe of 2026-11-10 on GitHub Copilot CLI 1.0.109, standard
            GitHub-hosted account, recorded in issue #1851, and the invocation
            probe of 2026-11-11 recorded there (spec 0291 R3, R4).
