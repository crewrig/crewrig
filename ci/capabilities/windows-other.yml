  # Spec 0314 (ticket #2101, WP3 of epic #1822) and spec 0315 (ticket #2114, WP4): the organization launcher, `crewrig init`
  # and the `build`, `setup` and `update` suites on Windows, a copy of the Linux capability `crewrig-launcher-ts` (same
  # `paths:`). Every suite runs the template file unmodified against a localhost server and a temporary HOME. The floor
  # case is not here: it runs on Node.js 22 in `crewrig-launcher-floor`.
  - id: windows-crewrig-launcher
    group: windows
    name: "Windows organization launcher: pin, download, cache, archive, forwarding, init, build, setup, update and manifest closure"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "templates/org-repo/**"
      - "crewrig.entry.json"
      - "scripts/crewrig-cli.ts"
      - "scripts/lib/crewrig-cli/**"
      - "scripts/lib/framework-release/**"
      - "scripts/lib/packaging/**"
      - "scripts/lib/build-components/config.ts"
      - "scripts/lib/build-components/args.ts"
      - "scripts/lib/build-components/conventions-block.ts"
      - "scripts/lib/build-components/diagnostics.ts"
      - "scripts/lib/build-components/types.ts"
      - "scripts/lib/escape-control.ts"
      - "scripts/lib/git-env.ts"
      - "scripts/lib/line-endings.ts"
      - "scripts/lib/render-command.ts"
      - "scripts/lib/tmp-file.ts"
      - "scripts/lib/yaml-text.ts"
      - "config/ORGANIZATION.md.template"
      - "config/TOOLS.md.template"
      - "config/expertise/**"
      - "config/teams/**"
      - "config/level/**"
      - "scripts/tests/crewrig-*.test.ts"
      - "scripts/tests/lib/launcher-rig.ts"
      - "scripts/tests/lib/hostile-tar.ts"
      - "scripts/tests/lib/fast-clock.ts"
      - "scripts/tests/lib/init-scaffold.ts"
      - "scripts/tests/lib/tar-reader.ts"
      - "scripts/lib/**"
      - "hooks/**"
      - "config/**"
      - "artifacts/core/**"
      - ".claude/skills/init-*/**"
      - ".gemini/skills/init-*/**"
      - ".gemini/commands/init-*"
      - ".github/skills/init-*/**"
      - ".agents/skills/init-*/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/session-check-hooks.ts"
      - "scripts/tls-exec.ts"
      - "scripts/tests/usage-archive-scopes.test.ts"
      - "scripts/tests/lib/**"
    portability: specific
    requires:
      runtime: node@24
      tools: [task]
      install: omit-dev
    command:
      - task ci:windows-crewrig-launcher
    exception:
      engine: github-actions
      evidence: >
        Runs on the GitHub-hosted `windows-latest` runner
        (.github/workflows/_ci-windows.yml, job `windows-crewrig-launcher`), where the
        launcher's Windows-only behaviour (directory rename retries, junction homes,
        `EPERM` on an existing target) is exercised. GitLab CI, as configured for this
        repository, exposes no Windows runner: every generated GitLab job derives its
        `image` from `requires.runtime` through `runtime_to_image` (scripts/build-ci.ts),
        which maps only to Linux Docker images, and .gitlab-ci.yml declares no runner
        `tags:` that could select a Windows executor. The Linux leg of the same suites is
        `crewrig-launcher-ts` (spec 0314 R19, plan of issue #2101). There is no faithful
        equivalent on the other supported engines (spec 0240 R15, spec 0314 R13).

