# CI capabilities: group windows, part other (format: docs/ci-reference-format.md, spec 0309).
capabilities:

  # --- Engine-specific: Windows runner scaffolding (spec 0240 R12-R15) -----

  # The reusable `windows-latest` job shape: Node.js 24 from a non-POSIX interpreter (pwsh), the portable shared-module
  # suites and the timing-budget harness on the floor guard. Later sub-specs copy the job and record each copy here.
  - id: windows-node-floor-guard
    group: windows
    name: "Windows scaffolding: floor guard, shared modules and timing budget"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    requires:
      runtime: node@24
      tools: [task]
      install: omit-dev
    command:
      - task ci:windows-node-floor-guard
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Runs on the GitHub-hosted `windows-latest` runner
        (.github/workflows/_ci-windows.yml, job `windows-node-floor-guard`). GitLab
        CI, as configured for this repository, exposes no Windows runner:
        every generated GitLab job derives its `image` from
        `requires.runtime` through `runtime_to_image`
        (scripts/build-ci.ts lines 70-81), which maps only to Linux Docker
        images, and .gitlab-ci.yml declares no runner `tags:` that could
        select a Windows executor. There is no faithful equivalent on the
        other supported engines (spec 0240 R15).

