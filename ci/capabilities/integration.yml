# CI capabilities: group integration (format: docs/ci-reference-format.md, spec 0309).
capabilities:

  # Spec 0256 R40 (ticket #1335), PR A: the oracle of the four setup entry points: the shell setup scripts run in a sandbox
  # HOME with stub CLIs and the resulting trees are compared with the committed goldens. `jq` and `git` are real. The
  # golden suites skip themselves off Linux and use no network. A change to the shell the oracle drives reruns it.
  - id: setup-oracle
    group: integration
    name: "Run the setup entry-point oracle: sandbox, stubs, golden, prompt-inventory and mutation suites"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "scripts/**"
      - "config/**"
      - "hooks/**"
      - "artifacts/core/rules/**"
      - "artifacts/core/system-context/**"
      - "mcp-servers.org.json"
      - "AGENTS.org.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/tests/setup-sandbox.test.ts"
      - "scripts/tests/setup-stubs.test.ts"
      - "scripts/tests/setup-golden-harness.test.ts"
      - "scripts/tests/setup-golden-smoke.test.ts"
      - "scripts/tests/setup-golden-claude.test.ts"
      - "scripts/tests/setup-golden-gemini.test.ts"
      - "scripts/tests/setup-golden-copilot.test.ts"
      - "scripts/tests/setup-golden-antigravity.test.ts"
      - "scripts/tests/setup-prompt-inventory.test.ts"
      - "scripts/tests/setup-oracle-mutation.test.ts"
      - "scripts/tests/setup-golden-deviations.test.ts"
      - "scripts/tests/setup-entry-form.test.ts"
      - "scripts/tests/lib/setup-*.ts"
      - "scripts/tests/lib/real-home-guard.ts"
      - "scripts/tests/fixtures/setup-golden/**"
    portability: portable
    requires:
      runtime: node@24
      tools: [jq, task]
      install: omit-dev
    command:
      - task ci:setup-oracle

