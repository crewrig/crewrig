  # `bash` is spawned on purpose by the two twin conformance suites and `jq` by the shell functions they call; both retire
  # with the shell libraries (row J4). Those suites skip on Windows, so this job runs on Linux only.
  - id: install-ts
    group: modules
    name: "Run the TypeScript link-or-copy, component twin, manage and install module suites"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
