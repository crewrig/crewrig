  # Spec 0310 (ticket #2062, WP2 of epic #1822): the framework release unit. The guard, build and publish scripts, their
  # modules and their offline suites (a temporary git repository with a bare origin, a localhost stub of the GitHub REST
  # API), plus the pins on the two release workflows. Linux only; no network.
  - id: release-framework-modules-ts
    group: modules
    name: "Run the framework release unit module suites"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "scripts/framework-release-*.ts"
      - "scripts/lib/framework-release/**"
