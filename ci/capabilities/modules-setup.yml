  # Spec 0255 R3: the install, manage and link entries print nothing on the oldest Node.js 24 release. No `paths:` filter,
  # like extension-builders-ts-node-24-0: any shared-module change can reintroduce a warning.
  - id: install-ts-node-24-0
    group: modules
    name: "Install, manage and link entries are silent on Node.js 24.0.0"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24.0.0
    command:
      - npm ci --omit=dev --workspaces=false
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/install-entry-form.test.ts

