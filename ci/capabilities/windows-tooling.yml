# CI capabilities: group windows, part tooling (format: docs/ci-reference-format.md, spec 0309).
capabilities:

  # Spec 0254 R23: the extension builders' copy of the Windows template (windows-build-components):
  # scripts/tests/lib/windows-extension-proof.ts builds every golden subject with the TypeScript entries from pwsh and
  # compares each file with the committed golden tree. No timing budget and no `paths:` filter: the proof must not skip
  # silently on a change it does not list.
  - id: windows-extension-builders
    group: windows
    name: "Windows extension and plugin builders: production install, floor guard, golden proof and unit suites"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    requires:
      runtime: node@24
      tools: [task]
      install: omit-dev
    command:
      - task ci:windows-extension-builders
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Runs on the GitHub-hosted `windows-latest` runner
        (.github/workflows/_ci-windows.yml, job `windows-extension-builders`). GitLab
        CI, as configured for this repository, exposes no Windows runner:
        every generated GitLab job derives its `image` from
        `requires.runtime` through `runtime_to_image`
        (scripts/build-ci.ts lines 93-104), which maps only to Linux Docker
        images, and .gitlab-ci.yml declares no runner `tags:` that could
        select a Windows executor. There is no faithful equivalent on the
        other supported engines (spec 0240 R15, spec 0254 R23).


