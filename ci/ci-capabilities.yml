      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-store/**"
          - "scripts/usage-query.sh"
          - "scripts/usage-prune.sh"
          - "scripts/usage-mirror.sh"
          - "scripts/usage-inventory.ts"
          - "scripts/usage-drain.sh"
          - "scripts/usage-task.sh"
          - "scripts/usage-attribute.sh"
          - "scripts/usage-backfill.sh"
          - "scripts/build-usage-validator.js"
          - "scripts/tests/test-usage-storage*.sh"
          - "scripts/tests/usage-inventory.test.ts"
          - "scripts/tests/fixtures/usage-storage/**"
          - "schemas/**"
          - "package.json"
          - "package-lock.json"
          - "docs/usage-storage.md"
          - "docs/usage-organization.md"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-store/**"
          - "scripts/usage-query.sh"
          - "scripts/usage-prune.sh"
          - "scripts/usage-mirror.sh"
          - "scripts/usage-inventory.ts"
          - "scripts/usage-drain.sh"
          - "scripts/usage-task.sh"
          - "scripts/usage-attribute.sh"
          - "scripts/usage-backfill.sh"
          - "scripts/build-usage-validator.js"
          - "scripts/tests/test-usage-storage*.sh"
          - "scripts/tests/usage-inventory.test.ts"
          - "scripts/tests/fixtures/usage-storage/**"
          - "schemas/**"
          - "package.json"
          - "package-lock.json"
          - "docs/usage-storage.md"
          - "docs/usage-organization.md"
    portability: portable
    requires:
      # node@24 (bumped from node@22): scripts/usage-inventory.ts and its test
      # run directly from .ts source via Node's built-in type stripping (spec
      # 0238), which requires Node >= 24 — see DEVELOPMENT.md, "TypeScript
      # toolchain and ratchet". Kept its own id, distinct from the `ratchet`/
      # `lint-typescript` capabilities (spec 0238 R1-R8): this capability
      # validates the usage-record storage contract, not the TypeScript
      # toolchain itself, and no `tsc`/Oxlint/Oxfmt tool is needed here — a
      # plain `node --test` on .ts sources needs no `npm ci` of its own beyond
      # what this capability already runs for schema validation.
      runtime: node@24
    command:
      - npm install
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-storage.sh
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-storage-mirror.sh
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-inventory.test.ts
      - node scripts/build-usage-validator.js --check

  # usage-attribution validates spec 0208's declaration channels, attribution
  # ledger, and per-fidelity rollups: the resolver's four-channel order and
  # offline worktree-or-branch derivation, the append-only ledger's read-time
  # override, and the registered-derived-store prune reach (spec 0207
  # delta-01 R28/R33). Deliberately NOT changeset-gated, for the same reason
  # usage-storage above is not — a node@22 capability must never enter the
  # fail-safe job's execution set (python@3.12, yq and node@24). The capture
  # tree is in the paths filter because the resolution point is scripts/lib/usage-capture/
  # index.js and the backfill's no-channel rule is backfill.js: without it,
  # an edit dropping the resolveAttribution() call would leave usage-capture
  # green (it asserts nothing about attribution), usage-storage green (it
  # does not fire on the capture tree), and usage-attribution not run at all.
  - id: usage-attribution
    name: "Validate the usage-attribution declaration channels and ledger"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-store/**"
          - "scripts/lib/usage-capture/**"
          - "scripts/usage-task.sh"
          - "scripts/usage-attribute.sh"
          - "scripts/tests/test-usage-attribution.sh"
          - "scripts/tests/fixtures/usage-attribution/**"
          - "docs/usage-attribution.md"
          - "schemas/**"
          - "package.json"
          - "package-lock.json"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-store/**"
          - "scripts/lib/usage-capture/**"
          - "scripts/usage-task.sh"
          - "scripts/usage-attribute.sh"
          - "scripts/tests/test-usage-attribution.sh"
          - "scripts/tests/fixtures/usage-attribution/**"
          - "docs/usage-attribution.md"
          - "schemas/**"
          - "package.json"
          - "package-lock.json"
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-attribution.sh

  # usage-pricing validates spec 0209's comparative pricing engine: the
  # model-id resolution pipeline (exact/alias/family/org fallback), the
  # cache-tier and long-context arithmetic against the real LiteLLM field
  # names, currency conversion against a fixed ECB fixture (including the
  # freshness and suppression FX cases), the three-timestamp and
  # --as-of-today contract, the per-fidelity rollup rules, and the R37
  # registered-derived-store prune reach (the two-store case delta-01 R33
  # requires). Fully offline — a hand-built ~14-entry fixture price list,
  # never the real 2.9 MB snapshot. Deliberately NOT changeset-gated, for
  # the same reason usage-storage above is not — a node@22 capability must
  # never enter the fail-safe job's execution set (python@3.12, yq and
  # node@24). The usage-store tree is in the paths filter because step 9 of the plan puts
  # both halves of the R37 mechanism there (derivedStores() in layout.js,
  # the walk in prune.js): without it, a changeset touching only layout.js
  # or prune.js would not run the suite that owns the R37 assertion. The usage-dashboard
  # tree and entry script are in the paths filter because the suite runs the dashboard
  # (cases 17 and 19), so a change to either must run it.
  # The three usage-store entry scripts (usage-attribute.sh, usage-prune.sh,
  # usage-query.sh) are in the paths filter for the same reason: the suite runs
  # them (the R37 prune cases 14 and 15, the case 17 period-rollup helper, the
  # case 19 ledger writes), so a change to their exec line or argument handling
  # must run it.
  - id: usage-pricing
    name: "Validate the usage-pricing model-id resolution, arithmetic, and prune reach"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-price/**"
          - "scripts/usage-price.sh"
          - "scripts/tests/test-usage-pricing*.sh"
          - "scripts/tests/fixtures/usage-pricing/**"
          - "model-prices.org.json"
          - "scripts/lib/usage-store/**"
          - "scripts/usage-attribute.sh"
          - "scripts/usage-prune.sh"
          - "scripts/usage-query.sh"
          - "scripts/lib/usage-dashboard/**"
          - "scripts/usage-dashboard.sh"
          - "package.json"
          - "package-lock.json"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-price/**"
          - "scripts/usage-price.sh"
          - "scripts/tests/test-usage-pricing*.sh"
          - "scripts/tests/fixtures/usage-pricing/**"
          - "model-prices.org.json"
          - "scripts/lib/usage-store/**"
          - "scripts/usage-attribute.sh"
          - "scripts/usage-prune.sh"
          - "scripts/usage-query.sh"
          - "scripts/lib/usage-dashboard/**"
          - "scripts/usage-dashboard.sh"
          - "package.json"
          - "package-lock.json"
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-pricing.sh

  # usage-dashboard is spec 0210's three-form agreement, injection and
  # loopback-bind suite (PLAN v2 steps 13-15). Fully offline, reusing the
  # usage-pricing fixture price list. Not changeset-gated, for the same
  # node@22 reason as usage-pricing above. The usage-store and usage-price
  # trees and model-prices.org.json are in the paths filter because the view
  # model reads through both (priceRecord() loads the org table on every
  # call), so a change to either can shift a figure the dashboard shows.
  - id: usage-dashboard
    name: "Validate the usage dashboard's three delivery forms, injection safety, and loopback bind"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-dashboard/**"
          - "scripts/usage-dashboard.sh"
          - "scripts/tests/test-usage-dashboard*.sh"
          - "scripts/tests/fixtures/usage-dashboard/**"
          - "scripts/tests/fixtures/usage-pricing/**"
          - "model-prices.org.json"
          - "scripts/lib/usage-store/**"
          - "scripts/lib/usage-price/**"
          - "scripts/usage-query.sh"
          - "scripts/usage-price.sh"
          - "scripts/usage-attribute.sh"
          - "scripts/usage-prune.sh"
          - "schemas/usage-record/**"
          - "package.json"
          - "package-lock.json"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/lib/usage-dashboard/**"
          - "scripts/usage-dashboard.sh"
          - "scripts/tests/test-usage-dashboard*.sh"
          - "scripts/tests/fixtures/usage-dashboard/**"
          - "scripts/tests/fixtures/usage-pricing/**"
          - "model-prices.org.json"
          - "scripts/lib/usage-store/**"
          - "scripts/lib/usage-price/**"
          - "scripts/usage-query.sh"
          - "scripts/usage-price.sh"
          - "scripts/usage-attribute.sh"
          - "scripts/usage-prune.sh"
          - "schemas/usage-record/**"
          - "package.json"
          - "package-lock.json"
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-dashboard.sh

  # gitlab-ci-check is the generator's own drift gate (spec 0048 R6/R7),
  # registered as a portable capability so the verification surface is itself
  # contract-described, not a hidden gate. Its command diffs the committed
  # .gitlab-ci.yml against a fresh derivation; it needs yq to read the
  # reference (delta-02 R12).
  - id: gitlab-ci-check
    name: "Verify the generated GitLab pipeline matches the contract"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      tools: [yq]
    command:
      - bash scripts/build-ci.sh --check

  # check-ci-parity is the 3-way CI drift harness (spec 0049). It checks the
  # reference against both engine pipelines on the portable capability set;
  # registered as a portable capability (spec 0049 R11) so the verification
  # surface is itself contract-described and parity-checked — symmetric with
  # gitlab-ci-check above. It shells `yq` to read the reference and the
  # pipelines, and composes `build-ci.sh --check` (which also needs yq) for the
  # reference↔GitLab arm; hence `tools: [yq]` (delta-02 R12).
  - id: check-ci-parity
    name: "Verify the reference, GitHub Actions, and GitLab pipelines agree"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      tools: [yq]
    command:
      - bash scripts/check-ci-parity.sh

  # --- Engine-specific: bot-mention assistants ----------------------------
  # A bot-mention trigger (an issue or review comment) is engine-specific,
  # never portable (spec 0047 R5).

  - id: claude
    name: "Claude Code mention-triggered assistant"
    trigger:
      - on: manual
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Triggered by GitHub `issue_comment` / `pull_request_review_comment`
        events gated on a literal `@claude` mention
        (.github/workflows/claude.yml lines 3-13). GitLab CI exposes no
        comment-event pipeline trigger, so there is no faithful equivalent on
        the other supported engines. A bot-mention trigger is treated as
        engine-specific, never portable (spec 0047 R5); the analogous non-GHA
        surfaces are marked [GAP] in docs/cli-matrix.md.

  - id: copilot
    name: "GitHub Copilot CLI mention-triggered assistant"
    trigger:
      - on: manual
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Triggered by GitHub `issue_comment` / `pull_request_review_comment`
        events gated on a literal `@copilot-cli` mention
        (.github/workflows/copilot.yml lines 13-23); native `@copilot`
        dispatch is configured at the repository/organization level, not
        portable to GitLab CI. A bot-mention trigger is treated as
        engine-specific, never portable (spec 0047 R5).

  # --- Engine-specific: GitHub-native delivery surfaces --------------------

  # pages.yml deploys the `communication/` site to GitHub Pages on push to main
  # and via workflow_dispatch (.github/workflows/pages.yml lines 3-8). GitHub
  # Pages is a GitHub-hosted product; GitLab's equivalent (GitLab Pages) is a
  # distinct surface with its own job contract, so the deploy capability is
  # engine-specific and hand-authored per engine.
  - id: pages-deploy
    name: "Deploy the communication site to GitHub Pages"
    trigger:
      - on: push
        branches: [main]
        paths:
          - "communication/**"
      - on: manual
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Uses the GitHub-Pages-specific action chain
        `actions/configure-pages` → `actions/upload-pages-artifact` →
        `actions/deploy-pages` against the `github-pages` deployment
        environment (.github/workflows/pages.yml lines 26-38). GitHub Pages is
        a GitHub-hosted product with no faithful equivalent on GitLab CI
        (GitLab Pages is a distinct surface with its own job contract), so the
        deploy capability is hand-authored per engine, not generated.

  # --- Engine-specific: Windows runner scaffolding (spec 0240 R12-R15) -----

  # The reusable `windows-latest` job shape: Node.js 24 invoked from a
  # non-POSIX interpreter (pwsh), the portable shared-module suites, and the
  # timing-budget harness applied to the floor guard. Later sub-specs copy the
  # job and record each copy here the same way.
  - id: windows-node-floor-guard
    name: "Windows scaffolding: floor guard, shared modules and timing budget"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Runs on the GitHub-hosted `windows-latest` runner
        (.github/workflows/build.yml, job `windows-node-floor-guard`). GitLab
        CI, as configured for this repository, exposes no Windows runner:
        every generated GitLab job derives its `image` from
        `requires.runtime` through `runtime_to_image`
        (scripts/build-ci.sh lines 70-81), which maps only to Linux Docker
        images, and .gitlab-ci.yml declares no runner `tags:` that could
        select a Windows executor. There is no faithful equivalent on the
        other supported engines (spec 0240 R15).

  # release-extension.yml (.github/workflows/release-extension.yml) is REMOVED
  # (spec 0183 R23, issue #1008): it packaged the committed source tree via
  # `npm pack`, a non-conforming release artifact under R17. The primary
  # driver (scripts/monorepo-release.sh, the `release` capability below)
  # already creates the release and uploads its own conforming asset on the
  # SAME tag it pushes, so a second, conforming path would race it and put a
  # second asset on the release — which the vendor's measured one-asset gate
  # (specs/0183-extension-model-migration.delta-01.md Notes) forbids as
  # firmly as the non-conforming one did. There is no replacement capability:
  # the property this capability asserted (a tag-triggered release path)
  # is retired, not relocated.

  # release runs the monorepo release driver (scripts/monorepo-release.sh) on
  # push to main. Portable since spec 0213: the SAME driver and engine
  # (semantic-release) publish on both legs — GitHub Actions
  # (.github/workflows/release-monorepo.yml, @semantic-release/github) and
  # GitLab CI (the generated `release` job, @semantic-release/gitlab to the
  # generic package registry plus a GitLab release). The driver detects the
  # forge itself and sets the GitHub commit identity itself, so the business
  # steps are identical on both engines. The credential crosses the engines
  # under the one env key RELEASE_TOKEN (spec 0131 compares env KEYS): its
  # GitLab value is the masked CI/CD variable $GITLAB_TOKEN (a project access
  # token with api + write_repository, allowed to push to the protected
  # release branch and to create tags); its GitHub value is
  # secrets.GITHUB_TOKEN. yq is required by the packager's render step
  # (scripts/build-extension.sh). Full history: the engine reads every tag.
  # The business steps diverge on one point, inside the driver (issue #1379,
  # docs/github-release-pr.md): on GitHub the release commit goes through a
  # release PR (branch release-pr/main, required checks dispatched through
  # build.yml's workflow_dispatch) because GitHub offers no ruleset bypass
  # for the Actions token; GitLab keeps pushing it to the protected branch.
  - id: release
    name: "Run the monorepo semantic-release pipeline"
    trigger:
      - on: push
        branches: [main]
    portability: portable
    requires:
      runtime: node@22
      tools: [jq, yq]
      history-depth: full
    env:
      RELEASE_TOKEN: "$GITLAB_TOKEN"
    command:
      - npm install --include=dev
      - bash scripts/monorepo-release.sh

  # release-rehearsal runs the same driver in rehearsal mode on demand
  # (spec 0213 R12): it computes each extension's next version, tag and
  # release note and builds the archive, with NO credential — the engine's dry
  # run happens in a throwaway clone whose every git remote operation is
  # redirected to a throwaway local mirror, and the config carries no publish
  # plugin. On GitLab run it from a branch pipeline (the driver refuses a
  # merge-request or tag pipeline).
  - id: release-rehearsal
    name: "Rehearse the monorepo release without publishing"
    trigger:
      - on: manual
    portability: portable
    requires:
      runtime: node@22
      tools: [jq, yq]
      history-depth: full
    env:
      RELEASE_DRY_RUN: "true"
    command:
      - npm install --include=dev
      - bash scripts/monorepo-release.sh

  # release-tests exercises the release driver (spec 0213 R17): the hermetic
  # driver test, the real-engine test against a local forge stub, and the
  # lint-safe changelog facade test (issue #1364), and the GitHub release-PR
  # sync test (issue #1379).
  # Deliberately NOT changeset-gated, for the same reason usage-storage above
  # is not — a node@22 capability must never enter the fail-safe job's
  # execution set (python@3.12, yq and node@24).
  - id: release-tests
    name: "Test the forge-aware monorepo release driver"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/monorepo-release.sh"
          - "scripts/lib/monorepo-release-lib.sh"
          - "scripts/lib/release-rehearse.mjs"
          - "scripts/lib/release-pr.ts"
          - "scripts/release-pr.ts"
          - "scripts/tests/release-pr.test.ts"
          - ".github/workflows/release-monorepo.yml"
          - "scripts/lib/release-notes/**"
          - "scripts/tests/test-monorepo-release*.sh"
          - "scripts/tests/release-changelog.test.ts"
          - ".markdownlintrc"
          - "scripts/tests/fixtures/release/**"
          - "scripts/release-package-extension.sh"
          - "scripts/build-extension.sh"
          - "package.json"
          - "package-lock.json"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/monorepo-release.sh"
          - "scripts/lib/monorepo-release-lib.sh"
          - "scripts/lib/release-rehearse.mjs"
          - "scripts/lib/release-pr.ts"
          - "scripts/release-pr.ts"
          - "scripts/tests/release-pr.test.ts"
          - ".github/workflows/release-monorepo.yml"
          - "scripts/lib/release-notes/**"
          - "scripts/tests/test-monorepo-release*.sh"
          - "scripts/tests/release-changelog.test.ts"
          - ".markdownlintrc"
          - "scripts/tests/fixtures/release/**"
          - "scripts/release-package-extension.sh"
          - "scripts/build-extension.sh"
          - "package.json"
          - "package-lock.json"
    portability: portable
    requires:
      runtime: node@22
      tools: [jq, yq]
    command:
      - npm install --include=dev
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-monorepo-release.sh
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-monorepo-release-engine.sh
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-changelog.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-pr.test.ts
