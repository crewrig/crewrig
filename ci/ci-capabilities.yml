  # GitLab CI (the generated `release` job, @semantic-release/gitlab to the
  # generic package registry plus a GitLab release). The driver detects the
  # forge itself and sets the GitHub commit identity itself, so the business
  # steps are identical on both engines. The credential crosses the engines
  # under the one env key RELEASE_TOKEN (spec 0131 compares env KEYS): its
  # GitLab value is the masked CI/CD variable $GITLAB_TOKEN (a project access
  # token with api + write_repository, allowed to push to the protected
  # release branch and to create tags); its GitHub value is
  # secrets.GITHUB_TOKEN. yq is required by the packager's render step
  # (scripts/build-extension.ts). Full history: the engine reads every tag.
  # The business steps diverge on one point, inside the driver (issue #1379,
  # docs/github-release-pr.md): on GitHub the release commit goes through a
  # release PR (branch release-pr/main, required checks dispatched through
  # build.yml's workflow_dispatch) because GitHub offers no ruleset bypass
  # for the Actions token; GitLab keeps pushing it to the protected branch.
