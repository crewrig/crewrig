    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install -g markdownlint-cli
      - markdownlint "**/*.md" --ignore node_modules --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md' --ignore 'artifacts/*/commands/*.md'

