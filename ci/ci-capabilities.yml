      - "scripts/lib/render-command.ts"
      - "scripts/lib/yaml-text.ts"
      - "scripts/lib/line-endings.ts"
      - "scripts/lib/paths.ts"
      - "scripts/lib/tmp-file.ts"
      - "scripts/lib/glob-engine.ts"
      - "scripts/lib/require-dependency.ts"
      - "scripts/lib/node-floor-guard.js"
      - "scripts/tests/extension-*.test.ts"
      - "scripts/tests/lib/extension-*.ts"
      - "scripts/tests/lib/shell-extension-harness.ts"
      - "scripts/tests/lib/plugin-ctx.ts"
      - "scripts/tests/lib/windows-extension-proof.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/tests/fixtures/extension-golden/**"
      - "scripts/tests/fixtures/extension-hooks/**"
      - "scripts/create-extension.ts"
      - "scripts/lib/create-extension/**"
      - "scripts/tests/create-extension-*"
      - "scripts/tests/lib/create-extension-*"
      - "scripts/tests/fixtures/create-extension/**"
      - "extensions/**"
      - "extension-skeleton/**"
      - "package.json"
      - "package-lock.json"
