  # Spec 0240 R4-R11, R13, R16: the Node.js floor guard, the production-
  # dependency step and the shared scripts/lib/ TypeScript modules, verified by
  # their node --test suites. No `paths:` filter, like `ratchet`: the suites
  # are fast, and a lockfile or setup-script change must re-run them.
  # production-dependencies.test.ts needs the npm registry and skips itself,
  # with a message, when `npm ping` fails.
  - id: runtime-foundations
    name: "Node.js floor guard, production-dependency step and shared TS modules"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24
    command:
      - npm ci
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/node-floor-guard.test.ts scripts/tests/paths.test.ts scripts/tests/line-endings.test.ts scripts/tests/tmp-file.test.ts scripts/tests/require-dependency.test.ts scripts/tests/check-timing-budget.test.ts scripts/tests/setup-dependency-step.test.ts scripts/tests/production-dependencies.test.ts
