  # run happens in a throwaway clone whose every git remote operation is
  # redirected to a throwaway local mirror, and the config carries no publish
  # plugin. On GitLab run it from a branch pipeline (the driver refuses a
  # merge-request or tag pipeline).
  - id: release-rehearsal
    name: "Rehearse the monorepo release without publishing"
    trigger:
      - on: manual
    portability: portable
    requires:
      runtime: node@24
      tools: [jq, yq]
      history-depth: full
    env:
      RELEASE_DRY_RUN: "true"
    command:
      - npm install --include=dev
      - node scripts/lib/node-floor-guard.js
      - node scripts/monorepo-release.ts

  # release-tests exercises the release driver (spec 0213 R17): the hermetic
  # driver test, the real-engine test against a local forge stub, and the
  # lint-safe changelog facade test (issue #1364), and the GitHub release-PR
  # sync test (issue #1379).
  # Deliberately NOT changeset-gated, for the same reason usage-storage above
  # is not — a node@22 capability must never enter the fail-safe job's
  # execution set (python@3.12, yq and node@24).
  - id: release-tests
    name: "Test the forge-aware monorepo release driver"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.ts"
      - "scripts/release-sync-manifests.ts"
      - "scripts/release-package-extension.ts"
      - "scripts/lib/monorepo-release/**"
      - "scripts/lib/packaging/**"
      - "scripts/lib/release-rehearse.mjs"
      - "scripts/lib/release-pr.ts"
      - "scripts/release-pr.ts"
      - "scripts/tests/release-pr.test.ts"
      - ".github/workflows/release-monorepo.yml"
      - "scripts/lib/release-notes/**"
      - "scripts/tests/monorepo-release-engine-*.test.ts"
      - "scripts/tests/monorepo-release-notes-real-engine.test.ts"
      - "scripts/tests/release-docs-and-workflows.test.ts"
      - "scripts/tests/release-golden-generator.test.ts"
      - "scripts/tests/release-changelog.test.ts"
      - "scripts/tests/release-driver-sandbox.test.ts"
      - "scripts/tests/monorepo-release-blackbox-*.test.ts"
      - "scripts/tests/lib/release-*.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/tests/fixtures/release-blackbox/**"
      - ".markdownlintrc"
      - "scripts/tests/fixtures/release/**"
      - "scripts/build-extension.ts"
      - "scripts/lib/extension/**"
      - "scripts/lib/org-mcp.ts"
      - "scripts/lib/node-floor-guard.js"
      - "package.json"
      - "package-lock.json"
    portability: portable
    requires:
      runtime: node@24
      tools: [jq, yq]
      history-depth: full
    command:
      - npm install --include=dev
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-docs-and-workflows.test.ts scripts/tests/release-golden-generator.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-engine-rehearsal.test.ts scripts/tests/monorepo-release-engine-gitlab-publish.test.ts scripts/tests/monorepo-release-engine-github-pr.test.ts scripts/tests/monorepo-release-engine-templates.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-changelog.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-pr.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-driver-sandbox.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-preflight.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-config.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-flows.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-flows2.test.ts
