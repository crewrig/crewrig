  # A short list of portable unit suites follows; the suites that spawn `bash`, `jq` or `yq` skip
  # themselves on win32 and are left to Linux. No timing budget and no `paths:` filter, like the
  # Windows jobs above: the proof must not skip silently on a change it does not list.
  - id: windows-extension-builders
    name: "Windows extension and plugin builders: production install, floor guard, golden proof and unit suites"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Runs on the GitHub-hosted `windows-latest` runner
        (.github/workflows/build.yml, job `windows-extension-builders`). GitLab
        CI, as configured for this repository, exposes no Windows runner:
        every generated GitLab job derives its `image` from
        `requires.runtime` through `runtime_to_image`
        (scripts/build-ci.ts lines 93-104), which maps only to Linux Docker
        images, and .gitlab-ci.yml declares no runner `tags:` that could
        select a Windows executor. There is no faithful equivalent on the
        other supported engines (spec 0240 R15, spec 0254 R23).


