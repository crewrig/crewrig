  # changeset-coverage is the exhaustive run (spec 0147 delta-01 R21): it has
  # no pull-request and no push trigger. It runs `scheduled` (daily, on the
  # default branch) and `manual`, and executes EVERY command of every
  # `changeset-gated: true` capability unconditionally, reading them from this
  # reference (via yq, never hardcoded). There is no diff and no base ref. The
  # pull-request guarantee that used to be this job's run-time fail-safe is now
  # the static `path-ownership` capability below. The job provisions
  # python@3.12, yq and node@24 (the secondary runtime also runs the
  # `mempalace` TypeScript test in the full suite), so a `node@22` capability
  # must still never be changeset-gated. `history-depth: full` is kept so the
  # gated commands see the same checkout on both engines.
  - id: changeset-coverage
    name: "Exhaustive run of every changeset-gated check"
    trigger:
      - on: scheduled
      - on: manual
    portability: portable
    requires:
      runtime: [python@3.12, node@24]
      tools: [yq]
      history-depth: full
    command:
      - bash scripts/ci-changeset-coverage.sh

  # changeset-coverage-test keeps the exhaustive script's regression test on the
  # pull-request path (spec 0147 delta-01 R23). It has never been path-filtered
  # and is not changeset-gated.
  - id: changeset-coverage-test
    name: "Test the exhaustive-run script"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24
      tools: [yq]
    command:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/ci-changeset-coverage.test.ts

  # path-ownership is the static ownership check (spec 0147 delta-01 R11-R18):
  # every tracked file is owned by the `paths:` of a pull-request capability or
  # exempted with a reason in ci/path-ownership-exemptions.txt (plus the
  # optional adopter overlay ci/org/path-ownership-exemptions.txt). It reads only
  # the working tree and this reference, never a base ref, so it has no
  # `paths:` filter and cannot be skipped. `npm ci` provides `js-yaml`.
  - id: path-ownership
    name: "Check path ownership and stray-scan wiring"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24
    command:
      - npm ci
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/check-path-ownership.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-path-ownership.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/ci-cache-guard-scan.test.ts scripts/tests/check-stray-scan-wiring.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-stray-scan-wiring.ts

  - id: lint-markdown
    name: "Lint Markdown files"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install -g markdownlint-cli
      - markdownlint "**/*.md" --ignore node_modules --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md' --ignore 'artifacts/*/commands/*.md'

  # Spec 0238 R1-R3, R13: the shell / JavaScript / Python footprint ratchet.
  # No `paths:` filter and not changeset-gated: any change may add a shell
  # file, so the ratchet runs on every change. Its list-growth and Python arms
  # diff against the merge-base with BASE_REF, hence `history-depth: full`.
  # Standard library only, so no `npm ci`.
  - id: ratchet
    name: "Shell, JavaScript and Python footprint ratchet"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24
      history-depth: full
    env:
      BASE_REF: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    command:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/check-ratchet.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-ratchet.ts

  # Spec 0238 R4-R8, R12, R13: type-check, erasable syntax, Oxlint type-aware
  # strict typing (max-lines as a non-blocking warning) and Oxfmt check mode
  # on every tracked *.ts outside the built-copy trees. No `paths:` filter: a
  # lockfile, tsconfig.json or lint-config change must re-run it too.
  - id: lint-typescript
    name: "TypeScript type-check, erasable syntax, lint and format"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24
    command:
      - npm ci
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/check-erasable-syntax.test.ts scripts/tests/lint-typescript.test.ts scripts/tests/check-typescript.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-built-trees.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts

  # Spec 0240 R4-R11, R13, R16: the Node.js floor guard, the production-
  # dependency step and the shared scripts/lib/ TypeScript modules, verified by
  # their node --test suites. No `paths:` filter, like `ratchet`: the suites
  # are fast, and a lockfile or setup-script change must re-run them.
  # production-dependencies.test.ts needs the npm registry and skips itself,
  # with a message, when `npm ping` fails.
  - id: runtime-foundations
    name: "Node.js floor guard, production-dependency step and shared TS modules"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
