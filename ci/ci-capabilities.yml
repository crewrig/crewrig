# CrewRig — platform-neutral CI capability reference (spec 0047).
#
# One entry per continuous-integration job, identified by a stable `id` that
# IS the pipeline job's YAML key on every engine (contract C2). The shape of
# this file is described normatively in `docs/ci-reference-format.md`
# (contract C1); the decision is recorded in `docs/adr/0012-ci-reference-contract.md`.
#
# Portable capabilities are generated into every engine's pipeline by
# sub-spec B. Engine-specific capabilities carry an `exception` with evidence
# that the mechanism has no faithful equivalent on the other supported
# engines (spec 0047 R5); they are hand-authored, never generated.
#
# This reference DESCRIBES existing jobs. It generates nothing, runs no drift
# check, and executes no pipeline — those are sub-specs B (#372), C (#373),
# and D (#374).

capabilities:
  # --- Portable: build.yml jobs -------------------------------------------
  # build.yml fires on pull_request and push to [main, release/**]
  # (.github/workflows/build.yml lines 3-9).

  - id: build
    name: "Build all extensions"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install
      - npm run build --workspaces --if-present

  # --- Portable: check-components decomposition (spec 0147) ----------------
  # The former monolithic `check-components` job (~85 sequential steps, >7 min)
  # is decomposed into focused, parallel, changeset-gated capabilities so the
  # CI critical-path wall-clock stays under 2 minutes (spec 0147 R1-R4). Each
  # focused capability keeps the same trigger (pull-request + push to
  # main/release/**) but ADDS a `paths:` filter covering the files its checks
  # exercise, and is marked `changeset-gated: true` so the `changeset-coverage`
  # fail-safe (R5) can read the focused path sets from this reference rather
  # than hardcoding them. The union of the focused `paths:` sets covers every
  # file the checks exercise; `changeset-coverage` (no `paths:` filter) is the
  # fail-safe that runs the full suite when a changed file falls outside the
  # union. Cached groups declare `cache:` (the key-derivation need: which files
  # + which env vars the cache key is derived from); the engine cache syntax is
  # the mechanism and is never written here (R6/R7).

  - id: component-drift
    name: "Check community component drift and run build-component tests"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/build-components.sh"
          - "scripts/test-build-components.sh"
          - "scripts/lib/**"
          - "artifacts/**"
          - "extensions/**"
          - ".crewrig/core-paths.txt"
          - "docs/layers.md"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/build-components.sh"
          - "scripts/test-build-components.sh"
          - "scripts/lib/**"
          - "artifacts/**"
          - "extensions/**"
          - ".crewrig/core-paths.txt"
          - "docs/layers.md"
    portability: portable
    changeset-gated: true
    requires:
      tools: [yq]
    cache:
      files:
        - "scripts/build-components.sh"
        - "scripts/test-build-components.sh"
        - "scripts/lib/**"
        - "artifacts/**"
        - "extensions/**"
        - ".crewrig/core-paths.txt"
      env: []
    command:
      - bash scripts/build-components.sh --target all --check
      - bash scripts/test-build-components.sh

  - id: extension-pivot
    name: "Enforce extension pivot sourcing and carrier round-trip"
    trigger:
