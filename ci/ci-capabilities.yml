      - bash scripts/tests/test-antigravity-discovery-probe.sh
      - bash scripts/tests/test-mempalace-version-range.sh
      # `packaging` is the spec-0108 launch guard's PRIMARY comparator and is the
      # branch in force on every serving interpreter that carries it, so CI must
      # exercise it against the real library rather than only against the degraded
      # fallback. test-mempalace-pin.sh fails loudly when no interpreter here can
