      - "scripts/tests/agent-profile-*.test.ts"
      - "scripts/tests/lib/build-sandbox.ts"
      - "scripts/lib/**"
      - "artifacts/**"
      - "extensions/**"
      - ".crewrig/core-paths.txt"
      - "docs/layers.md"
      - "docs/agent-profile-migration.md"
      - "model-mappings/**"
    portability: portable
    changeset-gated: true
    requires:
      runtime: node@24
      tools: [yq, task]
      install: omit-dev
    cache:
      files:
        - "scripts/build-components.ts"
        - "scripts/build-components.ts"
        - "scripts/tests/build-components-canonical-repo.test.ts"
        - "scripts/tests/agent-profile-*.test.ts"
        - "scripts/tests/lib/build-sandbox.ts"
        - "scripts/lib/**"
        - "artifacts/**"
        - "extensions/**"
        - ".crewrig/core-paths.txt"
        - "docs/agent-profile-migration.md"
        - "model-mappings/**"
        - "scripts/ci-cache-guard.ts"
