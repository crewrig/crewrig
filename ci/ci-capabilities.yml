  # Spec 0240 R3: the floor guard's failure path, proven on a Node.js release
  # that cannot strip types. Each command is plain POSIX so the job needs no
  # TypeScript; the grep tokens are the guard's stable diagnostic contract
  # (scripts/lib/node-floor-guard.js header).
  - id: node-floor-guard
    name: "Node.js floor guard rejects a pre-24 release"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@20
    command:
      - 'if node scripts/lib/node-floor-guard.js >guard.out 2>&1; then echo "guard accepted Node $(node -v)"; exit 1; fi'
      - 'grep -F "$(node -v) detected" guard.out'
      - 'grep -F "requires Node.js >= 24" guard.out'
      - 'grep -F "https://nodejs.org/en/download" guard.out'
      - 'if grep -E "SyntaxError|ERR_|Cannot find module" guard.out; then exit 1; fi'

