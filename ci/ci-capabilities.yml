  # e2e is the heaviest group; it stays enforced on push/PR (changeset-gated)
  # but is ALSO manually triggerable (spec 0147 R8) so a contributor can run it
  # on demand without waiting for the full pipeline. The `manual` trigger maps
  # to GitLab `when: manual` and GHA `workflow_dispatch`.
