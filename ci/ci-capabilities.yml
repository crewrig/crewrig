  # Spec 0238 R1-R3, R13: the shell / JavaScript / Python footprint ratchet.
  # No `paths:` filter and not changeset-gated: any change may add a shell
  # file, so the ratchet runs on every change. Its list-growth and Python arms
  # diff against the merge-base with BASE_REF, hence `history-depth: full`.
  # Standard library only, so no `npm ci`.
  - id: ratchet
    name: "Shell, JavaScript and Python footprint ratchet"
    trigger:
