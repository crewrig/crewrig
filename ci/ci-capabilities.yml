      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/tests/fixtures/build-components/**"
      - "scripts/lib/node-floor-guard.js"
      - "taskfiles/ci.yml"
      - ".github/workflows/build.yml"
      - "ci/ci-capabilities.yml"
    portability: portable
    changeset-gated: true
    requires:
      runtime: node@24
      tools: [task]
      install: omit-dev
    cache:
      files:
        - "scripts/build-components.ts"
        - "scripts/lib/**"
        - "package.json"
        - "package-lock.json"
        - "scripts/tests/build-assembly-routing.test.ts"
        - "scripts/tests/build-components-canonical-repo.test.ts"
        - "scripts/tests/lib/build-sandbox.ts"
        - "scripts/tests/lib/build-fixture-tree.ts"
        - "scripts/tests/fixtures/build-components/**"
        - "scripts/lib/node-floor-guard.js"
        - "scripts/ci-cache-guard.ts"
      env: []
    command:
      - task ci:component-drift-selftest

  - id: agent-profile-migration
    name: "Run the agent-profile migration regression suite"
    trigger:
