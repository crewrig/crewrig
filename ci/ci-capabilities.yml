          - "scripts/tests/test-model-resolution.sh"
          - "scripts/tests/test-agent-profile-migration.sh"
          - "scripts/lib/**"
          - "artifacts/**"
          - "extensions/**"
          - ".crewrig/core-paths.txt"
          - "docs/layers.md"
          - "docs/agent-profile-migration.md"
          - "model-mappings/**"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/build-components.sh"
          - "scripts/build-components.ts"
          - "scripts/test-build-components.sh"
          - "scripts/tests/test-model-resolution.sh"
          - "scripts/tests/test-agent-profile-migration.sh"
          - "scripts/lib/**"
          - "artifacts/**"
          - "extensions/**"
          - ".crewrig/core-paths.txt"
          - "docs/layers.md"
          - "docs/agent-profile-migration.md"
          - "model-mappings/**"
    portability: portable
    changeset-gated: true
    requires:
      runtime: node@24
      tools: [yq]
    cache:
      files:
        - "scripts/build-components.sh"
        - "scripts/build-components.ts"
        - "scripts/test-build-components.sh"
        - "scripts/tests/test-model-resolution.sh"
        - "scripts/tests/test-agent-profile-migration.sh"
        - "scripts/lib/**"
        - "artifacts/**"
        - "extensions/**"
        - ".crewrig/core-paths.txt"
        - "docs/agent-profile-migration.md"
        - "model-mappings/**"
        - "scripts/ci-cache-guard.sh"
      env: []
    command:
      - npm ci --omit=dev --workspaces=false
      - bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-agent-profile-migration.sh

  # Spec 0250 R27, R28 (issue #1332): the TypeScript component-build core, its
  # shared library twins and their node --test suites. `paths:` lists every
  # entry literally (only `*` and `**`, the forms scripts/lib/glob-engine.ts
  # accepts: no brace alternation). A glob that matches nothing yet is accepted
  # by scripts/check-path-ownership.ts, which only flags unowned files and
  # stale exemptions. Needs yq because the parity suites drive the shell build.
  # The install is the production command of spec 0240 R4, so a suite that
  # imports a devDependency fails here: the suites are NAMED, not globbed, to
