  # Spec 0258 R27-R29 (ticket #1337), PR A: the skill-script oracle. The harness runs each shell
  # script bundled with a skill in a sandbox and compares stdout, stderr, the exit code and the
  # resulting tree with the committed goldens. Linux only: the goldens are Linux bytes, and the
  # suites spawn `bash`, `jq` and Go `yq` (the YAML leg of the pr-reviewer lint-skill script).
  # The job needs the production install and the system tools only, never the dev-toolchain (no
  # Oxlint). On GitHub, `yq` is pinned to v4.44.3 and its sha256 is checked, the version the goldens
  # were generated with. The floor guard runs after the production dependency step, before the
  # first test call. PR B adds the shell-against-entry differential (Linux), the package-layout and
  # copied-skill suites (Node only) and the oracle mutation suite (git and a Node install).
  - id: skill-scripts-ts
    name: "Run the skill-script oracle and its YAML leg"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "artifacts/**/skills/*/scripts/**"
      - "scripts/tests/skill-scripts-*"
      - "scripts/tests/lib/skill-scripts-*"
      - "scripts/tests/fixtures/skill-scripts/**"
      - "scripts/tests/callers-sweep.test.ts"
      - "scripts/tests/lib/callers-sweep.ts"
      - "artifacts/**"
      - "README.md"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "scripts/lib/taskfile-tree.ts"
      - "scripts/lib/taskfile-tree-parse.ts"
      - "scripts/lib/governance/taskfile-tree-guard.ts"
    portability: portable
    requires:
      runtime: node@24
      tools: [jq, yq, task]
      install: omit-dev
      yq: "4.44.3"
    command:
      - task ci:skill-scripts-ts

