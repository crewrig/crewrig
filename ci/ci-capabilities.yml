  # changeset-coverage is the exhaustive run (spec 0147 delta-01 R21): it has
  # no pull-request and no push trigger. It runs `scheduled` (daily, on the
  # default branch) and `manual`, and executes EVERY command of every
  # `changeset-gated: true` capability unconditionally, reading them from this
  # reference (via yq, never hardcoded). There is no diff and no base ref. The
  # pull-request guarantee that used to be this job's run-time fail-safe is now
  # the static `path-ownership` capability below. The job provisions
  # python@3.12, yq and node@24 (the secondary runtime also runs the
  # `mempalace` TypeScript test in the full suite), so a `node@22` capability
  # must still never be changeset-gated. `history-depth: full` is kept so the
  # gated commands see the same checkout on both engines.
  - id: changeset-coverage
    name: "Exhaustive run of every changeset-gated check"
    trigger:
      - on: scheduled
      - on: manual
    portability: portable
    requires:
      runtime: [python@3.12, node@24]
      tools: [yq, jq, task, tesseract]
      history-depth: full
    command:
      - npm ci --omit=dev --workspaces=false
      - node scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-changeset-coverage.ts

  # changeset-coverage-test keeps the exhaustive script's regression test on the
  # pull-request path (spec 0147 delta-01 R23). It has never been path-filtered
  # and is not changeset-gated.
  - id: changeset-coverage-test
    name: "Test the exhaustive-run script"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
