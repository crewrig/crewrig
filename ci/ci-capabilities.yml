# CrewRig — platform-neutral CI capability reference (spec 0047).
#
# One entry per continuous-integration job, identified by a stable `id` that
# IS the pipeline job's YAML key on every engine (contract C2). The shape of
# this file is described normatively in `docs/ci-reference-format.md`
# (contract C1); the decision is recorded in `docs/adr/0012-ci-reference-contract.md`.
#
# Portable capabilities are generated into every engine's pipeline by
# sub-spec B. Engine-specific capabilities carry an `exception` with evidence
# that the mechanism has no faithful equivalent on the other supported
# engines (spec 0047 R5); they are hand-authored, never generated.
#
# This reference DESCRIBES existing jobs. It generates nothing, runs no drift
# check, and executes no pipeline — those are sub-specs B (#372), C (#373),
# and D (#374).

capabilities:
  # --- Portable: build.yml jobs -------------------------------------------
  # build.yml fires on pull_request and push to [main, release/**]
  # (.github/workflows/build.yml lines 3-9).

  - id: build
    name: "Build all extensions"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install
      - npm run build --workspaces --if-present

  # --- Portable: check-components decomposition (spec 0147) ----------------
  # The former monolithic `check-components` job (~85 sequential steps, >7 min)
  # is decomposed into focused, parallel, changeset-gated capabilities so the
  # CI critical-path wall-clock stays under 2 minutes (spec 0147 R1-R4). Each
  # focused capability keeps the same trigger (pull-request + push to
  # main/release/**) but ADDS a `paths:` filter covering the files its checks
  # exercise, and is marked `changeset-gated: true` so the `changeset-coverage`
  # exhaustive run (spec 0147 delta-01 R21) can read the gated commands from
  # this reference rather than hardcoding them. Every tracked file is either
  # owned by one of the focused `paths:` sets or carries a reasoned exemption
  # (`ci/path-ownership-exemptions.txt`), which the `path-ownership` capability
  # (no `paths:` filter) checks statically on every change; the exhaustive run
  # is the daily and on-demand net underneath. Cached groups declare `cache:`
  # (the key-derivation need: which files + which env vars the cache key is
  # derived from); the engine cache syntax is the mechanism and is never written
  # here (R6/R7).

  - id: component-drift
    name: "Check community component drift and run build-component tests"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "scripts/build-components.ts"
      - "scripts/build-components.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/tests/build-components-canonical-repo.test.ts"
      - "scripts/tests/agent-profile-*.test.ts"
      - "scripts/tests/lib/build-sandbox.ts"
      - "scripts/lib/**"
      - "artifacts/**"
      - "extensions/**"
      - ".crewrig/core-paths.txt"
      - "docs/layers.md"
      - "docs/agent-profile-migration.md"
      - "model-mappings/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - ".gemini/skills/**"
      - ".github/skills/**"
      - ".gemini/commands/**"
      - ".agents/agents/**"
      - ".claude/agents/**"
      - ".gemini/agents/**"
      - ".github/agents/**"
      - "crewrig.config.toml"
    portability: portable
    changeset-gated: true
    requires:
      runtime: node@24
      tools: [task]
      install: omit-dev
    cache:
      files:
        - "scripts/build-components.ts"
        - "scripts/build-components.ts"
        - "package.json"
        - "package-lock.json"
        - "scripts/tests/build-components-canonical-repo.test.ts"
        - "scripts/tests/agent-profile-*.test.ts"
        - "scripts/tests/lib/build-sandbox.ts"
        - "scripts/lib/**"
        - "artifacts/**"
        - "extensions/**"
        - ".crewrig/core-paths.txt"
        - "docs/agent-profile-migration.md"
        - "model-mappings/**"
        - ".agents/skills/**"
        - ".claude/skills/**"
        - ".gemini/skills/**"
        - ".github/skills/**"
        - ".gemini/commands/**"
        - ".agents/agents/**"
        - ".claude/agents/**"
        - ".gemini/agents/**"
        - ".github/agents/**"
        - "crewrig.config.toml"
      env: []
    command:
      - task ci:component-drift

  - id: component-drift-selftest
    name: "Self-test the component assembly routing and canonical-repo build"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "scripts/build-components.ts"
      - "scripts/lib/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/tests/build-assembly-routing.test.ts"
      - "scripts/tests/build-components-canonical-repo.test.ts"
