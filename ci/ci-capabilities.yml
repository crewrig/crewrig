      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts

  # Spec 0240 R4-R11, R13, R16: the Node.js floor guard, the production-
  # dependency step and the shared scripts/lib/ TypeScript modules, verified by
  # their node --test suites. No `paths:` filter, like `ratchet`: the suites
  # are fast, and a lockfile or setup-script change must re-run them.
  # production-dependencies.test.ts needs the npm registry and skips itself,
  # with a message, when `npm ping` fails.
  - id: runtime-foundations
