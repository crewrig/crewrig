    command:
      - task ci:extension-builders-ts

  # Spec 0254 R4: the extension entries print nothing on the oldest Node.js 24 release, where
  # type stripping still emits an ExperimentalWarning. No `paths:` filter, like
  # build-components-ts-node-24-0: the suite is fast and any shared-module change can
  # reintroduce a warning. The production install comes first, as the suite runs builds.
  - id: extension-builders-ts-node-24-0
    name: "Extension and plugin builder entries are silent on Node.js 24.0.0"
    trigger:
