  # --- Portable: standalone workflows -------------------------------------

  # scripting-conventions.yml gates on pull_request to [main, release/**] with
  # a path filter (.github/workflows/scripting-conventions.yml lines 3-9).
  # The two inline grep blocks need no runtime or extra tools — POSIX shell
  # only — so `requires:` is omitted (an empty engine-agnostic need).
  - id: grep-anti-patterns
    name: "Flag scripting anti-patterns in scripts and hooks"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/**"
          - "hooks/**"
          - ".github/workflows/scripting-conventions.yml"
    portability: portable
    command:
      - |
        set -uo pipefail
        hits=$(grep -rnE '\[\[?[^]]*\]\]?[[:space:]]+&&[[:space:]]+.*&&[[:space:]]+exit[[:space:]]+[0-9]+' \
                scripts/ hooks/ \
              | grep -v 'acknowledged-exception:' || true)
        if [ -n "$hits" ]; then
          echo "::error::Rule 3 violation — chained-test exit pattern (see docs/scripting-conventions.md)"
          echo "$hits"
          exit 1
        fi
        echo "Rule 3 clean."
      - |
        set -uo pipefail
        hits=$(grep -rnE 'except[[:space:]]*:|except[[:space:]]+(Exception|BaseException)[[:space:]]*(as[[:space:]]+\w+)?[[:space:]]*:' \
                scripts/ hooks/ \
              | grep -v 'acknowledged-exception:' || true)
        if [ -n "$hits" ]; then
          echo "::error::Rule 1 violation — bare/broad except (see docs/scripting-conventions.md)"
          echo "$hits"
          exit 1
        fi
        echo "Rule 1 clean."
      - bash scripts/check-bash32-portability.sh
      - bash scripts/check-pipefail-grep.sh

  # security-mcp.yml gates on pull_request to [main] with a path filter on the
  # MCP/dependency manifests (.github/workflows/security-mcp.yml lines 3-11).
  - id: audit
    name: "Run dependency security audit"
    trigger:
