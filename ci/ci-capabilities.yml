    command:
      - task ci:agent-profile-migration

  # Spec 0250 R27, R28 (issue #1332): the TypeScript component-build core, its
  # shared library twins and their node --test suites. `paths:` lists every
  # entry literally (only `*` and `**`, the forms scripts/lib/glob-engine.ts
  # accepts: no brace alternation). A glob that matches nothing yet is accepted
  # by scripts/check-path-ownership.ts, which only flags unowned files and
  # stale exemptions. Needs yq because the parity suites drive the shell build.
  # The install is the production command of spec 0240 R4, so a suite that
  # imports a devDependency fails here: the suites are NAMED, not globbed, to
  # keep the dev-toolchain suite (build-components-built-trees.test.ts, which
  # needs Oxlint, Oxfmt and tsc and runs in `lint-typescript`) out of this job.
  # `--check` on the real tree and the Linux run of the Windows proof script
  # cover the committed trees. The conformance, differential and YAML corpus
  # suites spawn `bash` and `yq` and retire with the shell script (PR D).
  - id: build-components-ts
    name: "Run the TypeScript component-build core and shared library twin suites"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    paths:
      - "scripts/build-components.*"
      - "scripts/lib/build-components/**"
      - "scripts/lib/render-command.ts"
      - "scripts/lib/component-resolve.ts"
      - "scripts/lib/model-resolve.ts"
      - "scripts/lib/yaml-text.ts"
      - "scripts/lib/escape-control.ts"
      - "scripts/lib/line-endings.ts"
      - "scripts/lib/paths.ts"
      - "scripts/lib/tmp-file.ts"
      - "scripts/lib/require-dependency.ts"
      - "scripts/lib/node-floor-guard.js"
      - "scripts/lib/model-resolve/**"
      - "scripts/tests/build-components-*.test.ts"
      - "scripts/tests/build-sandbox.test.ts"
      - "scripts/tests/repo-agent-frontmatter.test.ts"
      - "scripts/tests/lib/build-sandbox.ts"
      - "scripts/tests/yaml-text.test.ts"
      - "scripts/tests/render-command.test.ts"
      - "scripts/tests/component-resolve.test.ts"
      - "scripts/tests/model-resolve-*.test.ts"
      - "scripts/tests/lib/yaml-lib.ts"
      - "scripts/tests/lib/shell-resolve-harness.ts"
      - "scripts/tests/lib/mapping-fixtures.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/tests/lib/windows-build-proof.ts"
      - "scripts/tests/lib/shim-env.ts"
      - "scripts/tests/fixtures/build-components/**"
      - "artifacts/**"
      - "model-mappings/**"
      - "tests/fixtures/**"
      - "crewrig.config.toml"
      - "package.json"
      - "package-lock.json"
      - ".agents/agents/**"
      - ".agents/skills/**"
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".gemini/agents/**"
      - ".gemini/commands/**"
      - ".gemini/skills/**"
      - ".github/agents/**"
      - ".github/skills/**"
    portability: portable
    requires:
      runtime: node@24
      tools: [yq, task]
      install: omit-dev
    command:
      - task ci:build-components-ts

  # Spec 0250 R3, R27: the build entry prints nothing on the oldest Node.js 24
  # release, where type stripping still emits an ExperimentalWarning. No
  # `paths:` filter, like mempalace-transcript-node-24-0 below: the suite is
  # fast and any shared-module change can reintroduce a warning. The production
  # install comes first, as the entry-form suite runs a build that loads js-yaml.
  - id: build-components-ts-node-24-0
    name: "Component build entry is silent on Node.js 24.0.0"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24.0.0
    command:
      - npm ci --omit=dev --workspaces=false
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-entry-form.test.ts

  # Spec 0254 R22, R27: the TypeScript extension and plugin builder modules, entries and
  # twin suites (row G1b of epic #1231). `jq`, `yq` and `bash` are spawned on purpose by the
  # corpus, context, conformance, shell-comparison, golden-shell and differential suites,
  # which retire with the shell scripts and libraries (PR D, rows I1, J3, J4). `yq` stays
  # declared until the differential test is deleted (plan v1-F2). The proof script and the
  # `--check` on the real tree run here too, so Linux and Windows prove the same bytes.
  # The install carries the dev dependencies: the scaffold toolchain test (spec 0258 requirement 26)
  # runs tsc, Oxlint and Oxfmt and fails, rather than skips, when CI is set and one is absent.
  - id: extension-builders-ts
    name: "Run the TypeScript extension and plugin builder suites, the golden proof and the real-tree check"
    trigger:
