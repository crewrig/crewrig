      - bash scripts/tests/test-check-spec-id-reserved.sh

  - id: frontmatter
    name: "Test frontmatter, skill-version, and assembly contracts"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/tests/test-extract-frontmatter.sh"
          - "scripts/tests/test-check-skill-versions.sh"
          - "scripts/tests/test-check-feedback-routing.sh"
          - "scripts/tests/test-assembly-verification.sh"
          - "scripts/tests/test-artifact-build-install-scope.sh"
          - "scripts/tests/test-component-tier-resolution.sh"
          - "scripts/lib/**"
          - "artifacts/**"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/tests/test-extract-frontmatter.sh"
          - "scripts/tests/test-check-skill-versions.sh"
          - "scripts/tests/test-check-feedback-routing.sh"
          - "scripts/tests/test-assembly-verification.sh"
          - "scripts/tests/test-artifact-build-install-scope.sh"
          - "scripts/tests/test-component-tier-resolution.sh"
          - "scripts/lib/**"
          - "artifacts/**"
    portability: portable
    changeset-gated: true
    requires:
      tools: [yq]
    command:
      - bash scripts/tests/test-extract-frontmatter.sh
      - bash scripts/tests/test-check-skill-versions.sh
      - bash scripts/tests/test-check-feedback-routing.sh
      - bash scripts/tests/test-assembly-verification.sh
      - bash scripts/tests/test-artifact-build-install-scope.sh
      - bash scripts/tests/test-component-tier-resolution.sh

  - id: markdown-links
    name: "Check relative Markdown link integrity"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/check-markdown-links.sh"
          - "scripts/tests/test-check-markdown-links.sh"
          - "docs/**"
          - "README.md"
          - "AGENTS.md"
          - "**/*.md"
      - on: push
        branches: [main, "release/**"]
        paths:
          - "scripts/check-markdown-links.sh"
          - "scripts/tests/test-check-markdown-links.sh"
          - "docs/**"
          - "README.md"
          - "AGENTS.md"
          - "**/*.md"
    portability: portable
    changeset-gated: true
    requires:
      runtime: python@3.12
    command:
      - bash scripts/check-markdown-links.sh
      - bash scripts/tests/test-check-markdown-links.sh

  # changeset-coverage is the fail-safe (spec 0147 R5): it carries NO `paths:`
  # filter, so it runs on every change on both engines. Its command reads the
  # focused `paths:` sets from this reference (via yq, never hardcoded),
  # computes the changed files, and — when a changed file is not covered by the
  # union of the focused path sets — runs the full check suite; when every
  # changed file is covered it is a fast no-op.
  - id: changeset-coverage
    name: "Fail-safe: run the full check suite when a change is uncovered"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: python@3.12
      tools: [yq]
      history-depth: full
    command:
      - bash scripts/ci-changeset-coverage.sh

  - id: lint-markdown
    name: "Lint Markdown files"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install -g markdownlint-cli
      - markdownlint "**/*.md" --ignore node_modules --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md'

  # The spec linter's base-branch `status: draft` check (spec 0109 R2) resolves
  # the change's base ref, so the job needs full source history — declared as
  # `history-depth: full`, same as the two version-bump guards below.
  - id: lint-specs
    name: "Lint specification files"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@22
      tools: [task]
      history-depth: full
    env:
      BASE_REF: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    command:
      - npm install
      - bash scripts/tests/test-spec-linter.sh
      - task spec:lint

  - id: test-harness-curate
    name: "Smoke-test the harness curator"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      tools: [jq]
    command:
      - bash artifacts/library/skills/harness-curator/scripts/test.sh

  # check-skill-versions and check-extension-version-bump compare the change
  # against its base ref; the workflow gates them on
  # `if: github.event_name == 'pull_request'`
  # (.github/workflows/build.yml lines 173, 186), so the neutral trigger is
  # pull-request only. They need full source history (GHA `fetch-depth: 0`)
  # to resolve the base ref — declared as `history-depth: full` (delta-02 R12).
  - id: check-skill-versions
    name: "Enforce version bump on changed skill/agent sources"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
    portability: portable
    requires:
      history-depth: full
    env:
      BASE_REF: "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    command:
      - bash scripts/check-skill-versions.sh

  - id: check-extension-version-bump
    name: "Enforce carrier-version bump on changed extension sources"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
    portability: portable
    requires:
      history-depth: full
    env:
      BASE_REF: "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    command:
      - bash scripts/check-extension-version-bump.sh

  # check-spec-id-reserved compares the change against its base ref and reads
  # the reservation namespaces on the remote, so it needs full source history —
  # declared as `history-depth: full`, same as the two version-bump guards above.
  # The workflow gates it on `if: github.event_name == 'pull_request'` (the
  # origin discrimination of spec 0112 R10 has no meaning on a push), so the
  # neutral trigger is pull-request only.
  #
  # NO `tools:` KEY, deliberately. The generated GitLab job runs on the default
  # `debian:stable-slim` image, which ships no git, so git is installed
  # CONDITIONALLY as the first line of `command:` — a business step, not setup.
  # Declaring `tools: [git]` instead would fail check-ci-parity.sh Arm 1 unless
  # three coordinated edits landed (a `tool_install_lines` recipe in
  # build-ci.sh, an `install_recipe_tool` pattern in check-ci-parity.sh, and a
  # hand-authored GHA install step); this shape needs none of them. Note the
  # `lint-markdown` analogy is looser than it looks: that job's inline install
  # IS recognized by `install_recipe_tool()` and skipped as setup, whereas this
  # git line stays a business step matching `command[0]` verbatim — which is why
  # it must carry NO nested `sudo` (`normalize_cmd` strips only a *leading* one,
  # so a nested `sudo` would diverge from the declared command).
  - id: check-spec-id-reserved
    name: "Verify every spec id added by the change was secured"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
    portability: portable
    requires:
      history-depth: full
    env:
      BASE_REF: "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      CREWRIG_PR_BASE_REPO: "$CI_PROJECT_PATH"
      CREWRIG_PR_HEAD_REPO: "$CI_MERGE_REQUEST_SOURCE_PROJECT_PATH"
    command:
      - command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)
      - bash scripts/check-spec-id-reserved.sh

  - id: check-agents-size
    name: "Check AGENTS.md file size"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    command:
      - bash scripts/check-agents-size.sh

  - id: check-feedback-routing
    name: "Enforce upstream-tier feedback routing"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      tools: [yq]
    command:
      - bash scripts/check-feedback-routing.sh

  # --- Portable: standalone workflows -------------------------------------

  # scripting-conventions.yml gates on pull_request to [main, release/**] with
  # a path filter (.github/workflows/scripting-conventions.yml lines 3-9).
  # The two inline grep blocks need no runtime or extra tools — POSIX shell
  # only — so `requires:` is omitted (an empty engine-agnostic need).
  - id: grep-anti-patterns
    name: "Flag scripting anti-patterns in scripts and hooks"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
        paths:
          - "scripts/**"
          - "hooks/**"
          - ".github/workflows/scripting-conventions.yml"
    portability: portable
    command:
      - |
        set -uo pipefail
        hits=$(grep -rnE '\[\[?[^]]*\]\]?[[:space:]]+&&[[:space:]]+.*&&[[:space:]]+exit[[:space:]]+[0-9]+' \
                scripts/ hooks/ \
              | grep -v 'acknowledged-exception:' || true)
        if [ -n "$hits" ]; then
          echo "::error::Rule 3 violation — chained-test exit pattern (see docs/scripting-conventions.md)"
          echo "$hits"
          exit 1
        fi
        echo "Rule 3 clean."
      - |
        set -uo pipefail
        hits=$(grep -rnE 'except[[:space:]]*:|except[[:space:]]+(Exception|BaseException)[[:space:]]*(as[[:space:]]+\w+)?[[:space:]]*:' \
                scripts/ hooks/ \
              | grep -v 'acknowledged-exception:' || true)
        if [ -n "$hits" ]; then
          echo "::error::Rule 1 violation — bare/broad except (see docs/scripting-conventions.md)"
          echo "$hits"
          exit 1
        fi
        echo "Rule 1 clean."
      - bash scripts/check-bash32-portability.sh

  # security-mcp.yml gates on pull_request to [main] with a path filter on the
  # MCP/dependency manifests (.github/workflows/security-mcp.yml lines 3-11).
  - id: audit
    name: "Run dependency security audit"
    trigger:
      - on: pull-request
        branches: [main]
        paths:
          - "**/package.json"
          - "**/settings.json"
          - "**/mcp.json"
          - "**/mcp.json.template"
          - "**/extension.json"
    portability: portable
    requires:
      runtime: node@22
    command:
      - npm install
      - npm audit --audit-level=critical

  # gitlab-ci-check is the generator's own drift gate (spec 0048 R6/R7),
  # registered as a portable capability so the verification surface is itself
  # contract-described, not a hidden gate. Its command diffs the committed
  # .gitlab-ci.yml against a fresh derivation; it needs yq to read the
  # reference (delta-02 R12).
  - id: gitlab-ci-check
    name: "Verify the generated GitLab pipeline matches the contract"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      tools: [yq]
    command:
      - bash scripts/build-ci.sh --check

  # check-ci-parity is the 3-way CI drift harness (spec 0049). It checks the
  # reference against both engine pipelines on the portable capability set;
  # registered as a portable capability (spec 0049 R11) so the verification
  # surface is itself contract-described and parity-checked — symmetric with
  # gitlab-ci-check above. It shells `yq` to read the reference and the
  # pipelines, and composes `build-ci.sh --check` (which also needs yq) for the
  # reference↔GitLab arm; hence `tools: [yq]` (delta-02 R12).
  - id: check-ci-parity
    name: "Verify the reference, GitHub Actions, and GitLab pipelines agree"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      tools: [yq]
    command:
      - bash scripts/check-ci-parity.sh

  # --- Engine-specific: bot-mention assistants ----------------------------
  # A bot-mention trigger (an issue or review comment) is engine-specific,
  # never portable (spec 0047 R5).

  - id: claude
    name: "Claude Code mention-triggered assistant"
    trigger:
      - on: manual
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Triggered by GitHub `issue_comment` / `pull_request_review_comment`
        events gated on a literal `@claude` mention
        (.github/workflows/claude.yml lines 3-13). GitLab CI exposes no
        comment-event pipeline trigger, so there is no faithful equivalent on
        the other supported engines. A bot-mention trigger is treated as
        engine-specific, never portable (spec 0047 R5); the analogous non-GHA
        surfaces are marked [GAP] in docs/cli-matrix.md.

  - id: copilot
    name: "GitHub Copilot CLI mention-triggered assistant"
    trigger:
      - on: manual
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Triggered by GitHub `issue_comment` / `pull_request_review_comment`
        events gated on a literal `@copilot-cli` mention
        (.github/workflows/copilot.yml lines 13-23); native `@copilot`
        dispatch is configured at the repository/organization level, not
        portable to GitLab CI. A bot-mention trigger is treated as
        engine-specific, never portable (spec 0047 R5).

  # --- Engine-specific: GitHub-native delivery surfaces --------------------

  # pages.yml deploys the `communication/` site to GitHub Pages on push to main
  # and via workflow_dispatch (.github/workflows/pages.yml lines 3-8). GitHub
  # Pages is a GitHub-hosted product; GitLab's equivalent (GitLab Pages) is a
  # distinct surface with its own job contract, so the deploy capability is
  # engine-specific and hand-authored per engine.
  - id: pages-deploy
    name: "Deploy the communication site to GitHub Pages"
    trigger:
      - on: push
        branches: [main]
        paths:
          - "communication/**"
      - on: manual
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Uses the GitHub-Pages-specific action chain
        `actions/configure-pages` → `actions/upload-pages-artifact` →
        `actions/deploy-pages` against the `github-pages` deployment
        environment (.github/workflows/pages.yml lines 26-38). GitHub Pages is
        a GitHub-hosted product with no faithful equivalent on GitLab CI
        (GitLab Pages is a distinct surface with its own job contract), so the
        deploy capability is hand-authored per engine, not generated.

  # release-extension.yml packages an extension and creates a GitHub Release on
  # a matching version tag (.github/workflows/release-extension.yml lines 3-6).
  - id: package-and-release
    name: "Package an extension and create a GitHub Release on a version tag"
    trigger:
      - on: tag
        tag-pattern: "*-v[0-9]*.[0-9]*.[0-9]*"
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Creates a GitHub Release via `softprops/action-gh-release`
        (.github/workflows/release-extension.yml lines 70-75), a
        GitHub-Releases-specific surface. GitLab's release mechanism
        (`release:` keyword / release-cli) is a distinct, non-interchangeable
        contract, so the release capability has no faithful equivalent on the
        other supported engines and is hand-authored per engine.

  # release-monorepo.yml runs the semantic-release monorepo pipeline on push to
  # main (.github/workflows/release-monorepo.yml lines 3-7).
  - id: release
    name: "Run the monorepo semantic-release pipeline"
    trigger:
      - on: push
        branches: [main]
    portability: specific
    exception:
      engine: github-actions
      evidence: >
        Runs `scripts/monorepo-release.sh` driven by the GitHub
        `${{ secrets.GITHUB_TOKEN }}` with `issues: write` /
        `pull-requests: write` permissions to create GitHub Releases and
        comment on GitHub issues/PRs
        (.github/workflows/release-monorepo.yml lines 9-44). The release
        tooling targets the GitHub Releases and GitHub issue APIs, which have
        no faithful equivalent on GitLab CI, so the capability is hand-authored
        per engine, not generated.
