  # changeset-coverage is the fail-safe (spec 0147 R5): it carries NO `paths:`
  # filter, so it runs on every change on both engines. Its command reads the
  # focused `paths:` sets from this reference (via yq, never hardcoded),
  # computes the changed files, and — when a changed file is not covered by the
  # union of the focused path sets — runs the full check suite; when every
  # changed file is covered it is a fast no-op.
  - id: changeset-coverage
    name: "Fail-safe: run the full check suite when a change is uncovered"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: python@3.12
      tools: [yq]
      history-depth: full
    command:
      - bash scripts/ci-changeset-coverage.sh

  - id: lint-markdown
