  # The spec linter's base-branch `status: draft` check (spec 0109 R2) resolves
  # the change's base ref, so the job needs full source history — declared as
  # `history-depth: full`, same as the two version-bump guards below.
  - id: lint-specs
    name: "Lint specification files"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      runtime: node@24
      tools: [task]
      history-depth: full
      install: install
    env:
      BASE_REF: "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      # Spec 0168 delta-01 R10: GitLab 17.10+ sets this to "true" when the merge
      # request is a draft (docs.gitlab.com, predefined variables; the page
      # documents only the "true" value). Any other value, including unset or
      # empty, leaves R1 enforced: the linter skips only on the exact "true".
      CREWRIG_PR_DRAFT: "$CI_MERGE_REQUEST_DRAFT"
    command:
      - task ci:lint-specs

