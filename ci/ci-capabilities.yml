  # repository-scan runs the checks whose verdict depends on files anywhere in
  # the repository (spec 0251 R1-R4): check-no-machine-paths.ts scans every
  # tracked file, check-markdown-links.ts every tracked *.md and the target of
  # every relative link, and check-core-paths.ts every path the manifest names
  # plus the output directories of build-components.ts. No filter can enumerate
  # those inputs in advance, so the capability has NO `paths:` filter and runs
  # on every pull request and push to main and release/**. It is deliberately
  # NOT filtered with a catch-all `**` glob (R4): that would make every tracked
  # file count as owned and turn `path-ownership` vacuous. It is not
  # changeset-gated and runs no test suite (R3): the suites of the three scans
  # stay in misc, markdown-links and core-paths, under their own filters.
  # The three scans are TypeScript entries on Node.js 24: no python runtime is
  # declared (check-markdown-links was its only consumer), and check-core-paths
  # needs no yq because `build-components.ts --list-output-dirs` exits in its
  # list_output_dirs guard (scripts/build-components.ts:64-117) before the yq
  # prerequisite check (scripts/build-components.ts:120).
  - id: repository-scan
    name: "Run repository-wide scans on every change"
    trigger:
      - on: pull-request
        branches: [main, "release/**"]
      - on: push
        branches: [main, "release/**"]
    portability: portable
    requires:
      # check-core-paths.ts runs build-components.ts through
      # `--list-output-dirs`, through the TypeScript build, which fails closed below Node.js 24 (spec 0215 R31
      # follow-up noted in #1550).
      runtime: node@24
      tools: [task]
    command:
      - task ci:repository-scan

