  # second asset on the release — which the vendor's measured one-asset gate
  # (specs/0183-extension-model-migration.delta-01.md Notes) forbids as
  # firmly as the non-conforming one did. There is no replacement capability:
  # the property this capability asserted (a tag-triggered release path)
  # is retired, not relocated.

  # release runs the monorepo release driver (scripts/monorepo-release.ts) on
  # push to main. Portable since spec 0213: the SAME driver and engine
  # (semantic-release) publish on both legs — GitHub Actions
