version: '3.39'

# Domain tasks live under taskfiles/. Groups without a prefix are flattened
# into the root namespace; the others keep their `<key>:` prefix.

vars:
  GEMINI_HOME: "{{.HOME}}/.gemini"
  REPO_DIR: "{{.PWD}}"
  E2E_IMG_PREFIX: "crewrig/e2e"
  E2E_DOCKER_DIR: "{{.REPO_DIR}}/docker/e2e"
  E2E_VERSIONS_LOCK: "{{.REPO_DIR}}/docker/e2e/.versions.lock"

includes:
  mempalace: ./taskfiles/mempalace.yml
  usage: ./taskfiles/usage.yml
  spec: ./taskfiles/spec.yml
  e2e: ./taskfiles/e2e.yml
  cli-matrix: ./taskfiles/cli-matrix.yml
  ci: ./taskfiles/ci.yml
  setup: { taskfile: ./taskfiles/setup.yml, flatten: true }
  extensions: { taskfile: ./taskfiles/extensions.yml, flatten: true }
  components: { taskfile: ./taskfiles/components.yml, flatten: true }
  lint: { taskfile: ./taskfiles/lint.yml, flatten: true }
  governance: { taskfile: ./taskfiles/governance.yml, flatten: true }
  tests: { taskfile: ./taskfiles/tests.yml, flatten: true }
  harness: { taskfile: ./taskfiles/harness.yml, flatten: true }

tasks:
  default:
    cmd: task --list
