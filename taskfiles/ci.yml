version: '3.39'

# WP-B (#1763, spec 0279): one `ci:<capability-id>` task per fast-tier CI job,
# running exactly the capability's command list (R3), plus four control tasks.
# Provisioning (`npm ci` / `npm install`) is never run here: a precondition
# points at `task lint-bootstrap` instead (R5). Calls to tasks of another file
# are always colon-anchored (R2): an unanchored name resolves to `ci:<name>`.

tasks:
  check-taskfile-tree:
    desc: Check the Taskfile tree layout and contract (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-taskfile-tree.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-ci-pre-push-parity.ts
  check-taskfile-tree-selftest:
    desc: Run the Taskfile tree self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/taskfile-tree.test.ts {{.REPO_DIR}}/scripts/tests/check-taskfile-tree-layout.test.ts {{.REPO_DIR}}/scripts/tests/check-taskfile-tree-contract.test.ts {{.REPO_DIR}}/scripts/tests/taskfile-tree-references.test.ts {{.REPO_DIR}}/scripts/tests/check-taskfile-tree-ci-wiring.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-parity.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-select.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-refs.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-hook.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-env-scrub.test.ts {{.REPO_DIR}}/scripts/tests/git-env-helpers.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-hooks-config.test.ts {{.REPO_DIR}}/scripts/tests/ci-selftest-split.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-parity-migrated.test.ts
  check-task-provisioning:
    desc: Check the pinned Task provisioning (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-task-provisioning.ts
  check-task-provisioning-selftest:
    desc: Run the Task provisioning self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/check-task-provisioning.test.ts {{.REPO_DIR}}/scripts/tests/task-pin-provisioning.test.ts
  check-taskfile-commands:
    desc: Check the Taskfile tree names no POSIX-only command (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
