version: '3.54'

# WP-B (#1763, spec 0279): one `ci:<capability-id>` task per fast-tier CI job,
# running exactly the capability's command list (R3), plus four control tasks.
# Provisioning (`npm ci` / `npm install`) is never run here: a precondition
# points at `task lint-bootstrap` instead (R5). Calls to tasks of another file
# are always colon-anchored (R2): an unanchored name resolves to `ci:<name>`.

# Factorization (spec 0278 R22): the `js-yaml` precondition is written once as the
# anchor `&needs-js-yaml` and reused by alias (anchors are file-scoped). The variable
# below is declared once here and reaches every flattened `ci/` file. Its value
# INCLUDES the `scripts` directory, so a command is written `{{.NODE_SCRIPTS}}/x.ts`,
# never `{{.NODE_SCRIPTS}} scripts/x.ts`. The `node ... --test <paths>` commands (the
# `*-selftest` tasks) keep their literal text and are not substituted.
vars:
  NODE_SCRIPTS: "node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts"

includes:
  gate: { taskfile: ./ci/gate.yml, flatten: true, dir: .. }
  modules: { taskfile: ./ci/modules.yml, flatten: true, dir: .. }
  governance: { taskfile: ./ci/governance.yml, flatten: true, dir: .. }
  extensions: { taskfile: ./ci/extensions.yml, flatten: true, dir: .. }
  integration: { taskfile: ./ci/integration.yml, flatten: true, dir: .. }
  windows: { taskfile: ./ci/windows.yml, flatten: true, dir: .. }
  windows-b: { taskfile: ./ci/windows-b.yml, flatten: true, dir: .. }

tasks:
  pre-push:
    desc: "Run the fast subset of the CI checks the pushed changeset can affect, concurrently (spec 0279). Usage: task ci:pre-push [-- <wrapper args>]"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - '{{.NODE_SCRIPTS}}/ci-pre-push.ts {{.CLI_ARGS}}'
  hooks-install:
    desc: Enable the native pre-push hook for this clone by setting core.hooksPath to .githooks (spec 0279 R15)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - '{{.NODE_SCRIPTS}}/ci-pre-push.ts hooks install'
  hooks-uninstall:
    desc: Disable the native pre-push hook by unsetting core.hooksPath for this clone (spec 0279 R15)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - '{{.NODE_SCRIPTS}}/ci-pre-push.ts hooks uninstall'
  hooks-status:
    desc: Report whether the native pre-push hook is enabled for this clone (spec 0279 R15)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - '{{.NODE_SCRIPTS}}/ci-pre-push.ts hooks status'
