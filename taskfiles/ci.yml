version: '3.39'

# WP-B (#1763, spec 0279): one `ci:<capability-id>` task per fast-tier CI job,
# running exactly the capability's command list (R3), plus four control tasks.
# Provisioning (`npm ci` / `npm install`) is never run here: a precondition
# points at `task lint-bootstrap` instead (R5). Calls to tasks of another file
# are always colon-anchored (R2): an unanchored name resolves to `ci:<name>`.

tasks:
  check-taskfile-tree:
    desc: Check the Taskfile tree layout and contract (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-taskfile-tree.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-ci-pre-push-parity.ts
  check-taskfile-tree-selftest:
    desc: Run the Taskfile tree self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/taskfile-tree.test.ts {{.REPO_DIR}}/scripts/tests/check-taskfile-tree-layout.test.ts {{.REPO_DIR}}/scripts/tests/check-taskfile-tree-contract.test.ts {{.REPO_DIR}}/scripts/tests/taskfile-tree-references.test.ts {{.REPO_DIR}}/scripts/tests/check-taskfile-tree-ci-wiring.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-parity.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-select.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-refs.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-hook.test.ts {{.REPO_DIR}}/scripts/tests/ci-pre-push-hooks-config.test.ts {{.REPO_DIR}}/scripts/tests/ci-selftest-split.test.ts
  check-taskfile-commands:
    desc: Check the Taskfile tree names no POSIX-only command (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - task: :check-taskfile-commands
  check-taskfile-commands-selftest:
    desc: Run the Taskfile command and tool-binary self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/check-taskfile-commands.test.ts {{.REPO_DIR}}/scripts/tests/check-tool-binaries.test.ts
  lint-specs:
    desc: Lint the spec files (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - task: :spec:lint
  lint-specs-selftest:
    desc: Run the spec-linter self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/spec-linter-*.test.ts
  lint-markdown:
    desc: Lint every Markdown file (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts markdownlint
        msg: "Run: task lint-bootstrap"
    cmds:
      - task: :lint-markdown
  markdown-links:
    desc: Run the Markdown link suite tests (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/governance-suite-markdown-links.test.ts
  repository-scan:
    desc: Scan the repository for machine paths, broken Markdown links and core-path drift (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-no-machine-paths.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-markdown-links.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-core-paths.ts
  lint-typescript:
    desc: Run every TypeScript check (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "Run: task lint-bootstrap"
    cmds:
      - task: :lint-ts
  lint-typescript-selftest:
    desc: Run the TypeScript lint self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/check-erasable-syntax.test.ts {{.REPO_DIR}}/scripts/tests/lint-typescript.test.ts {{.REPO_DIR}}/scripts/tests/check-typescript.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-components-built-trees.test.ts
  ratchet:
    desc: Run the footprint ratchet (pre-push mirror of the CI job)
    cmds:
      - task: :ratchet
  ratchet-selftest:
    desc: Run the footprint ratchet self-tests (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/check-ratchet.test.ts
  host-safety:
    desc: Run the host-safety check (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc
        msg: "Run: task lint-bootstrap"
    cmds:
      - task: :host-safety
  host-safety-selftest:
    desc: Run the host-safety self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/check-host-safety.test.ts
  path-ownership:
    desc: Run the path-ownership and stray-scan wiring checks (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-path-ownership.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-stray-scan-wiring.ts
  path-ownership-selftest:
    desc: Run the path-ownership and stray-scan wiring self-tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/check-path-ownership.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/ci-cache-guard-scan.test.ts {{.REPO_DIR}}/scripts/tests/check-stray-scan-wiring.test.ts {{.REPO_DIR}}/scripts/tests/ci-node-test-arguments.test.ts
  check-skill-versions:
    desc: Enforce the provenance version bump on changed skill and agent sources (pre-push mirror of the CI job)
    cmds:
      - task: :check-skill-versions
  check-description-length:
    desc: Fail when a skill or agent description exceeds the length cap (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - task: :check-description-length
  check-agents-size:
    desc: Fail when the AGENTS.md size budget is exceeded (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-agents-size.ts
  check-rules-size:
    desc: Fail when the rules size budget is exceeded (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-rules-size.ts
  check-comment-size:
    desc: Check the comment-size guard on its under and over fixtures (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-comment-size.ts {{.REPO_DIR}}/scripts/tests/fixtures/comment-size/under.txt
      - "! node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-comment-size.ts {{.REPO_DIR}}/scripts/tests/fixtures/comment-size/over.txt"
  docs-index:
    desc: Check docs/index.json is fresh (pre-push mirror of the CI job)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/build-docs-index.ts --check
  docs-index-selftest:
    desc: Run the docs index entry test (pre-push mirror of the CI job)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-docs-index-entry.test.ts
  cli-matrix-fresh:
    desc: Check docs/cli-matrix.md is fresh (pre-push mirror of the CI job)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - task: :cli-matrix:check
  cli-matrix-fresh-selftest:
    desc: Run the CLI matrix builder test (pre-push mirror of the CI job)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-cli-matrix.test.ts
  test-wiring:
    desc: Check every test is wired into CI and no stray test exists (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-test-wiring.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-test-strays.ts
  test-wiring-selftest:
    desc: Run the test-wiring and test-strays guard self-tests (pre-push mirror of the CI job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/governance-check-test-wiring-cases.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/governance-check-test-strays-cases.test.ts
  check-ci-parity:
    desc: Check the CI reference, workflow and GitLab outputs agree (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-ci-parity.ts
  gitlab-ci-check:
    desc: Check .gitlab-ci.yml is fresh against the CI reference (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/build-ci.ts --check
  component-drift:
    desc: Check built components match their sources (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/build-components.ts --target all --check
  component-drift-selftest:
    desc: Run the assembly and canonical-repo build tests (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-assembly-routing.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-components-canonical-repo.test.ts
  frontmatter:
    desc: Run the frontmatter, skill-version, routing, install-scope and tier-resolution suites (pre-push mirror of the CI job)
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts js-yaml
        msg: "Run: task lint-bootstrap"
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-components-frontmatter-fence.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/governance-suite-skill-versions.test.ts {{.REPO_DIR}}/scripts/tests/governance-suite-skill-versions-base.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/governance-suite-feedback-routing.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-assembly-routing.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/build-install-scope-build.test.ts {{.REPO_DIR}}/scripts/tests/build-install-scope-gate.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/tier-resolution-collision.test.ts {{.REPO_DIR}}/scripts/tests/tier-resolution-declarations.test.ts {{.REPO_DIR}}/scripts/tests/tier-resolution-install.test.ts {{.REPO_DIR}}/scripts/tests/tier-resolution-landing.test.ts {{.REPO_DIR}}/scripts/tests/tier-resolution-taskfile.test.ts {{.REPO_DIR}}/scripts/tests/tier-resolution-three-tiers.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test {{.REPO_DIR}}/scripts/tests/pr-logbook-label-scope.test.ts
  pre-push:
    desc: "Run the fast subset of the CI checks the pushed changeset can affect, concurrently (spec 0279). Usage: task ci:pre-push [-- <wrapper args>]"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-pre-push.ts {{.CLI_ARGS}}
  hooks-install:
    desc: Enable the native pre-push hook for this clone by setting core.hooksPath to .githooks (spec 0279 R15)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-pre-push.ts hooks install
  hooks-uninstall:
    desc: Disable the native pre-push hook by unsetting core.hooksPath for this clone (spec 0279 R15)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-pre-push.ts hooks uninstall
  hooks-status:
    desc: Report whether the native pre-push hook is enabled for this clone (spec 0279 R15)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/ci-pre-push.ts hooks status
