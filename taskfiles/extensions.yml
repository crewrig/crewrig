version: '3.39'

tasks:
  install-workspace:
    desc: Install all artifacts components (copy mode)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-workspace.ts install

  link-workspace:
    desc: Link all artifacts components (symlink mode, for development)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-workspace.ts link

  install-component:
    desc: "Install a single component (task install-component TYPE=skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-workspace-component.ts install {{.TYPE}} {{.NAME}}

  link-component:
    desc: "Link a single component (task link-component TYPE=skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-workspace-component.ts link {{.TYPE}} {{.NAME}}

  unlink-component:
    desc: "Remove a component from ~/.gemini (task unlink-component TYPE=skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/unlink-component.ts {{.TYPE}} {{.NAME}}

  install-copilot-component:
    desc: "Install a Copilot component (task install-copilot-component TYPE=skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-copilot-component.ts install {{.TYPE}} {{.NAME}}

  link-copilot-component:
    desc: "Link a Copilot component (task link-copilot-component TYPE=skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-copilot-component.ts link {{.TYPE}} {{.NAME}}

  # --- Cross-CLI extension tasks ---
  install-extension-all:
    desc: "Install a single extension across all present CLIs (task install-extension-all EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-extension-all.ts {{.EXT}}

  # --- Gemini CLI extension tasks ---
  install-gemini-extensions:
    desc: Install all extensions to Gemini CLI (copy mode)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-extension.ts install

  install-gemini-extension:
    desc: "Install a single extension to Gemini CLI (task install-gemini-extension EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-extension.ts install {{.EXT}}

  link-gemini-extensions:
    desc: "Debugging path (not an install path): symlink every extension's rendered build directory into Gemini CLI"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/link-extensions.ts

  link-gemini-extension-build:
    desc: "Debugging path (not an install path): symlink one extension's rendered build directory into Gemini CLI (task link-gemini-extension-build EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-extension.ts link {{.EXT}}

  unlink-gemini-extensions:
    desc: Remove all installed extensions from Gemini CLI
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/unlink-extensions.ts

  # --- Legacy extension task aliases (deprecated) ---
  install-extensions:
    desc: "Deprecated: Install all extensions to Gemini CLI (use install-gemini-extensions)"
    cmds:
      - |
        echo "[DEPRECATION] 'task install-extensions' is deprecated. Use 'task install-gemini-extensions' instead." >&2
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-extension.ts install

  install-extension:
    desc: "Deprecated: Install a single extension to Gemini CLI (use install-gemini-extension or install-extension-all)"
    cmds:
      - |
        echo "[DEPRECATION] 'task install-extension' is deprecated. Use 'task install-gemini-extension EXT={{.EXT}}' (Gemini only) or 'task install-extension-all EXT={{.EXT}}' (all CLIs)." >&2
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-extension.ts install {{.EXT}}

  link-extensions:
    desc: "Deprecated: Link all extensions to Gemini CLI (use link-gemini-extensions)"
    cmds:
      - |
        echo "[DEPRECATION] 'task link-extensions' is deprecated. Use 'task link-gemini-extensions' instead." >&2
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/link-extensions.ts

  unlink-extensions:
    desc: "Deprecated: Remove all installed extensions from Gemini CLI (use unlink-gemini-extensions)"
    cmds:
      - |
        echo "[DEPRECATION] 'task unlink-extensions' is deprecated. Use 'task unlink-gemini-extensions' instead." >&2
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/unlink-extensions.ts

  package:
    desc: Package all extensions to dist/
    deps: [install-deps]
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/package-extensions.ts

  package-extension:
    desc: "Package a single extension (task package-extension EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/package-extension.ts

  create-extension:
    desc: "Scaffold a new extension from skeleton (task create-extension NAME=my-ext)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/create-extension.ts {{.CLI_ARGS}}

  migrate-extension:
    desc: "Convert an extension source tree from the retired declaration shape to the current one (task migrate-extension EXT=my-ext, spec 0183)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/migrate-extension.ts {{.EXT}}

  install-claude-workspace:
    desc: Install all artifacts Claude Code components (copy mode)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-claude-component.ts install claude-skills

  link-claude-workspace:
    desc: Link all artifacts Claude Code components (symlink mode — dev only)
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-claude-component.ts link claude-skills

  install-claude-component:
    desc: "Install a single Claude Code component (task install-claude-component TYPE=claude-skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-claude-component.ts install {{.TYPE}} {{.NAME}}

  link-claude-component:
    desc: "Link a single Claude Code component (task link-claude-component TYPE=claude-skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-claude-component.ts link {{.TYPE}} {{.NAME}}

  build-claude-plugin:
    desc: "Build a Claude Code plugin from an extension (task build-claude-plugin EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/build-claude-plugin.ts {{.EXT}}

  install-claude-plugin:
    desc: "Install a Claude Code plugin (task install-claude-plugin EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-claude-plugin.ts {{.EXT}}

  install-antigravity-component:
    desc: "Install a single Antigravity CLI component (task install-antigravity-component TYPE=antigravity-skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-antigravity-component.ts install {{.TYPE}} {{.NAME}}

  link-antigravity-component:
    desc: "Link a single Antigravity CLI component (task link-antigravity-component TYPE=antigravity-skills NAME=my-skill)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/manage-antigravity-component.ts link {{.TYPE}} {{.NAME}}

  build-antigravity-extension:
    desc: "Build an Antigravity CLI plugin from an extension (task build-antigravity-extension EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/build-antigravity-extension.ts {{.EXT}}

  install-antigravity-extension:
    desc: "Build and install an Antigravity CLI plugin from an extension (requires agy in PATH; task install-antigravity-extension EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-antigravity-extension.ts {{.EXT}}

  build-copilot-plugin:
    desc: "Build a Copilot CLI plugin from an extension (task build-copilot-plugin EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/build-copilot-plugin.ts {{.EXT}}

  install-copilot-plugin:
    desc: "Build and install a Copilot CLI plugin from an extension (requires copilot in PATH; task install-copilot-plugin EXT=hello-world)"
    cmds:
      - node {{.REPO_DIR}}/scripts/lib/node-floor-guard.js
      - node {{.REPO_DIR}}/scripts/install-copilot-plugin.ts {{.EXT}}
