version: '3.54'

# Stage group `windows` (spec 0278 R23), second file: the Windows proof tasks continue from
# taskfiles/ci/windows.yml (size cap of 200 lines per file). Flattened under `ci:` by taskfiles/ci.yml.

tasks:
  # Spec 0247 R31, R19: the MemPalace transcript hook row's copy of the
  # template above. pwsh is the interpreter of every step. Budgets are the
  # initial values of R19 (750 ms for cases (a) and (b), 2000 ms for (c) and
  # (d)); they are recalibrated from the first green run to max(3 x the
  # largest observed run, 300 ms) rounded up to the next 50 ms, only where
  # lower, and each is stated next to its script. Every budget step names its
  # case with --case, which the harness prints in its failure line. '--' is
  # quoted so pwsh hands it to node verbatim rather than reading it as its own
  # end-of-parameters token.
  windows-mempalace-transcript:
    desc: Windows proof of mempalace transcript (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/mempalace-transcript-windows.test.ts
      - |
        set -e
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/transcript-timing-fixtures.ts "$RUNNER_TEMP/mempalace-transcript-timing"
        while IFS== read -r k v; do case "$k" in ""|*[!A-Za-z0-9_]*) ;; *) export "$k=$v" ;; esac; done < "$GITHUB_ENV"
        MEMPALACE_DAEMON_TOKEN_FILE="$TIMING_TOKEN_FILE" node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 300 --case a-posttooluse-direct --stdin-file "$TIMING_POSTTOOLUSE_PAYLOAD" -- hooks/mempalace-transcript.ts claude-code
        unset MEMPALACE_TRANSCRIPT_ENABLED
        MEMPALACE_DAEMON_TOKEN_FILE="$TIMING_TOKEN_FILE" node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 300 --case b-legacy-disabled --stdin-file "$TIMING_POSTTOOLUSE_PAYLOAD" -- hooks/mempalace-transcript.ts
        MEMPALACE_DAEMON_TOKEN_FILE="$TIMING_TOKEN_FILE" node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/with-stub-daemon.ts --expect-requests 10-11 -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 550 --case c-stop-50mb-transcript --stdin-file "$TIMING_STOP_PAYLOAD" -- hooks/mempalace-transcript.ts claude-code
        MEMPALACE_DAEMON_TOKEN_FILE="$TIMING_TOKEN_FILE" MEMPALACE_MCP_HOST=127.0.0.1 MEMPALACE_MCP_PORT="$TIMING_CLOSED_PORT" node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 550 --case d-nothing-listening --stdin-file "$TIMING_PROMPT_PAYLOAD" -- hooks/mempalace-transcript.ts claude-code
  # Spec 0253 R27, R17: the history import and operational commands row's copy
  # of the Windows template above. pwsh is the interpreter of the one step. The
  # suite is offline: it creates a local upstream repository itself and runs
  # the TypeScript entry against it with Git for Windows, spawning no `bash`.
  # No timing-budget step: the suite prints `timing:` lines, which R24 records
  # and never gates.
  windows-sync-from-upstream:
    desc: Windows proof of sync from upstream (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/sync-from-upstream-windows.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/sync-from-upstream-policies.test.ts scripts/tests/sync-from-upstream-reconcile.test.ts scripts/tests/sync-from-upstream-orphans.test.ts scripts/tests/sync-from-upstream-dirty-report.test.ts scripts/tests/sync-from-upstream-preserve.test.ts
  # Spec 0253 R27, R17: the history import row's copy of the Windows template above.
  # pwsh is the interpreter of the one step. The suite spawns no `bash` and no `.cmd`
  # (Node.js refuses to spawn one without a shell): it runs the TypeScript entries
  # against the runner's real Python with a FAKE `mempalace` package on PYTHONPATH
  # (a `__main__` that logs its arguments and exits with a chosen status, and an
  # `mcp_server` with two dummy drawer functions), so the interpreter probe, the
  # prompts, the `mine` calls and the Python body of prune-transcripts all run.
  # No timing-budget step: the suite prints `timing:` lines, which R24 records and
  # never gates.
  windows-history-import:
    desc: Windows proof of history import (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/history-import-python.test.ts scripts/tests/history-import-prune-python.test.ts
  # Spec 0250 R28, R29: the component-build row's copy of the template above.
  # pwsh is the interpreter of every step. The write-path proof prints its own
  # elapsed time and no step has a timing budget (R29). The shell-parity suites
  # self-skip off Linux; the conformance, YAML corpus and differential suites
  # are not listed. No path filter, like the Windows jobs above.
  windows-build-components:
    desc: Windows proof of build components (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/windows-build-proof.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-cli-config.test.ts scripts/tests/build-components-cli.test.ts scripts/tests/build-components-dependency.test.ts scripts/tests/build-components-entry-form.test.ts scripts/tests/build-components-file-size.test.ts scripts/tests/build-components-fixture-closure.test.ts scripts/tests/build-components-hardening-names.test.ts scripts/tests/build-components-hardening-yaml.test.ts scripts/tests/build-components-provenance.test.ts scripts/tests/build-components-resources.test.ts scripts/tests/build-components-write.test.ts scripts/tests/yaml-text.test.ts scripts/tests/render-command.test.ts scripts/tests/component-resolve.test.ts scripts/tests/model-resolve-*.test.ts scripts/tests/build-components-canonical-repo.test.ts scripts/tests/build-components-frontmatter-fence.test.ts scripts/tests/build-assembly-routing.test.ts scripts/tests/pr-logbook-label-scope.test.ts scripts/tests/agent-profile-baseline-doc.test.ts scripts/tests/agent-profile-build.test.ts scripts/tests/agent-profile-committed.test.ts scripts/tests/build-install-scope-build.test.ts scripts/tests/build-install-scope-gate.test.ts scripts/tests/repo-agent-frontmatter.test.ts scripts/tests/build-sandbox.test.ts
  # Spec 0254 R23: the extension builders' copy of the Windows job above.
  windows-extension-builders:
    desc: Windows proof of extension builders (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/windows-extension-proof.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/extension-json.test.ts scripts/tests/extension-org-mcp.test.ts scripts/tests/extension-descriptors.test.ts scripts/tests/extension-manifest.test.ts scripts/tests/extension-shape-guard.test.ts scripts/tests/extension-gap-record.test.ts scripts/tests/extension-resolve.test.ts scripts/tests/extension-validate.test.ts scripts/tests/extension-hooks.test.ts scripts/tests/extension-mcp-delivery.test.ts scripts/tests/extension-context.test.ts scripts/tests/extension-args.test.ts scripts/tests/extension-context-declared.test.ts scripts/tests/extension-check-scan.test.ts scripts/tests/extension-entry-form.test.ts scripts/tests/extension-golden.test.ts
  # Spec 0255 R28: the install, manage and link entries from pwsh and cmd.exe on Windows.
  windows-install-entries:
    desc: Windows proof of install entries (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/windows-install-proof.ts
  # Spec 0257 R27: the packaging and release entries from pwsh and cmd.exe on Windows.
  windows-packaging-entries:
    desc: Windows proof of packaging entries (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/windows-packaging-entries.test.ts
  # Spec 0258 R16, R18, R20, R27: the example hooks of `hello-world` and the skeleton from pwsh and
  # cmd.exe with no `bash` on the child PATH, the no-deprecation channel, and a latency budget per hook.
  # pwsh is the interpreter of every step. The budgets are the initial 2000 ms of R18, replaced after
  # the first green run (see each step). No path filter, like the Windows jobs above.
  windows-extension-hooks:
    desc: Windows proof of extension hooks (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/windows-extension-hooks.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/extension-hooks-deprecations.test.ts
      - |
        set -e
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/extension-hooks-timing-fixtures.ts "$RUNNER_TEMP/hooks-timing"
        while IFS== read -r k v; do case "$k" in ""|*[!A-Za-z0-9_]*) ;; *) export "$k=$v" ;; esac; done < "$GITHUB_ENV"
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 --stdin-file "$HOOK_PAYLOAD" --case prompt-logger -- extensions/core/hello-world/hooks/prompt-logger.ts
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 --stdin-file "$HOOK_PAYLOAD" --case shell-logger -- extensions/core/hello-world/hooks/shell-logger.ts
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 --stdin-file "$HOOK_PAYLOAD" --case skeleton-logger -- extension-skeleton/hook/hooks/logger.ts
  # Spec 0258 R15, R27, R34: the harness-curator entries from pwsh and cmd.exe on Windows.
  windows-harness-curator:
    desc: Windows proof of harness curator (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/windows-harness-curator.test.ts
  # Spec 0258 R23-R27: the extension scaffolder entry from pwsh and cmd.exe on Windows.
  windows-create-extension:
    desc: Windows proof of create extension (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/windows-create-extension.test.ts
  # Spec 0258 R27: the eleven skill script entries from pwsh and cmd.exe on Windows.
  windows-skill-scripts:
    desc: Windows proof of skill scripts (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/windows-skill-scripts.test.ts
  # Spec 0261 R17, R20, R21 (ticket #1342): the end-to-end harness entries from pwsh and cmd.exe on
  # Windows. No path filter, like the Windows jobs above. Docker-driving scenarios are POSIX only.
  windows-e2e-harness:
    desc: Windows proof of e2e harness (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/windows-e2e-harness.test.ts
  # Spec 0259 R26-R28: the governance checks from PowerShell on Windows. Every
  # scripts/tests/windows-governance-*.test.ts file runs (glob discovery). No path filter, like the
  # Windows jobs above.
  windows-governance-checks:
    desc: Windows proof of governance checks (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test 'scripts/tests/windows-governance-*.test.ts'
  # Spec 0262 R21-R23: merge-spec-pr.ts from PowerShell on Windows. Every
  # scripts/tests/windows-model-ci-tooling-*.test.ts file runs (glob discovery). No path filter, like the
  # Windows jobs above.
  windows-model-ci-tooling:
    desc: Windows proof of model ci tooling (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test 'scripts/tests/windows-model-ci-tooling-*.test.ts'
  # Spec 0256 R40, plan finding v1-F3: the Windows exercise of the setup layer-1 unit suites under pwsh.
