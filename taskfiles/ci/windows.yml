version: '3.54'

# Stage group `windows` (spec 0278 R23): the `windows-*` proof tasks. Flattened under `ci:` by
# taskfiles/ci.yml.

tasks:
  # Windows tasks (spec 0283 R9): `ci-job` runs `task ci:<id>` from pwsh on a windows-latest runner (the
  # runner's native environment; see docs/ci-reference-format.md, *Windows trap for adopters*), and Task's
  # own shell evaluates the commands, so quoting is sh quoting (`--`, `"$VAR"`). The comments below were
  # written for the former pwsh-step jobs: "pwsh is the interpreter of every step" now means the job's
  # parent shell, and the proofs still spawn pwsh and cmd.exe themselves. Timing jobs read the KEY=VALUE
  # lines the fixture step appends to $GITHUB_ENV back into the same script, so the budget commands see them.
  # TEMPLATE (spec 0240 R12-R15) — the reusable `windows-latest` job shape.
  # A later sub-spec copies this job, renames it, points the three steps at
  # its own migrated script and suites, states its own --budget-ms next to its
  # script, and records the copy in ci/ci-capabilities.yml as
  # `portability: specific` (engine github-actions: GitLab exposes no Windows
  # runner). Steps run under pwsh, a non-POSIX interpreter, on purpose.
  # Budget: 750 ms initial for node-floor-guard.js, to be recalibrated to
  # max(3 x observed max, 300 ms) rounded up to 50 ms after the first run.
  windows-node-floor-guard:
    desc: Windows proof of node floor guard (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/paths.test.ts scripts/tests/line-endings.test.ts scripts/tests/tmp-file.test.ts scripts/tests/node-floor-guard.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 -- scripts/lib/node-floor-guard.js
  # Spec 0252 R24 (plan v3 D5 *Windows proof job*): the Windows service task
  # proof, copied from the template above. pwsh is the interpreter of every
  # step. The portable unit tests run first; service-windows.test.ts installs
  # both real task chains through the real schtasks backend under throwaway
  # leaves and prints each measurement as one `MEASURE:` line (grep the log).
  windows-service-task:
    desc: Windows proof of service task (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-names.test.ts scripts/tests/service-backend.test.ts scripts/tests/service-probe.test.ts scripts/tests/service-os-inspect.test.ts scripts/tests/service-listener-pid.test.ts scripts/tests/service-process-tree.test.ts scripts/tests/service-owner-check.test.ts scripts/tests/service-task-snapshot.test.ts scripts/tests/service-task-ownership.test.ts scripts/tests/service-schtasks.test.ts scripts/tests/service-schtasks-uninstall.test.ts scripts/tests/service-snapshot-failure.test.ts scripts/tests/service-task-state.test.ts scripts/tests/service-windows-task-xml.test.ts scripts/tests/service-unit-render.test.ts scripts/tests/service-launcher-record.test.ts scripts/tests/service-launcher-child.test.ts scripts/tests/service-launcher-token.test.ts scripts/tests/service-launcher-palace-path.test.ts scripts/tests/service-bundle-closure.test.ts scripts/tests/service-launcher-installed-wrapper.test.ts
      - |
        rc=0
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-windows.test.ts || rc=1
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-windows-legs.test.ts || rc=1
        exit $rc
  # Spec 0252 R24 (PR C): the ChromaDB trio on a real Windows host. The suites
  # run under pwsh, and the Task Scheduler leg installs the ChromaDB chain with
  # the real installer under a throwaway task name, then runs status and stop
  # from PowerShell against it. Copied from `windows-service-task`.
  windows-chroma-trio:
    desc: Windows proof of chroma trio (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/chroma-lifecycle.test.ts scripts/tests/chroma-launch.test.ts scripts/tests/chroma-launch-env.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/chroma-windows-task.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/chroma-windows-pidfile.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/chroma-windows-reinstall.test.ts
  # Spec 0252 R24 (PR D): the MCP daemon on a real Windows host. The MCP chain
  # (the real launcher behind process.execPath) is installed with the real
  # installer under a throwaway task name; `status-mcp-server.ts` then runs from
  # PowerShell and must report the owner verdict VERIFIED for the task's daemon
  # and USURPED for a same-user listener the task did not start, the `task:`
  # line, and finish within 5 s; uninstall leaves no task and no daemon.
  windows-mcp-daemon:
    desc: Windows proof of mcp daemon (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/status-mcp-lifecycle.test.ts scripts/tests/status-mcp-lifecycle-windows.test.ts
  # Spec 0252 R24 (PR E): the doctor's fourth section (*Background service
  # mechanism*) and the repair verbs on a real Windows host. The doctor runs from
  # PowerShell against the real Task Scheduler in the absent state, and the
  # platform-neutral repair oracle (no bash; repair-verbs.test.ts is POSIX-only and
  # stays in the Linux job) runs beside it; neither creates a task.
  windows-doctor-repair:
    desc: Windows proof of doctor repair (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/doctor-sections.test.ts scripts/tests/doctor-sections-windows.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/repair-windows.test.ts
  # Spec 0243 R15, R28: the usage-capture row's copy of the template above.
  # pwsh is the interpreter of every step. Budgets were recalibrated at plan
  # step 26 from the first green run (run 36738818466, job 109967462294) to
  # max(3 x the largest observed run, 300 ms) rounded up to the next 50 ms,
  # only where lower than the initial 750 / 2000 / 2000 ms of R15; each is
  # stated next to its script. Delta-03 R28(b): both Antigravity CLI surfaces
  # run the guarded form through the `cmd /c "<command>"` wrapper of rows
  # 37e/37f, with the b1 (path with a space), b2 (planted node.cmd/node.bat
  # bypassed) and b3 (bare form still hijacked, premise of the guard) legs.
  windows-usage-capture:
    desc: Windows proof of usage capture (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-capture-windows.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-record-schema.test.ts scripts/tests/usage-capture-derivation.test.ts scripts/tests/usage-capture-headless.test.ts scripts/tests/usage-capture-backfill.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/hook-deprecations.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-storage-journal.test.ts scripts/tests/usage-storage-query.test.ts scripts/tests/usage-storage-wing.test.ts scripts/tests/usage-storage-drain.test.ts scripts/tests/usage-storage-prune.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-pricing-static.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-attribution-channels.test.ts scripts/tests/usage-attribution-ledger-rollup.test.ts scripts/tests/usage-attribution-period-rollup.test.ts scripts/tests/usage-attribution-prune.test.ts scripts/tests/usage-attribution-mutations.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-dashboard-agreement.test.ts scripts/tests/usage-dashboard-crosscheck.test.ts scripts/tests/usage-dashboard-buckets.test.ts scripts/tests/usage-dashboard-render.test.ts scripts/tests/usage-dashboard-empty.test.ts scripts/tests/usage-dashboard-page.test.ts scripts/tests/usage-dashboard-static.test.ts scripts/tests/usage-dashboard-home-marker.test.ts scripts/tests/usage-dashboard-server.test.ts scripts/tests/usage-dashboard-readonly.test.ts
      - |
        set -e
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/usage-capture-timing-fixtures.ts "$RUNNER_TEMP/usage-capture-timing"
        while IFS== read -r k v; do case "$k" in ""|*[!A-Za-z0-9_]*) ;; *) export "$k=$v" ;; esac; done < "$GITHUB_ENV"
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 400 --stdin-file "$TIMING_FAST_PAYLOAD" -- hooks/usage-capture.ts claude-code Stop
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 1000 --stdin-file "$TIMING_SLOW_PAYLOAD" --env-tmpdir CREWRIG_USAGE_ROOT -- hooks/usage-capture.ts claude-code Stop
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 550 --stdin-file "$TIMING_SHIM_PAYLOAD" --env-tmpdir CREWRIG_USAGE_ROOT -- hooks/antigravity-statusline-shim.ts
  # Spec 0253 R27 (delta-01 R17, R24): the usage-wrappers row's copy of the
  # template above. Offline: no network, no Python and no `bash`; the one step
  # spawns the nine TypeScript usage entries directly under pwsh against an
  # isolated temp HOME and usage root. R24 records, never gates: the test
  # prints a `timing: <name> <ms> ms` line per command and no step asserts a
  # timing budget. No path filter, like the Windows jobs above.
  windows-usage-wrappers:
    desc: Windows proof of usage wrappers (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-wrappers-windows.test.ts scripts/tests/usage-mirror-spawn.test.ts
  # Spec 0248 R33, R34: the worktree git guard row's copy of the template
  # above. pwsh is the interpreter of every step. Budgets are the initial values
  # of R33 (750 ms fast path, 2000 ms slow path refused and allowed); they are
  # recalibrated from the first green run to max(3 x the largest observed run,
  # 300 ms) rounded up to the next 50 ms, only where lower, and each is stated
  # next to its script. The guard runs from the fixture repository as its
  # process directory (--cwd): its slow path reads the claim state from there.
  windows-worktree-git-guard:
    desc: Windows proof of worktree git guard (CI mirror of the windows-latest job)
    cmds:
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-guard-windows.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-claim-windows.test.ts
      - node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-claim-bash-port-basic.test.ts scripts/tests/worktree-claim-bash-port-guards.test.ts scripts/tests/worktree-claim-bash-port-arith.test.ts
      - |
        set -e
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/worktree-timing-fixtures.ts "$RUNNER_TEMP/worktree-guard-timing"
        while IFS== read -r k v; do case "$k" in ""|*[!A-Za-z0-9_]*) ;; *) export "$k=$v" ;; esac; done < "$GITHUB_ENV"
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 --stdin-file "$TIMING_FAST_PAYLOAD" --cwd "$TIMING_FIXTURE_CWD" -- "$GITHUB_WORKSPACE/hooks/worktree-git-guard.ts"
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 2000 --expect-exit 1 --stdin-file "$TIMING_REFUSED_PAYLOAD" --cwd "$TIMING_FIXTURE_CWD" -- "$GITHUB_WORKSPACE/hooks/worktree-git-guard.ts"
        node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 2000 --stdin-file "$TIMING_ALLOWED_PAYLOAD" --cwd "$TIMING_FIXTURE_CWD" -- "$GITHUB_WORKSPACE/hooks/worktree-git-guard.ts"
