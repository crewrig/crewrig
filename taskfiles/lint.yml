version: '3.39'

tasks:
  # --- Linting ---
  lint-bootstrap:
    desc: "Install every dependency the spec, Markdown and TypeScript linters need (js-yaml, semver, markdownlint-cli, typescript, oxlint, oxfmt)"
    cmds:
      - npm ci

  lint-markdown:
    desc: Check all Markdown files for lint compliance
    preconditions:
      - sh: npx --no-install markdownlint --version
        msg: "markdownlint-cli is required. Run: task lint-bootstrap (or: npm install -g markdownlint-cli)"
    # extensions/**/commands/*.md are pivot command sources (the body IS the
    # prompt, not prose) — exclude them from prose linting (spec 0042).
    # artifacts/*/commands/*.md are the same kind of pivot command source at
    # the artifacts tier (spec 0191) — same rationale, same exclusion.
    cmd: npx --no-install markdownlint "**/*.md" --ignore node_modules --ignore '**/node_modules/**' --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md' --ignore 'artifacts/*/commands/*.md'

  # Spec 0238 R15: local entry points running exactly the CI commands of the
  # `ratchet` and `lint-typescript` jobs (ci/ci-capabilities.yml). The ratchet
  # is standard-library only, so it needs no `npm ci`.
  ratchet:
    desc: "Run the shell / JavaScript / Python footprint ratchet, as CI does (spec 0238 R1-R3)"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-ratchet.ts

  # Spec 0267 R12: local entry point running exactly the CI check of the
  # `host-safety` job (ci/ci-capabilities.yml). The check imports `typescript`,
  # so a fresh checkout needs `npm ci` first (unlike `ratchet`).
  host-safety:
    desc: "Run the test-harness host-safety check, as CI does (spec 0267)"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-host-safety.ts

  lint-ts:
    desc: "Run every TypeScript check CI runs: type-check, erasable syntax, Oxlint, Oxfmt (spec 0238 R4-R8)"
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "The TypeScript toolchain (typescript, oxlint, oxfmt) is required. Run: task lint-bootstrap"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts

  typecheck-ts:
    desc: "Type-check every tracked TypeScript source in strict mode (spec 0238 R4)"
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "The TypeScript toolchain (typescript, oxlint, oxfmt) is required. Run: task lint-bootstrap"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts --step typecheck

  erasable-ts:
    desc: "Reject TypeScript syntax Node type stripping cannot erase (spec 0238 R5)"
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "The TypeScript toolchain (typescript, oxlint, oxfmt) is required. Run: task lint-bootstrap"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts --step erasable

  oxlint-ts:
    desc: "Run Oxlint type-aware strict typing and the max-lines warning (spec 0238 R6-R7)"
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "The TypeScript toolchain (typescript, oxlint, oxfmt) is required. Run: task lint-bootstrap"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts --step lint

  format-ts:
    desc: "Check TypeScript formatting with Oxfmt (spec 0238 R8)"
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "The TypeScript toolchain (typescript, oxlint, oxfmt) is required. Run: task lint-bootstrap"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts --step format

  format-ts:fix:
    desc: "Rewrite every tracked TypeScript source with Oxfmt (local convenience, not a CI mirror)"
    preconditions:
      - sh: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/check-tool-binaries.ts tsc oxlint oxfmt
        msg: "The TypeScript toolchain (typescript, oxlint, oxfmt) is required. Run: task lint-bootstrap"
    cmd: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON {{.REPO_DIR}}/scripts/format-typescript.ts

  fix-markdown:
    desc: Auto-fix Markdown formatting issues
    preconditions:
      - sh: npx --no-install markdownlint --version
        msg: "markdownlint-cli is required. Run: task lint-bootstrap (or: npm install -g markdownlint-cli)"
    # Mirror the lint-markdown exclusion: extension command pivots are prompt
    # sources, not prose (spec 0042). artifacts/*/commands/*.md are the same
    # kind of pivot command source at the artifacts tier (spec 0191).
    cmd: npx --no-install markdownlint "**/*.md" --ignore node_modules --ignore '**/node_modules/**' --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md' --ignore 'artifacts/*/commands/*.md' --fix
