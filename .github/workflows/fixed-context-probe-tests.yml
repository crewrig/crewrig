name: Fixed-Context Probe Tests

# Issue #2002 (follow-up of #1994): mirrors the `fixed-context-probe-tests` capability of
# ci/ci-capabilities.yml. Unit suite only: the paid probe never runs in CI.
on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/fixed-context-probe.ts"
      - "scripts/fixed-context-threshold.json"
      - "scripts/lib/fixed-context-probe.ts"
      - "scripts/tests/fixed-context-probe.test.ts"
      - "scripts/tests/fixtures/fixed-context-probe/**"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/fixed-context-probe.ts"
      - "scripts/fixed-context-threshold.json"
      - "scripts/lib/fixed-context-probe.ts"
      - "scripts/tests/fixed-context-probe.test.ts"
      - "scripts/tests/fixtures/fixed-context-probe/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  fixed-context-probe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the fixed-context probe
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/fixed-context-probe.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
