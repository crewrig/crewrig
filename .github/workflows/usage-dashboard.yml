name: Usage Dashboard Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-dashboard/**"
      - "scripts/usage-dashboard.sh"
      - "scripts/tests/test-usage-dashboard*.sh"
      - "scripts/tests/fixtures/usage-dashboard/**"
      - "scripts/tests/fixtures/usage-pricing/**"
      - "model-prices.org.json"
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-price/**"
      - "scripts/usage-query.sh"
      - "scripts/usage-price.sh"
      - "scripts/usage-attribute.sh"
      - "scripts/usage-prune.sh"
      - "schemas/usage-record/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-dashboard/**"
      - "scripts/usage-dashboard.sh"
      - "scripts/tests/test-usage-dashboard*.sh"
      - "scripts/tests/fixtures/usage-dashboard/**"
      - "scripts/tests/fixtures/usage-pricing/**"
      - "model-prices.org.json"
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-price/**"
      - "scripts/usage-query.sh"
      - "scripts/usage-price.sh"
      - "scripts/usage-attribute.sh"
      - "scripts/usage-prune.sh"
      - "schemas/usage-record/**"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  usage-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate the usage dashboard's three delivery forms (no network, no daemon)
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-dashboard.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
