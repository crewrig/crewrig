name: Rehearse Release (Monorepo)

# Manual, credential-free rehearsal of the monorepo release (spec 0213 R12):
# computes each extension's next version, tag and release note and builds its
# archive, publishing nothing. Mirrors the `release-rehearsal` capability in
# ci/ci-capabilities.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq

      - name: Install dependencies
        run: npm install --include=dev

      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js

      - name: Rehearse monorepo release
        env:
          RELEASE_DRY_RUN: "true"
        run: node scripts/monorepo-release.ts
