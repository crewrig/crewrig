  # Spec 0247 R31, plan step 22(a): black-box suites of the TypeScript
  # MemPalace transcript hook and of its wiring; the Bash oracle runs through
  # the shim in the `mempalace` job.
  mempalace-transcript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mempalace-transcript:
              - 'hooks/mempalace-transcript.*'
              - 'scripts/lib/mempalace-transcript/**'
              - 'scripts/lib/tls-env.ts'
              - 'scripts/lib/transcript-recognition.ts'
              - 'scripts/lib/hook-*.ts'
              - 'scripts/hook-wiring.ts'
              - 'scripts/lib/usage-store/mcp.*'
              - 'scripts/lib/usage-capture-optin.sh'
              - 'scripts/lib/common.sh'
              - 'scripts/setup-*-interactive.sh'
              - 'hooks/*-transcript-hooks.json'
              - 'scripts/tests/mempalace-transcript-*.test.ts'
              - 'scripts/tests/hook-transcript-*.test.ts'
              - 'scripts/tests/lib/with-stub-daemon.ts'
              - 'scripts/tests/lib/transcript-*.ts'
              - 'scripts/tests/lib/spawn-spy.ts'
              - 'scripts/tests/lib/windows-invocation.ts'
              - 'scripts/tests/fixtures/mempalace-transcript/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.mempalace-transcript == 'true'
        with:
          node-version: 24

      - name: Validate the MemPalace transcript hook and its wiring
        if: steps.filter.outputs.mempalace-transcript == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/mempalace-transcript-*.test.ts scripts/tests/hook-transcript-*.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0247 R1: the transcript hook entry prints nothing on the oldest
  # Node.js 24 release, where type stripping still emits an ExperimentalWarning.
  mempalace-transcript-node-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Entry form and silence runs on Node.js 24.0.0
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/mempalace-transcript-entry-form.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # TEMPLATE (spec 0240 R12-R15) — the reusable `windows-latest` job shape.
  # A later sub-spec copies this job, renames it, points the three steps at
  # its own migrated script and suites, states its own --budget-ms next to its
  # script, and records the copy in ci/ci-capabilities.yml as
  # `portability: specific` (engine github-actions: GitLab exposes no Windows
  # runner). Steps run under pwsh, a non-POSIX interpreter, on purpose.
  # Budget: 750 ms initial for node-floor-guard.js, to be recalibrated to
  # max(3 x observed max, 300 ms) rounded up to 50 ms after the first run.
  windows-node-floor-guard:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js

      - name: Test the portable shared modules
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/paths.test.ts scripts/tests/line-endings.test.ts scripts/tests/tmp-file.test.ts scripts/tests/node-floor-guard.test.ts

      # '--' is quoted so pwsh hands it to node verbatim rather than reading
      # it as its own end-of-parameters token.
      - name: Floor guard timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 '--' scripts/lib/node-floor-guard.js
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0252 R24 (plan v3 D5 *Windows proof job*): the Windows service task
  # proof, copied from the template above. pwsh is the interpreter of every
  # step. The portable unit tests run first; service-windows.test.ts installs
  # both real task chains through the real schtasks backend under throwaway
  # leaves and prints each measurement as one `MEASURE:` line (grep the log).
  windows-service-task:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js

      - name: Test the portable service modules (POSIX-only tests skip themselves)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-names.test.ts scripts/tests/service-backend.test.ts scripts/tests/service-probe.test.ts scripts/tests/service-os-inspect.test.ts scripts/tests/service-listener-pid.test.ts scripts/tests/service-process-tree.test.ts scripts/tests/service-owner-check.test.ts scripts/tests/service-task-snapshot.test.ts scripts/tests/service-task-ownership.test.ts scripts/tests/service-schtasks.test.ts scripts/tests/service-snapshot-failure.test.ts scripts/tests/service-task-state.test.ts scripts/tests/service-windows-task-xml.test.ts scripts/tests/service-unit-render.test.ts scripts/tests/service-launcher-record.test.ts scripts/tests/service-launcher-child.test.ts scripts/tests/service-launcher-token.test.ts scripts/tests/service-bundle-closure.test.ts

      - name: Task Scheduler lifecycle of both task chains
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-windows.test.ts

      - name: Restart proof and refusal legs
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-windows-legs.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0243 R15, R28: the usage-capture row's copy of the template above.
  # pwsh is the interpreter of every step. Budgets were recalibrated at plan
  # step 26 from the first green run (run 36738818466, job 109967462294) to
  # max(3 x the largest observed run, 300 ms) rounded up to the next 50 ms,
  # only where lower than the initial 750 / 2000 / 2000 ms of R15; each is
  # stated next to its script. Delta-03 R28(b): both Antigravity CLI surfaces
  # run the guarded form through the `cmd /c "<command>"` wrapper of rows
  # 37e/37f, with the b1 (path with a space), b2 (planted node.cmd/node.bat
  # bypassed) and b3 (bare form still hijacked, premise of the guard) legs.
  windows-usage-capture:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Both entries run, each CLI and Antigravity surface command line launches through its interpreter, guarded-form b1-b3 legs
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-capture-windows.test.ts

      - name: No deprecation reaches the entries
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/hook-deprecations.test.ts

      # Writes the transcripts, payloads and a real stamp, and exports
      # CREWRIG_USAGE_ROOT and the TIMING_*_PAYLOAD paths to the steps below.
      - name: Timing fixtures
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/usage-capture-timing-fixtures.ts "$env:RUNNER_TEMP\usage-capture-timing"

      # Budget: 400 ms for hooks/usage-capture.ts on the fast path (fresh stamp,
      # nothing to capture). Observed max 120.5 ms over 10 runs (run
      # 36738818466); 3 x 120.5 = 361.5 -> 400; was 750. '--' is quoted so pwsh
      # hands it to node verbatim.
      - name: Fast path timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 400 --stdin-file $env:TIMING_FAST_PAYLOAD '--' hooks/usage-capture.ts claude-code Stop

      # Budget: 1000 ms for hooks/usage-capture.ts on the slow path (one fixture
      # payload captured into an empty usage root per run). Observed max
      # 320.2 ms over 10 runs (run 36738818466); 3 x 320.2 = 960.6 -> 1000; was
      # 2000.
      - name: Slow path timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 1000 --stdin-file $env:TIMING_SLOW_PAYLOAD --env-tmpdir CREWRIG_USAGE_ROOT '--' hooks/usage-capture.ts claude-code Stop

      # Budget: 550 ms for hooks/antigravity-statusline-shim.ts with no prior
      # command (the prior command's own time is excluded). Observed max
      # 182.9 ms over 10 runs (run 36738818466); 3 x 182.9 = 548.7 -> 550; was
      # 2000.
      - name: Statusline shim timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 550 --stdin-file $env:TIMING_SHIM_PAYLOAD --env-tmpdir CREWRIG_USAGE_ROOT '--' hooks/antigravity-statusline-shim.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0253 R27 (delta-01 R17, R24): the usage-wrappers row's copy of the
  # template above. Offline: no network, no Python and no `bash`; the one step
  # spawns the nine TypeScript usage entries directly under pwsh against an
  # isolated temp HOME and usage root. R24 records, never gates: the test
  # prints a `timing: <name> <ms> ms` line per command and no step asserts a
  # timing budget. No path filter, like the Windows jobs above.
  windows-usage-wrappers:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Nine usage entries run offline, flag-free entry form keeps stderr free of warnings
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-wrappers-windows.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0248 R33, R34: the worktree git guard row's copy of the template
  # above. pwsh is the interpreter of every step. Budgets are the initial values
  # of R33 (750 ms fast path, 2000 ms slow path refused and allowed); they are
  # recalibrated from the first green run to max(3 x the largest observed run,
  # 300 ms) rounded up to the next 50 ms, only where lower, and each is stated
  # next to its script. The guard runs from the fixture repository as its
  # process directory (--cwd): its slow path reads the claim state from there.
  windows-worktree-git-guard:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Guard entry from backslash working directories, each CLI command line through its interpreter
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-guard-windows.test.ts

      - name: Claim tool from PowerShell with no POSIX layer
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-claim-windows.test.ts

      # Creates the fixture repository and worktrees, takes the claim of the
      # allowed ticket with the TypeScript tool, writes the three payloads and
      # exports TIMING_FIXTURE_CWD, TIMING_FAST_PAYLOAD, TIMING_REFUSED_PAYLOAD
      # and TIMING_ALLOWED_PAYLOAD to the steps below through $GITHUB_ENV.
      - name: Timing fixtures
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/worktree-timing-fixtures.ts "$env:RUNNER_TEMP\worktree-guard-timing"

      # Budget: 750 ms (initial, R33) for hooks/worktree-git-guard.ts on the
      # fast path (a safe command). '--' is quoted so pwsh hands it to node
      # verbatim rather than reading it as its own end-of-parameters token.
      - name: Fast path timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 --stdin-file $env:TIMING_FAST_PAYLOAD --cwd $env:TIMING_FIXTURE_CWD '--' "$env:GITHUB_WORKSPACE\hooks\worktree-git-guard.ts"

      # Budget: 2000 ms (initial, R33) for the slow path, refused outcome: a
      # prohibited command in a ticket worktree with no claim, so every run
      # exits 1 (--expect-exit 1).
      - name: Slow path refused timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 2000 --expect-exit 1 --stdin-file $env:TIMING_REFUSED_PAYLOAD --cwd $env:TIMING_FIXTURE_CWD '--' "$env:GITHUB_WORKSPACE\hooks\worktree-git-guard.ts"

      # Budget: 2000 ms (initial, R33) for the slow path, allowed outcome: the
      # same command in a worktree whose claim the fixture step took.
      - name: Slow path allowed timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 2000 --stdin-file $env:TIMING_ALLOWED_PAYLOAD --cwd $env:TIMING_FIXTURE_CWD '--' "$env:GITHUB_WORKSPACE\hooks\worktree-git-guard.ts"
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0247 R31, R19: the MemPalace transcript hook row's copy of the
  # template above. pwsh is the interpreter of every step. Budgets are the
  # initial values of R19 (750 ms for cases (a) and (b), 2000 ms for (c) and
  # (d)); they are recalibrated from the first green run to max(3 x the
  # largest observed run, 300 ms) rounded up to the next 50 ms, only where
  # lower, and each is stated next to its script. Every budget step names its
  # case with --case, which the harness prints in its failure line. '--' is
  # quoted so pwsh hands it to node verbatim rather than reading it as its own
  # end-of-parameters token.
  windows-mempalace-transcript:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Hook entry against a stub daemon, each CLI command line through its interpreter
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/mempalace-transcript-windows.test.ts

      # Writes the payloads, a token file and a 50 MB transcript, releases a
      # loopback port, and exports TIMING_TOKEN_FILE, TIMING_POSTTOOLUSE_PAYLOAD,
      # TIMING_STOP_PAYLOAD, TIMING_PROMPT_PAYLOAD and TIMING_CLOSED_PORT to the
      # steps below through $GITHUB_ENV.
      - name: Timing fixtures
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/transcript-timing-fixtures.ts "$env:RUNNER_TEMP\mempalace-transcript-timing"

      # Budget: 300 ms (R19(a), recalibrated from the first green windows-latest
      # run, 37593989881: max 86.1 ms -> max(3 x 86.1, 300) = 300 ms, initial
      # 750 ms) for hooks/mempalace-transcript.ts, direct form, `PostToolUse`
      # payload (the entry's cheap exit).
      - name: Case (a) PostToolUse direct form timing budget
        env:
          MEMPALACE_DAEMON_TOKEN_FILE: ${{ env.TIMING_TOKEN_FILE }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 300 --case a-posttooluse-direct --stdin-file $env:TIMING_POSTTOOLUSE_PAYLOAD '--' hooks/mempalace-transcript.ts claude-code

      # Budget: 300 ms (R19(b), recalibrated from run 37593989881: max 70.7 ms
      # -> max(3 x 70.7, 300) = 300 ms, initial 750 ms) for
      # hooks/mempalace-transcript.ts, legacy form with
      # MEMPALACE_TRANSCRIPT_ENABLED unset (disabled exit).
      - name: Case (b) legacy form disabled timing budget
        env:
          MEMPALACE_DAEMON_TOKEN_FILE: ${{ env.TIMING_TOKEN_FILE }}
        run: |
          Remove-Item Env:MEMPALACE_TRANSCRIPT_ENABLED -ErrorAction SilentlyContinue
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 300 --case b-legacy-disabled --stdin-file $env:TIMING_POSTTOOLUSE_PAYLOAD '--' hooks/mempalace-transcript.ts

      # Budget: 550 ms (R19(c), recalibrated from run 37593989881: max 181.0 ms
      # -> 3 x 181.0 = 543 ms, rounded up to 550 ms, initial 2000 ms) for
      # hooks/mempalace-transcript.ts,
      # direct form, `Stop` payload naming the 50 MB transcript, each record
      # persisted to the loopback stub daemon. with-stub-daemon.ts starts the
      # stub, exports MEMPALACE_MCP_HOST/PORT to the harness, checks that the
      # stub received the 10 records, and stops it.
      - name: Case (c) Stop with a 50 MB transcript timing budget
        env:
          MEMPALACE_DAEMON_TOKEN_FILE: ${{ env.TIMING_TOKEN_FILE }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/with-stub-daemon.ts --expect-requests 10 '--' node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 550 --case c-stop-50mb-transcript --stdin-file $env:TIMING_STOP_PAYLOAD '--' hooks/mempalace-transcript.ts claude-code

      # Budget: 550 ms (R19(d), recalibrated from run 37593989881: max 173.8 ms
      # -> 3 x 173.8 = 521.4 ms, rounded up to 550 ms, initial 2000 ms) for
      # hooks/mempalace-transcript.ts,
      # direct form, `UserPromptSubmit` payload, nothing listening on the
      # daemon port (a loopback port the fixture step bound and released).
      - name: Case (d) UserPromptSubmit with nothing listening timing budget
        env:
          MEMPALACE_DAEMON_TOKEN_FILE: ${{ env.TIMING_TOKEN_FILE }}
          MEMPALACE_MCP_HOST: 127.0.0.1
          MEMPALACE_MCP_PORT: ${{ env.TIMING_CLOSED_PORT }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 550 --case d-nothing-listening --stdin-file $env:TIMING_PROMPT_PAYLOAD '--' hooks/mempalace-transcript.ts claude-code
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0253 R27, R17: the history import and operational commands row's copy
  # of the Windows template above. pwsh is the interpreter of the one step. The
  # suite is offline: it creates a local upstream repository itself and runs
  # the TypeScript entry against it with Git for Windows, spawning no `bash`.
  # No timing-budget step: the suite prints `timing:` lines, which R24 records
  # and never gates.
  windows-sync-from-upstream:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync from upstream entry against a local upstream repository, no bash
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/sync-from-upstream-windows.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0250 R28, R29: the component-build row's copy of the template above.
  # pwsh is the interpreter of every step. The write-path proof prints its own
  # elapsed time and no step has a timing budget (R29). The shell-parity suites
  # self-skip off Linux; the conformance, YAML corpus and differential suites
  # are not listed. No path filter, like the Windows jobs above.
  windows-build-components:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false

      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js

      # Asserts `--target all --check` exits 0 with its OK line, builds into a
      # throwaway REPO_DIR and compares every produced file with the committed
      # four trees, runs --list-output-dirs, and prints the elapsed time.
      - name: Write-path proof
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/windows-build-proof.ts

      - name: Test the TypeScript component-build core
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-cli-config.test.ts scripts/tests/build-components-cli.test.ts scripts/tests/build-components-dependency.test.ts scripts/tests/build-components-entry-form.test.ts scripts/tests/build-components-file-size.test.ts scripts/tests/build-components-fixture-closure.test.ts scripts/tests/build-components-hardening-names.test.ts scripts/tests/build-components-hardening-yaml.test.ts scripts/tests/build-components-provenance.test.ts scripts/tests/build-components-resources.test.ts scripts/tests/build-components-write.test.ts scripts/tests/yaml-text.test.ts scripts/tests/render-command.test.ts scripts/tests/component-resolve.test.ts scripts/tests/model-resolve-*.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves (spec 0109)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # Runs before the corpus lint so a broken linter is diagnosed by its own
      # suite rather than reported only as a corpus failure. This job is where
      # the suite belongs: it provisions the npm-installed node_modules the
      # suite needs, which the hermetic check-components job does not.
      - name: Test spec linter regression
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-spec-linter.sh

      - name: Lint specs
        env:
          # The base-branch `status: draft` check (spec 0109 R2) compares against
          # the PR's *target* branch. On a push there is no PR context, so the
          # empty value hands the linter back to its own default derivation
          # (first `crewrig|origin` remote + /main).
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
        # Read the log line, not the exit code, to tell an unresolvable-base
        # wiring fault from a lint finding: the linter distinguishes them (exit 2
        # vs 1), but Task collapses any non-zero status into its own 201, so only
        # the `[ERROR]` line survives this wrapper. Kept behind `task` on purpose
        # — `ci/ci-capabilities.yml` declares this command for both engines
        # (check-ci-parity.sh enforces the agreement, and .gitlab-ci.yml is
        # generated from it), and nothing here reads the exit code beyond
        # pass/fail, so bypassing the wrapper would cost symmetry and buy no
        # observable distinction.
        run: task spec:lint
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  test-harness-curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test harness curator
        run: bash artifacts/library/skills/harness-curator/scripts/test.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-skill-versions:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves

      - name: Enforce version bump on changed skill/agent sources
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-skill-versions.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-extension-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git show BASE:path` resolves the old carrier

      - name: Enforce carrier-version bump on changed extension sources (spec 0044)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-extension-version-bump.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-spec-id-reserved:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves (spec 0112)

      # `command -v git` is true on ubuntu-latest, so this step is a no-op here.
      # It exists because the capability declares no `requires.tools`, and the
      # GitLab job generated from that declaration runs on debian:stable-slim,
      # which ships no git. Keeping the conditional install inside `command:`
      # is what lets one declaration serve both engines without touching
      # scripts/build-ci.sh or scripts/check-ci-parity.sh. No nested `sudo`:
      # normalize_cmd strips only a leading one, so a nested `sudo` would make
      # this step diverge from the declared command and fail parity Arm 1.
      - name: Ensure git is available
        run: command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)

      - name: Verify every spec id added by the change was secured (spec 0112)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          # Workflow CONTEXTS, not ambient environment — they only reach the
          # process through this mapping. The guard compares the two to
          # discriminate pull-request origin (R10): a same-repository unsecured
          # id fails, a fork's is reported without blocking. It refuses to guess
          # when either is missing, because guessing "fork" would silently
          # disable the guard on every pull request. On GitLab CI the equivalent
          # pair (CI_MERGE_REQUEST_SOURCE_PROJECT_PATH / CI_PROJECT_PATH) is
          # already ambient, which is why the generated job needs no counterpart.
          # Named CREWRIG_* rather than GITHUB_*: GitHub reserves the GITHUB_
          # prefix, and there is no native head-repo variable to mirror anyway
          # (GITHUB_HEAD_REF is the branch, not the repository) — which is
          # precisely why this mapping has to exist.
          CREWRIG_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CREWRIG_PR_BASE_REPO: ${{ github.repository }}
        run: bash scripts/check-spec-id-reserved.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-agents-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md file size
        run: bash scripts/check-agents-size.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-feedback-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Enforce upstream-tier feedback routing (spec 0030)
        run: bash scripts/check-feedback-routing.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  gitlab-ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify the generated GitLab pipeline matches the contract (spec 0048)
        run: bash scripts/build-ci.sh --check
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify the reference, GitHub Actions, and GitLab pipelines agree (spec 0049)
        run: bash scripts/check-ci-parity.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
