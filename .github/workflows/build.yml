name: Build & Validate

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
    tags-ignore:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all extensions
        run: npm run build --workspaces --if-present
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  component-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            component-drift:
              - 'scripts/build-components.sh'
              - 'scripts/build-components.ts'
              - 'scripts/test-build-components.sh'
              - 'scripts/tests/test-model-resolution.sh'
              - 'scripts/tests/test-agent-profile-migration.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'docs/agent-profile-migration.md'
              - 'model-mappings/**'
              - '.agents/skills/**'
              - '.claude/skills/**'
              - '.gemini/skills/**'
              - '.github/skills/**'
              - '.gemini/commands/**'
              - 'crewrig.config.toml'
              - 'package.json'
              - 'package-lock.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.component-drift == 'true'
        with:
          node-version: 24
      - name: Install production dependencies
        if: steps.filter.outputs.component-drift == 'true'
        run: npm ci --omit=dev --workspaces=false
      - uses: actions/cache@v4
        if: steps.filter.outputs.component-drift == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/build-components.sh', 'scripts/build-components.ts', 'scripts/test-build-components.sh', 'scripts/tests/test-model-resolution.sh', 'scripts/tests/test-agent-profile-migration.sh', 'scripts/lib/**', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt', 'docs/agent-profile-migration.md', 'model-mappings/**', '.agents/skills/**', '.claude/skills/**', '.gemini/skills/**', '.github/skills/**', '.gemini/commands/**', 'crewrig.config.toml', 'package.json', 'package-lock.json') }}
      - name: Floor guard accepts the running Node.js
        if: steps.filter.outputs.component-drift == 'true'
        run: node scripts/lib/node-floor-guard.js
      - name: Build Components
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/build-components.ts,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,.agents/skills/**,.claude/skills/**,.gemini/skills/**,.github/skills/**,.gemini/commands/**,crewrig.config.toml,package.json,package-lock.json" --key-env "" -- node scripts/build-components.ts --target all --check
      - name: Test Assembly Verification
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/build-components.ts,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,.agents/skills/**,.claude/skills/**,.gemini/skills/**,.github/skills/**,.gemini/commands/**,crewrig.config.toml,package.json,package-lock.json" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-assembly-verification.sh
      - name: Test Build Components
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/build-components.ts,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,.agents/skills/**,.claude/skills/**,.gemini/skills/**,.github/skills/**,.gemini/commands/**,crewrig.config.toml,package.json,package-lock.json" --key-env "" -- bash scripts/test-build-components.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  model-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            model-resolution:
              - 'scripts/build-components.sh'
              - 'scripts/build-components.ts'
              - 'scripts/test-build-components.sh'
              - 'scripts/tests/test-model-resolution.sh'
              - 'scripts/tests/test-agent-profile-migration.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'docs/agent-profile-migration.md'
              - 'model-mappings/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.model-resolution == 'true'
        with:
          node-version: 24
      - name: Install production dependencies
        if: steps.filter.outputs.model-resolution == 'true'
        run: npm ci --omit=dev --workspaces=false
      - name: Install yq
        if: steps.filter.outputs.model-resolution == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.model-resolution == 'true'
        with:
          path: .ci-cache
          key: model-resolution-${{ hashFiles('scripts/build-components.sh', 'scripts/build-components.ts', 'scripts/test-build-components.sh', 'scripts/tests/test-model-resolution.sh', 'scripts/tests/test-agent-profile-migration.sh', 'scripts/lib/**', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt', 'docs/agent-profile-migration.md', 'model-mappings/**', 'scripts/ci-cache-guard.sh') }}
      - name: Test Model Resolution
        if: steps.filter.outputs.model-resolution == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/build-components.ts,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,scripts/ci-cache-guard.sh" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-model-resolution.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  agent-profile-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent-profile-migration:
              - 'scripts/build-components.sh'
              - 'scripts/build-components.ts'
              - 'scripts/test-build-components.sh'
              - 'scripts/tests/test-model-resolution.sh'
              - 'scripts/tests/test-agent-profile-migration.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'docs/agent-profile-migration.md'
              - 'model-mappings/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.agent-profile-migration == 'true'
        with:
          node-version: 24
      - name: Install production dependencies
        if: steps.filter.outputs.agent-profile-migration == 'true'
        run: npm ci --omit=dev --workspaces=false
      - name: Install yq
        if: steps.filter.outputs.agent-profile-migration == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.agent-profile-migration == 'true'
        with:
          path: .ci-cache
          key: agent-profile-migration-${{ hashFiles('scripts/build-components.sh', 'scripts/build-components.ts', 'scripts/test-build-components.sh', 'scripts/tests/test-model-resolution.sh', 'scripts/tests/test-agent-profile-migration.sh', 'scripts/lib/**', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt', 'docs/agent-profile-migration.md', 'model-mappings/**', 'scripts/ci-cache-guard.sh') }}
      - name: Test Agent Profile Migration
        if: steps.filter.outputs.agent-profile-migration == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/build-components.ts,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,scripts/ci-cache-guard.sh" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-agent-profile-migration.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  # Spec 0250 R27: production install (spec 0240 R4), floor guard, `--check` on the
  # real tree, the Linux run of the Windows proof script, then the named suites
  # (the dev-toolchain suite runs in `lint-typescript`). Needs yq for the parity suites.
  build-components-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build-components-ts:
              - 'scripts/build-components.*'
              - 'scripts/lib/build-components/**'
              - 'scripts/lib/render-command.ts'
              - 'scripts/lib/component-resolve.ts'
              - 'scripts/lib/model-resolve.ts'
              - 'scripts/lib/yaml-text.ts'
              - 'scripts/lib/escape-control.ts'
              - 'scripts/lib/line-endings.ts'
              - 'scripts/lib/paths.ts'
              - 'scripts/lib/tmp-file.ts'
              - 'scripts/lib/require-dependency.ts'
              - 'scripts/lib/node-floor-guard.js'
              - 'scripts/lib/render-command.sh'
              - 'scripts/lib/component-resolve.sh'
              - 'scripts/lib/model-resolve.sh'
              - 'scripts/lib/model-resolve/**'
              - 'scripts/tests/build-components-*.test.ts'
              - 'scripts/tests/yaml-text.test.ts'
              - 'scripts/tests/render-command.test.ts'
              - 'scripts/tests/component-resolve.test.ts'
              - 'scripts/tests/model-resolve-*.test.ts'
              - 'scripts/tests/lib/yaml-lib.ts'
              - 'scripts/tests/lib/shell-resolve-harness.ts'
              - 'scripts/tests/lib/mapping-fixtures.ts'
              - 'scripts/tests/lib/build-fixture-tree.ts'
              - 'scripts/tests/lib/windows-build-proof.ts'
              - 'scripts/tests/lib/shim-env.ts'
              - 'scripts/tests/fixtures/build-components/**'
              - 'artifacts/**'
              - 'model-mappings/**'
              - 'tests/fixtures/**'
              - 'crewrig.config.toml'
              - 'package.json'
              - 'package-lock.json'
              - '.agents/agents/**'
              - '.agents/skills/**'
              - '.claude/agents/**'
              - '.claude/skills/**'
              - '.gemini/agents/**'
              - '.gemini/commands/**'
              - '.gemini/skills/**'
              - '.github/agents/**'
              - '.github/skills/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.build-components-ts == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install production dependencies
        if: steps.filter.outputs.build-components-ts == 'true'
        run: npm ci --omit=dev --workspaces=false
      - name: Install yq
        if: steps.filter.outputs.build-components-ts == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Floor guard accepts Node.js 24
        if: steps.filter.outputs.build-components-ts == 'true'
        run: node scripts/lib/node-floor-guard.js
      - name: Write-path proof on Linux
        if: steps.filter.outputs.build-components-ts == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/tests/lib/windows-build-proof.ts
      - name: Test the TypeScript component-build core
        if: steps.filter.outputs.build-components-ts == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-cleanup.test.ts scripts/tests/build-components-cli.test.ts scripts/tests/build-components-cli-config.test.ts scripts/tests/build-components-conformance.test.ts scripts/tests/build-components-conformance-mutation.test.ts scripts/tests/build-components-conformance-org.test.ts scripts/tests/build-components-conformance-render.test.ts scripts/tests/build-components-conformance-root.test.ts scripts/tests/build-components-dependency.test.ts scripts/tests/build-components-entry-form.test.ts scripts/tests/build-components-file-size.test.ts scripts/tests/build-components-fixture-closure.test.ts scripts/tests/build-components-hardening-names.test.ts scripts/tests/build-components-hardening-names-e2e.test.ts scripts/tests/build-components-hardening-printed.test.ts scripts/tests/build-components-hardening-printed-values.test.ts scripts/tests/build-components-hardening-yaml.test.ts scripts/tests/build-components-hardening-yaml-e2e.test.ts scripts/tests/build-components-names.test.ts scripts/tests/build-components-output.test.ts scripts/tests/build-components-output-agents.test.ts scripts/tests/build-components-output-resources.test.ts scripts/tests/build-components-output-skills.test.ts scripts/tests/build-components-provenance.test.ts scripts/tests/build-components-resources.test.ts scripts/tests/build-components-write.test.ts scripts/tests/build-components-shim.test.ts scripts/tests/build-components-ci-wiring.test.ts scripts/tests/build-components-references.test.ts scripts/tests/build-components-yaml-corpus.test.ts scripts/tests/yaml-text.test.ts scripts/tests/render-command.test.ts scripts/tests/component-resolve.test.ts scripts/tests/model-resolve-*.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0254 R22, R27: the TypeScript extension and plugin builder twin suites.
  extension-builders-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-builders-ts:
              - 'scripts/lib/extension/**'
              - 'scripts/lib/org-mcp.ts'
              - 'scripts/build-extension.*'
              - 'scripts/build-claude-plugin.*'
              - 'scripts/build-copilot-plugin.*'
              - 'scripts/build-antigravity-extension.*'
              - 'scripts/migrate-extension.*'
              - 'scripts/lib/extension-manifest.sh'
              - 'scripts/lib/extension-hooks.sh'
              - 'scripts/lib/extension-*.json'
              - 'scripts/lib/render-context.sh'
              - 'scripts/lib/common.sh'
              - 'scripts/lib/render-command.ts'
              - 'scripts/lib/yaml-text.ts'
              - 'scripts/lib/line-endings.ts'
              - 'scripts/lib/paths.ts'
              - 'scripts/lib/tmp-file.ts'
              - 'scripts/lib/glob-engine.ts'
              - 'scripts/lib/require-dependency.ts'
              - 'scripts/lib/node-floor-guard.js'
              - 'scripts/tests/extension-*.test.ts'
              - 'scripts/tests/lib/extension-fixtures.ts'
              - 'scripts/tests/lib/shell-extension-harness.ts'
              - 'scripts/tests/fixtures/extension/**'
              - 'extensions/**'
              - 'extension-skeleton/**'
              - 'package.json'
              - 'package-lock.json'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.extension-builders-ts == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install production dependencies
        if: steps.filter.outputs.extension-builders-ts == 'true'
        run: npm ci --omit=dev --workspaces=false
      - name: Install yq
        if: steps.filter.outputs.extension-builders-ts == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Floor guard accepts Node.js 24
        if: steps.filter.outputs.extension-builders-ts == 'true'
        run: node scripts/lib/node-floor-guard.js
      - name: Test the TypeScript extension and plugin builder twins
        if: steps.filter.outputs.extension-builders-ts == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/extension-json.test.ts scripts/tests/extension-json-corpus.test.ts scripts/tests/extension-org-mcp.test.ts scripts/tests/extension-descriptors.test.ts scripts/tests/extension-manifest.test.ts scripts/tests/extension-shape-guard.test.ts scripts/tests/extension-gap-record.test.ts scripts/tests/extension-tree-copy.test.ts scripts/tests/extension-resolve.test.ts scripts/tests/extension-validate.test.ts scripts/tests/extension-hooks.test.ts scripts/tests/extension-mcp-delivery.test.ts scripts/tests/extension-context.test.ts scripts/tests/extension-context-shell.test.ts scripts/tests/extension-conformance.test.ts scripts/tests/extension-file-size.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0250 R3, R27: the build entry prints nothing on the oldest Node.js 24
  # release. No path filter, like `mempalace-transcript-node-24-0`.
  build-components-ts-node-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false

      - name: Entry form and silence runs on Node.js 24.0.0
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-entry-form.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  extension-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-render:
              - 'scripts/check-extension-pivot.sh'
              - 'scripts/build-extension.sh'
              - 'scripts/install-extension.sh'
              - 'scripts/lib/extension-manifest.sh'
              - 'scripts/lib/extension-percli-keys.json'
              - 'scripts/lib/extension-generated-class.json'
              - 'scripts/tests/test-check-extension-pivot.sh'
              - 'scripts/tests/test-build-extension.sh'
              - 'scripts/tests/test-extension-render-conformance.sh'
              - 'Taskfile.yml'
              - 'extensions/**'
              - 'artifacts/**'
              - 'scripts/lib/extension-hooks.sh'
              - 'scripts/lib/extension-targets.json'
              - 'scripts/check-extension-hook-tokens.sh'
              - 'scripts/check-extension-hook-map.sh'
              - 'docs/extension-hook-events.md'
              - 'extension-skeleton/**'
              - 'scripts/create-extension.sh'
              - 'scripts/build-claude-plugin.sh'
              - 'scripts/build-copilot-plugin.sh'
              - 'scripts/build-antigravity-extension.sh'
              - 'scripts/tests/test-check-extension-hook-tokens.sh'
              - 'scripts/tests/test-check-extension-hook-map.sh'
              - 'scripts/lib/common.sh'
              - 'scripts/probe-extension-mcp-token.sh'
              - 'scripts/tests/test-extension-mcp-manifest.sh'
              - 'scripts/install-antigravity-extension.sh'
              - 'scripts/lib/render-context.sh'
              - 'scripts/lib/extension-legacy-shape.json'
              - 'scripts/migrate-extension.sh'
              - 'scripts/tests/test-migrate-extension.sh'
              - 'scripts/release-package-extension.sh'
              - 'scripts/lib/extension-install.sh'
              - 'scripts/tests/test-release-package-extension.sh'
              - 'scripts/tests/test-create-extension-combinations.sh'
      - name: Install yq
        if: steps.filter.outputs.extension-render == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Pivot
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/check-extension-pivot.sh
      - name: Test Check Extension Pivot
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-pivot.sh
      - name: Test Build Extension
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-build-extension.sh
      - name: Test Extension Render Conformance
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-extension-render-conformance.sh
      - name: Test Extension MCP Manifest
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-extension-mcp-manifest.sh
      - name: Build Extension --check
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/build-extension.sh --check
      - name: Check Extension Hook Tokens
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/check-extension-hook-tokens.sh
      - name: Test Check Extension Hook Tokens
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-hook-tokens.sh
      - name: Check Extension Hook Map
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/check-extension-hook-map.sh
      - name: Test Check Extension Hook Map
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-hook-map.sh
      - name: Test Migrate Extension
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-migrate-extension.sh
      - name: Test Release Package Extension
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-release-package-extension.sh
      - name: Test Create Extension Combinations
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-create-extension-combinations.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  extension-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-provenance:
              - 'scripts/check-extension-provenance.sh'
              - 'scripts/tests/test-check-extension-provenance.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-provenance == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Provenance
        if: steps.filter.outputs.extension-provenance == 'true'
        run: bash scripts/check-extension-provenance.sh
