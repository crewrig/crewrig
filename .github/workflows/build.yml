      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Entry form and unstubbed silence runs on Node.js 24.0.0
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/hook-entry-form.test.ts
