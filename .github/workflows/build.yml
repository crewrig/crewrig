name: Build & Validate

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
    tags-ignore:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all extensions
        run: npm run build --workspaces --if-present

  check-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # The extension pivot carrier round-trip test validates the rendered .toml
      # via python3/tomllib (Python >= 3.11). ubuntu-latest ships Python 3.12,
      # but pin it explicitly so the toolchain prerequisite is declared, not
      # incidental (spec 0042 PLAN v2, finding F6).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check community component drift
        run: bash scripts/build-components.sh --target all --check

      - name: Test build-components validator
        run: bash scripts/test-build-components.sh

      - name: Test extract_frontmatter regression
        run: bash scripts/tests/test-extract-frontmatter.sh

      - name: Test check-skill-versions regression
        run: bash scripts/tests/test-check-skill-versions.sh

      - name: Test check-feedback-routing regression (spec 0030)
        run: bash scripts/tests/test-check-feedback-routing.sh

      - name: Enforce extension pivot sourcing (spec 0042)
        run: bash scripts/check-extension-pivot.sh

      - name: Test check-extension-pivot regression (spec 0042)
        run: bash scripts/tests/test-check-extension-pivot.sh

      - name: Test build-extension-pivot renderer + carrier (spec 0042)
        run: bash scripts/tests/test-build-extension-pivot.sh

      - name: Check extension pivot .toml drift (spec 0042)
        run: bash scripts/build-extension-pivot.sh --check

      - name: Enforce extension provenance (spec 0043)
        run: bash scripts/check-extension-provenance.sh

      - name: Test check-extension-provenance regression (spec 0043)
        run: bash scripts/tests/test-check-extension-provenance.sh

      - name: Enforce extension manifest single-version (spec 0044)
        run: bash scripts/check-extension-manifest-version.sh

      - name: Test check-extension-manifest-version regression (spec 0044)
        run: bash scripts/tests/test-check-extension-manifest-version.sh

      - name: Test check-extension-version-bump regression (spec 0044)
        run: bash scripts/tests/test-check-extension-version-bump.sh

      - name: Test install-claude-plugin marketplace regression (spec 0045)
        run: bash scripts/tests/test-install-claude-plugin-marketplace.sh

      - name: Test build-claude-plugin agents glob regression (issue #600)
        run: bash scripts/tests/test-build-claude-plugin-agents-glob.sh

      - name: Test Gemini agent frontmatter contract (issue #54)
        run: bash scripts/tests/test-gemini-agent-frontmatter.sh

      - name: Test e2e auth .claude.json mount (issue #112)
        run: bash scripts/tests/test-e2e-auth-claude-json.sh

      - name: Test e2e auth Ollama Cloud mount (issue #114)
        run: bash scripts/tests/test-e2e-auth-ollama.sh

      - name: Test sync-from-upstream script
        run: bash scripts/tests/test-sync-from-upstream.sh

      - name: Check core-paths resolve at HEAD (spec 0031)
        run: bash scripts/check-core-paths.sh

      - name: Test check-core-paths regression (spec 0031)
        run: bash scripts/tests/test-check-core-paths.sh

      - name: Test check-ci-parity regression (spec 0049)
        run: bash scripts/tests/test-check-ci-parity.sh

      - name: Test assembly verification
        run: bash scripts/tests/test-assembly-verification.sh

      - name: Test artifact build/install scope (spec 0019)
        run: bash scripts/tests/test-artifact-build-install-scope.sh

      - name: Check docs index drift (spec 0027)
        run: bash scripts/build-docs-index.sh --check

      - name: Test build-docs-index regression (spec 0027)
        run: bash scripts/tests/test-build-docs-index.sh

      - name: Test mempalace-transcript hook regression (issue #530)
        run: bash scripts/tests/test-mempalace-transcript-hook.sh

      - name: Test mempalace version-range guard (spec 0082)
        run: bash scripts/tests/test-mempalace-version-range.sh

      # The spec-0108 guard's PRIMARY comparator. Installed so CI exercises the
      # real library and not only the degraded fallback; test-mempalace-pin.sh
      # fails loudly when no interpreter can import it, so a green run here means
      # the primary comparator was actually tested. Not a runtime dependency of
      # the guard itself.
      - name: Install packaging for the spec-0108 primary comparator
        run: python3 -m pip install --quiet packaging

      - name: Test mempalace pin parser and comparator (spec 0108)
        run: bash scripts/tests/test-mempalace-pin.sh

      - name: Test mempalace runtime version guard (spec 0108)
        run: bash scripts/tests/test-mempalace-runtime-guard.sh

      - name: Test mempalace operator diagnostic (spec 0108)
        run: bash scripts/tests/test-mempalace-doctor.sh

      - name: Test system-context store regression (spec 0068 + 0075)
        run: bash scripts/tests/test-system-context-store.sh

      - name: Enforce test-wiring registration (spec 0076)
        run: bash scripts/check-test-wiring.sh

      - name: Test check-test-wiring regression (spec 0076)
        run: bash scripts/tests/test-check-test-wiring.sh

      - name: Test build-ci regression (spec 0076 wiring)
        run: bash scripts/tests/test-build-ci.sh

      - name: Test chroma fd-limits regression (spec 0076 wiring)
        run: bash scripts/tests/test-chroma-fd-limits.sh

      - name: Test chroma health-race regression (spec 0076 wiring)
        run: bash scripts/tests/test-chroma-health-race.sh

      - name: Test chroma-server regression (spec 0076 wiring)
        run: bash scripts/tests/test-chroma-server.sh

      - name: Test e2e assert-lib regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-assert-lib.sh

      - name: Test e2e auth-common regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-auth-common.sh

      - name: Test e2e auth-ready regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-auth-ready.sh

      - name: Test e2e auth-taskfile regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-auth-taskfile.sh

      - name: Test e2e defaults-toml regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-defaults-toml.sh

      - name: Test e2e docker-images regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-docker-images.sh

      - name: Test e2e gitignore regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-gitignore.sh

      - name: Test e2e judge-config regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-judge-config.sh

      - name: Test e2e llm-judge-lib regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-llm-judge-lib.sh

      - name: Test e2e report regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-report.sh

      - name: Test e2e runner-delegation regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-runner-delegation.sh

      - name: Test e2e runner-taskfile regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-runner-taskfile.sh

      - name: Test e2e scenarios-parity regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-scenarios-parity.sh

      - name: Test e2e scenarios-structure regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-scenarios-structure.sh

      - name: Test e2e structural-lib regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-structural-lib.sh

      - name: Test e2e taskfile regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-taskfile.sh

      - name: Test e2e versions-lock regression (spec 0076 wiring)
        run: bash scripts/tests/test-e2e-versions-lock.sh

      - name: Test e2e README budget (spec 0077)
        run: bash scripts/tests/test-e2e-readme.sh

      - name: Test e2e lib README budget (spec 0077)
        run: bash scripts/tests/test-e2e-libs-readme.sh

      - name: Test e2e runner regression (spec 0078)
        run: bash scripts/tests/test-e2e-runner.sh

      - name: Test e2e toml-merge regression (spec 0079)
        run: bash scripts/tests/test-e2e-toml-merge.sh

      - name: Test setup validation-backend helper regression (spec 0080)
        run: bash scripts/tests/test-setup-validation-backend.sh

      - name: Test TLS-delegation helper and runtime wrapper (spec 0084)
        run: bash scripts/tests/test-tls-delegation.sh

      - name: Check no machine-specific home paths (spec 0081)
        run: bash scripts/check-no-machine-paths.sh

      - name: Test check-no-machine-paths regression (spec 0081)
        run: bash scripts/tests/test-check-no-machine-paths.sh

      - name: Test setup MCP-merge preservation regression (spec 0089)
        run: bash scripts/tests/test-setup-mcp-merge.sh

      - name: Test org-level MCP declaration channel regression (spec 0091)
        run: bash scripts/tests/test-setup-org-mcp.sh

      - name: Test setup catalogue-picker regression (spec 0096)
        run: bash scripts/tests/test-setup-catalogue-picker.sh

      - name: Test setup ensure-tier-built regression (spec 0107)
        run: bash scripts/tests/test-setup-ensure-tier-built.sh

      - name: Check Gemini overlay enrollment (spec 0085)
        run: bash scripts/check-gemini-overlay-enrollment.sh

      - name: Test Gemini overlay enrollment regression (spec 0085)
        run: bash scripts/tests/test-check-gemini-overlay-enrollment.sh

      - name: Test Bash 3.2 portability guard regression (spec 0111)
        run: bash scripts/tests/test-check-bash32-portability.sh

      - name: Test spec-id reservation tool regression (spec 0112)
        run: bash scripts/tests/test-reserve-spec-id.sh

      - name: Test spec-id reservation check regression (spec 0112)
        run: bash scripts/tests/test-check-spec-id-reserved.sh

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        # extensions/**/commands/*.md are pivot command SOURCES whose body IS the
        # rendered command prompt, not prose — linting them as documents (e.g.
        # MD041 first-line-heading) would force a cosmetic heading that leaks
        # into the prompt. Exclude them; every other extension .md (skills,
        # agents, context, README) stays linted (spec 0042).
        run: markdownlint "**/*.md" --ignore node_modules --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md'

  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves (spec 0109)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # Runs before the corpus lint so a broken linter is diagnosed by its own
      # suite rather than reported only as a corpus failure. This job is where
      # the suite belongs: it provisions the npm-installed node_modules the
      # suite needs, which the hermetic check-components job does not.
      - name: Test spec linter regression
        run: bash scripts/tests/test-spec-linter.sh

      - name: Lint specs
        env:
          # The base-branch `status: draft` check (spec 0109 R2) compares against
          # the PR's *target* branch. On a push there is no PR context, so the
          # empty value hands the linter back to its own default derivation
          # (first `crewrig|origin` remote + /main).
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
        # Read the log line, not the exit code, to tell an unresolvable-base
        # wiring fault from a lint finding: the linter distinguishes them (exit 2
        # vs 1), but Task collapses any non-zero status into its own 201, so only
        # the `[ERROR]` line survives this wrapper. Kept behind `task` on purpose
        # — `ci/ci-capabilities.yml` declares this command for both engines
        # (check-ci-parity.sh enforces the agreement, and .gitlab-ci.yml is
        # generated from it), and nothing here reads the exit code beyond
        # pass/fail, so bypassing the wrapper would cost symmetry and buy no
        # observable distinction.
        run: task spec:lint

  test-harness-curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Smoke-test harness curator
        run: bash artifacts/library/skills/harness-curator/scripts/test.sh

  check-skill-versions:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves

      - name: Enforce version bump on changed skill/agent sources
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-skill-versions.sh

  check-extension-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git show BASE:path` resolves the old carrier

      - name: Enforce carrier-version bump on changed extension sources (spec 0044)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-extension-version-bump.sh

  check-spec-id-reserved:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves (spec 0112)

      # `command -v git` is true on ubuntu-latest, so this step is a no-op here.
      # It exists because the capability declares no `requires.tools`, and the
      # GitLab job generated from that declaration runs on debian:stable-slim,
      # which ships no git. Keeping the conditional install inside `command:`
      # is what lets one declaration serve both engines without touching
      # scripts/build-ci.sh or scripts/check-ci-parity.sh. No nested `sudo`:
      # normalize_cmd strips only a leading one, so a nested `sudo` would make
      # this step diverge from the declared command and fail parity Arm 1.
      - name: Ensure git is available
        run: command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)

      - name: Verify every spec id added by the change was secured (spec 0112)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          # Workflow CONTEXTS, not ambient environment — they only reach the
          # process through this mapping. The guard compares the two to
          # discriminate pull-request origin (R10): a same-repository unsecured
          # id fails, a fork's is reported without blocking. It refuses to guess
          # when either is missing, because guessing "fork" would silently
          # disable the guard on every pull request. On GitLab CI the equivalent
          # pair (CI_MERGE_REQUEST_SOURCE_PROJECT_PATH / CI_PROJECT_PATH) is
          # already ambient, which is why the generated job needs no counterpart.
          # Named CREWRIG_* rather than GITHUB_*: GitHub reserves the GITHUB_
          # prefix, and there is no native head-repo variable to mirror anyway
          # (GITHUB_HEAD_REF is the branch, not the repository) — which is
          # precisely why this mapping has to exist.
          CREWRIG_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CREWRIG_PR_BASE_REPO: ${{ github.repository }}
        run: bash scripts/check-spec-id-reserved.sh

  check-agents-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md file size
        run: bash scripts/check-agents-size.sh

  check-feedback-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Enforce upstream-tier feedback routing (spec 0030)
        run: bash scripts/check-feedback-routing.sh

  gitlab-ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify the generated GitLab pipeline matches the contract (spec 0048)
        run: bash scripts/build-ci.sh --check

  check-ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify the reference, GitHub Actions, and GitLab pipelines agree (spec 0049)
        run: bash scripts/check-ci-parity.sh
