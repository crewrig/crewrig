name: Build & Validate

on:

  pull_request:
    # Spec 0168 delta-01 R11: the draft/ready transitions must re-run the
    # workflow so R1 is enforced in full after a spec-PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, "release/**"]

  push:
    branches: [main, "release/**"]
    tags-ignore:
      - "**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all extensions
        run: npm run build --workspaces --if-present
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  component-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: component-drift
          cache: true

  component-drift-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: component-drift-selftest
          cache: true

  agent-profile-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: agent-profile-migration
          yq: "4.54.1"
          cache: true

  # Spec 0250 R27: production install (spec 0240 R4), floor guard, `--check` on the
  # real tree, the Linux run of the Windows proof script, then the named suites
  # (the dev-toolchain suite runs in `lint-typescript`). Needs yq for the parity suites.
  build-components-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: build-components-ts
          yq: "4.54.1"

  # Spec 0254 R22, R27: the TypeScript extension and plugin builder suites, the golden proof and
  # the real-tree check.
  extension-builders-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: extension-builders-ts
          install: install
          yq: "4.54.1"

  # Spec 0258 R27-R29 (ticket #1337), PR A: the skill-script oracle and its YAML leg. Linux only: the
  # goldens are Linux bytes. `jq` and `git` come with the runner image; `yq` is pinned to v4.44.3 (the
  # version the goldens were generated with) and its sha256 is checked.
  skill-scripts-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: skill-scripts-ts
          yq: "4.44.3"

  # Spec 0259 R26-R28 (ticket #1338), PR P0: the governance-check suites.
  # Linux only. The shell oracle legs retired with the switch PR, so no jq or yq is installed.
  governance-checks-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: governance-checks-ts

  # Spec 0262 R21-R23 (ticket #1339): the model-CI-tooling suites and their shell differential legs.
  # Linux only. `jq` comes with the runner image; `yq` is pinned to v4.44.3 and its sha256 is checked.
  # Glob discovery: later PRs add scripts/tests/model-ci-tooling-*.test.ts files without editing this job.
  model-ci-tooling-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: model-ci-tooling-ts
          yq: "4.44.3"

  # Spec 0255 (row F2), PR B: the dark link-or-copy, component twin and manage module suites.
  # Linux only: the conformance suites spawn `bash` and `jq`.
  install-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: install-ts

  # Spec 0255 R3: the install, manage and link entries print nothing on the oldest Node.js 24 release.
  # No path filter, like `extension-builders-ts-node-24-0`.
  install-ts-node-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false
      - name: Test the install entries
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/install-entry-form.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0256 R40 (ticket #1335), PR A: the setup entry-point oracle. Linux only: the golden suites
  # skip elsewhere; `jq` and `git` come with the runner image.
  setup-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: setup-oracle

  # Spec 0256 requirement 10 (ticket #1335), PR C: the shell-against-TypeScript parity proof, one shard
  # file per CLI, and the twin differential suites. Linux only; retired with the shell setups.
  setup-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: setup-differential

  # Spec 0256 R40 (ticket #1335), PR B1: the portable unit suites of the TypeScript setup modules,
  # the TLS environment quoting and writer, and the confirm remainder. The POSIX-only suites skip
  # themselves off Linux; the Windows exercise is `windows-setup-units`.
  setup-modules-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: setup-modules-ts

  # Spec 0257 (row of epic #1231, ticket #1336), PR 4a: the TypeScript monorepo release driver
  # modules (refusals, forge, mode, branch, identity, credentials, classification, engine-log
  # parsing, the release configuration and the prepare commands) and their unit suites. Linux only.
  release-driver-modules-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: release-driver-modules-ts

  # Spec 0257 (ticket #1336), PRs 2 and 3: the deterministic tar.gz archive writer, the
  # documentation index and the release packaging modules. The release differential suite spawns
  # `bash`, `jq` and `tar`, the archive suite cross-checks with `tar` and `gzip`; all exist on the runner.
  packaging-modules-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: packaging-modules-ts

  # Spec 0250 R3, R27: the build entry prints nothing on the oldest Node.js 24
  # release. No path filter, like `mempalace-transcript-node-24-0`.
  build-components-ts-node-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false

      - name: Entry form and silence runs on Node.js 24.0.0
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/build-components-entry-form.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0254 R4: the extension entries print nothing on the oldest Node.js 24 release. No path
  # filter, like `build-components-ts-node-24-0`.
  extension-builders-ts-node-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false
      - name: Test the extension entries
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/extension-entry-form.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  extension-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: extension-render
          yq: "4.54.1"

  extension-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: extension-provenance

  extension-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: extension-manifest
          install: none

  extension-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: extension-install
          yq: "4.54.1"

  core-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: core-paths
          install: none
          yq: "4.54.1"

  ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: ci-parity
          yq: "4.54.1"
          cache: true

  docs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: docs-index
          cache: true

  docs-index-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: docs-index-selftest
          cache: true

  figure-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: figure-labels
          install: none
          apt: tesseract-ocr

  mempalace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: mempalace
          yq: "4.54.1"
          python: "3.12"
          cache: true

  test-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: test-wiring
          install: none

  test-wiring-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: test-wiring-selftest
          install: omit-dev

  chroma-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: chroma-mcp
          yq: "4.54.1"
          python: "3.12"
          cache: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: e2e
          yq: "4.44.3"
          python: "3.12"

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The v1-F2 floor guard (spec 0243 R24) refuses to write the direct form on
      # a Node.js below 24, and ubuntu-latest defaults to 22 (#1391 CI).
      - uses: ./.github/actions/ci-job
        with:
          id: setup
          yq: "4.54.1"

  check-model-mappings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: check-model-mappings
          yq: "4.54.1"

  check-agent-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: check-agent-profiles
          yq: "4.54.1"

  check-metadata-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: check-metadata-keys

  check-claude-agent-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: check-claude-agent-layout
          install: none

  check-taskfile-commands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: check-taskfile-commands

  check-taskfile-commands-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: check-taskfile-commands-selftest

  check-taskfile-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: check-taskfile-tree

  check-taskfile-tree-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: check-taskfile-tree-selftest

  check-task-provisioning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: check-task-provisioning

  check-task-provisioning-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: check-task-provisioning-selftest

  ci-pre-push-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: ci-pre-push-replay
          install: ci

  misc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/ci-job
        with:
          id: misc
  # Spec 0251 R1-R4: the repository-wide scans. No path filter (a catch-all
  # `**` would make path-ownership vacuous), not changeset-gated, no test
  # suite: they run on every pull request and push to main and release/**.
  repository-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: repository-scan
          install: none

  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: frontmatter
          yq: "4.54.1"

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: markdown-links
          install: none
  # Spec 0147 delta-01 R21, R23: the exhaustive run lives in its own scheduled
  # workflow (changeset-coverage.yml). Its script's regression test stays on the
  # pull-request path here, with no path filter, like `ratchet`.
  changeset-coverage-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false
      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js

      - name: Test the exhaustive-run script (spec 0147 delta-01 R21)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/ci-changeset-coverage.test.ts
      - name: Test the exhaustive-run tool guard (spec 0147 delta-02 R31)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/ci-changeset-coverage-tools.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0147 delta-01 R11-R18: static path-ownership check. No path filter and
  # no base ref: every tracked file is owned or exempted, on every change.
  path-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: path-ownership
          install: ci

  path-ownership-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: path-ownership-selftest
          install: ci

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: lint-markdown
          install: ci
          node: 22

  # Spec 0238 R1-R3: shell / JavaScript / Python footprint ratchet. No path
  # filter: any change may add a shell file. Full history for the merge-base.
  ratchet:
    runs-on: ubuntu-latest
    env:
      # The list-growth and Python arms diff against the PR's target
      # branch. On a push the empty value hands the check back to its own
      # default derivation (first `crewrig|origin` remote + /main).
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-job
        with:
          id: ratchet
          install: none

  ratchet-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: ratchet-selftest
          install: none

  # Spec 0267 R12, R13, R16-R19: test-harness host-safety check. No path
  # filter: any scripts/** change can add a destructive call. Full history for
  # the allowlist growth arm. Needs `npm ci`: the check imports `typescript`.
  host-safety:
    runs-on: ubuntu-latest
    env:
      # The allowlist growth arm diffs against the PR's target branch. On
      # a push the empty value hands the check back to its own default
      # derivation (first `crewrig|origin` remote + /main).
      BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-job
        with:
          id: host-safety
          install: ci

  host-safety-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: host-safety-selftest
          install: ci

  # Spec 0238 R4-R8: TypeScript type-check, erasable syntax, Oxlint
  # type-aware strict typing and Oxfmt check mode. No path filter.
  lint-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: lint-typescript
          install: ci

  lint-typescript-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-job
        with:
          id: lint-typescript-selftest
          install: ci

  # Spec 0240 R4-R11, R13, R16: floor guard, production-dependency step and
  # shared scripts/lib/ TypeScript modules. No path filter, like `ratchet`.
  runtime-foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the runtime foundations
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/node-floor-guard.test.ts scripts/tests/paths.test.ts scripts/tests/line-endings.test.ts scripts/tests/tmp-file.test.ts scripts/tests/require-dependency.test.ts scripts/tests/check-timing-budget.test.ts scripts/tests/with-stub-daemon.test.ts scripts/tests/setup-dependency-step.test.ts scripts/tests/production-dependencies.test.ts

      - name: Test the history import and prune oracles (POSIX only)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/prune-transcripts-oracle.test.ts

      - name: Test the history import and prune TypeScript units
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/history-import.test.ts scripts/tests/prune-transcripts-ts.test.ts scripts/tests/prune-transcripts-ts-run.test.ts scripts/tests/history-import-python.test.ts scripts/tests/history-import-prune-python.test.ts

      - name: Test the MCP daemon lifecycle oracles (POSIX only)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/stop-mcp-server-oracle.test.ts scripts/tests/uninstall-mcp-daemon-oracle.test.ts scripts/tests/switch-mempalace-http-args-oracle.test.ts

      - name: Test the MemPalace helper modules (python detection, version pin)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/mempalace-python.test.ts scripts/tests/mempalace-python-shebang.test.ts scripts/tests/mempalace-pin.test.ts

      - name: Test the service module and the MCP launcher (Linux)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/service-backend.test.ts scripts/tests/service-bundle-closure.test.ts scripts/tests/service-launcher-installed-wrapper.test.ts scripts/tests/service-exec.test.ts scripts/tests/service-file-size.test.ts scripts/tests/service-install.test.ts scripts/tests/service-launchd-systemd.test.ts scripts/tests/service-launcher-child.test.ts scripts/tests/service-launcher-record.test.ts scripts/tests/service-launcher-token.test.ts scripts/tests/service-launcher-palace-path.test.ts scripts/tests/service-listener-pid.test.ts scripts/tests/service-names.test.ts scripts/tests/service-os-inspect.test.ts scripts/tests/service-owner-check.test.ts scripts/tests/service-probe.test.ts scripts/tests/service-process-tree.test.ts scripts/tests/service-program-install.test.ts scripts/tests/service-schtasks.test.ts scripts/tests/service-schtasks-uninstall.test.ts scripts/tests/service-snapshot-failure.test.ts scripts/tests/service-task-ownership.test.ts scripts/tests/service-task-snapshot.test.ts scripts/tests/service-task-state.test.ts scripts/tests/service-token-argv.test.ts scripts/tests/service-trust-wrapper.test.ts scripts/tests/service-unit-render.test.ts scripts/tests/service-windows-task-xml.test.ts scripts/tests/mcp-launcher-lifecycle.test.ts

      - name: Test the schedule service layer and the harness-curator differential (Linux)
