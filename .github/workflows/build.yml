  # Spec 0147 delta-01 R21, R23: the exhaustive run lives in its own scheduled
  # workflow (changeset-coverage.yml). Its script's regression test stays on the
  # pull-request path here, with no path filter, like `ratchet`.
  changeset-coverage-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the exhaustive-run script (spec 0147 delta-01 R21)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/ci-changeset-coverage.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0147 delta-01 R11-R18: static path-ownership check. No path filter and
  # no base ref: every tracked file is owned or exempted, on every change.
  path-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the path-ownership check
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/check-path-ownership.test.ts

      - name: Check path ownership
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-path-ownership.ts

      - name: Test the stray-scan guard and its wiring check
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/ci-cache-guard-scan.test.ts scripts/tests/check-stray-scan-wiring.test.ts

      - name: Check stray-scan wiring
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-stray-scan-wiring.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint Markdown files
        # extensions/**/commands/*.md are pivot command SOURCES whose body IS the
        # rendered command prompt, not prose — linting them as documents (e.g.
        # MD041 first-line-heading) would force a cosmetic heading that leaks
        # into the prompt. Exclude them; every other extension .md (skills,
        # agents, context, README) stays linted (spec 0042). artifacts/*/commands/*.md
        # are the same kind of pivot command source at the artifacts tier (spec
        # 0191) — same rationale, same exclusion.
        run: markdownlint "**/*.md" --ignore node_modules --ignore extension-skeleton --ignore communication --ignore 'extensions/**/commands/*.md' --ignore 'artifacts/*/commands/*.md'
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0238 R1-R3: shell / JavaScript / Python footprint ratchet. No path
  # filter: any change may add a shell file. Full history for the merge-base.
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test the ratchet
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/check-ratchet.test.ts

      - name: Run the ratchet
        env:
          # The list-growth and Python arms diff against the PR's target
          # branch. On a push the empty value hands the check back to its own
          # default derivation (first `crewrig|origin` remote + /main).
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-ratchet.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0238 R4-R8: TypeScript type-check, erasable syntax, Oxlint
  # type-aware strict typing and Oxfmt check mode. No path filter.
  lint-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install the TypeScript toolchain
        run: npm ci

      - name: Test the TypeScript checks
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/check-erasable-syntax.test.ts scripts/tests/lint-typescript.test.ts scripts/tests/check-typescript.test.ts

      - name: Check TypeScript sources
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-typescript.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0240 R4-R11, R13, R16: floor guard, production-dependency step and
  # shared scripts/lib/ TypeScript modules. No path filter, like `ratchet`.
  runtime-foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the runtime foundations
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/node-floor-guard.test.ts scripts/tests/paths.test.ts scripts/tests/line-endings.test.ts scripts/tests/tmp-file.test.ts scripts/tests/require-dependency.test.ts scripts/tests/check-timing-budget.test.ts scripts/tests/setup-dependency-step.test.ts scripts/tests/production-dependencies.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0240 R3: the floor guard's failure path on a real pre-24 Node.js.
  node-floor-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the guard and expect a rejection
        run: 'if node scripts/lib/node-floor-guard.js >guard.out 2>&1; then echo "guard accepted Node $(node -v)"; exit 1; fi'

      - name: Diagnostic names the detected version
        run: 'grep -F "$(node -v) detected" guard.out'

      - name: Diagnostic names the required floor
        run: 'grep -F "requires Node.js >= 24" guard.out'

      - name: Diagnostic names where to obtain Node.js
        run: 'grep -F "https://nodejs.org/en/download" guard.out'

      - name: No module-loading or syntax error instead
        run: 'if grep -E "SyntaxError|ERR_|Cannot find module" guard.out; then exit 1; fi'
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # TEMPLATE (spec 0240 R12-R15) — the reusable `windows-latest` job shape.
  # A later sub-spec copies this job, renames it, points the three steps at
  # its own migrated script and suites, states its own --budget-ms next to its
  # script, and records the copy in ci/ci-capabilities.yml as
  # `portability: specific` (engine github-actions: GitLab exposes no Windows
  # runner). Steps run under pwsh, a non-POSIX interpreter, on purpose.
  # Budget: 750 ms initial for node-floor-guard.js, to be recalibrated to
  # max(3 x observed max, 300 ms) rounded up to 50 ms after the first run.
  windows-node-floor-guard:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js

      - name: Test the portable shared modules
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/paths.test.ts scripts/tests/line-endings.test.ts scripts/tests/tmp-file.test.ts scripts/tests/node-floor-guard.test.ts

      # '--' is quoted so pwsh hands it to node verbatim rather than reading
      # it as its own end-of-parameters token.
      - name: Floor guard timing budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-timing-budget.ts --runs 10 --budget-ms 750 '--' scripts/lib/node-floor-guard.js
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  lint-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves (spec 0109)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Task
        run: sudo sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin

      # Runs before the corpus lint so a broken linter is diagnosed by its own
      # suite rather than reported only as a corpus failure. This job is where
      # the suite belongs: it provisions the npm-installed node_modules the
      # suite needs, which the hermetic check-components job does not.
      - name: Test spec linter regression
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-spec-linter.sh

      - name: Lint specs
        env:
          # The base-branch `status: draft` check (spec 0109 R2) compares against
          # the PR's *target* branch. On a push there is no PR context, so the
          # empty value hands the linter back to its own default derivation
          # (first `crewrig|origin` remote + /main).
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || '' }}
        # Read the log line, not the exit code, to tell an unresolvable-base
        # wiring fault from a lint finding: the linter distinguishes them (exit 2
        # vs 1), but Task collapses any non-zero status into its own 201, so only
        # the `[ERROR]` line survives this wrapper. Kept behind `task` on purpose
        # — `ci/ci-capabilities.yml` declares this command for both engines
        # (check-ci-parity.sh enforces the agreement, and .gitlab-ci.yml is
        # generated from it), and nothing here reads the exit code beyond
        # pass/fail, so bypassing the wrapper would cost symmetry and buy no
        # observable distinction.
        run: task spec:lint
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  test-harness-curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Smoke-test harness curator
        run: bash artifacts/library/skills/harness-curator/scripts/test.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-skill-versions:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves

      - name: Enforce version bump on changed skill/agent sources
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-skill-versions.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-extension-version-bump:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git show BASE:path` resolves the old carrier

      - name: Enforce carrier-version bump on changed extension sources (spec 0044)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
        run: bash scripts/check-extension-version-bump.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-spec-id-reserved:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the base ref resolves (spec 0112)

      # `command -v git` is true on ubuntu-latest, so this step is a no-op here.
      # It exists because the capability declares no `requires.tools`, and the
      # GitLab job generated from that declaration runs on debian:stable-slim,
      # which ships no git. Keeping the conditional install inside `command:`
      # is what lets one declaration serve both engines without touching
      # scripts/build-ci.sh or scripts/check-ci-parity.sh. No nested `sudo`:
      # normalize_cmd strips only a leading one, so a nested `sudo` would make
      # this step diverge from the declared command and fail parity Arm 1.
      - name: Ensure git is available
        run: command -v git >/dev/null || (apt-get update && apt-get install -y --no-install-recommends git ca-certificates)

      - name: Verify every spec id added by the change was secured (spec 0112)
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          # Workflow CONTEXTS, not ambient environment — they only reach the
          # process through this mapping. The guard compares the two to
          # discriminate pull-request origin (R10): a same-repository unsecured
          # id fails, a fork's is reported without blocking. It refuses to guess
          # when either is missing, because guessing "fork" would silently
          # disable the guard on every pull request. On GitLab CI the equivalent
          # pair (CI_MERGE_REQUEST_SOURCE_PROJECT_PATH / CI_PROJECT_PATH) is
          # already ambient, which is why the generated job needs no counterpart.
          # Named CREWRIG_* rather than GITHUB_*: GitHub reserves the GITHUB_
          # prefix, and there is no native head-repo variable to mirror anyway
          # (GITHUB_HEAD_REF is the branch, not the repository) — which is
          # precisely why this mapping has to exist.
          CREWRIG_PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CREWRIG_PR_BASE_REPO: ${{ github.repository }}
        run: bash scripts/check-spec-id-reserved.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-agents-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AGENTS.md file size
        run: bash scripts/check-agents-size.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-feedback-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Enforce upstream-tier feedback routing (spec 0030)
        run: bash scripts/check-feedback-routing.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  gitlab-ci-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify the generated GitLab pipeline matches the contract (spec 0048)
        run: bash scripts/build-ci.sh --check
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  check-ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify the reference, GitHub Actions, and GitLab pipelines agree (spec 0049)
        run: bash scripts/check-ci-parity.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
