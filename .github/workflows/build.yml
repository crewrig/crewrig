name: Build & Validate

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
    tags-ignore:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all extensions
        run: npm run build --workspaces --if-present
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  component-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            component-drift:
              - 'scripts/build-components.sh'
              - 'scripts/test-build-components.sh'
              - 'scripts/tests/test-model-resolution.sh'
              - 'scripts/tests/test-agent-profile-migration.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'docs/agent-profile-migration.md'
              - 'model-mappings/**'
              - '.agents/skills/**'
              - '.claude/skills/**'
              - '.gemini/skills/**'
              - '.github/skills/**'
              - '.gemini/commands/**'
              - 'crewrig.config.toml'
      - name: Install yq
        if: steps.filter.outputs.component-drift == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.component-drift == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/build-components.sh', 'scripts/test-build-components.sh', 'scripts/tests/test-model-resolution.sh', 'scripts/tests/test-agent-profile-migration.sh', 'scripts/lib/**', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt', 'docs/agent-profile-migration.md', 'model-mappings/**', '.agents/skills/**', '.claude/skills/**', '.gemini/skills/**', '.github/skills/**', '.gemini/commands/**', 'crewrig.config.toml') }}
      - name: Build Components
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,.agents/skills/**,.claude/skills/**,.gemini/skills/**,.github/skills/**,.gemini/commands/**,crewrig.config.toml" --key-env "" -- bash scripts/build-components.sh --target all --check
      - name: Test Build Components
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,.agents/skills/**,.claude/skills/**,.gemini/skills/**,.github/skills/**,.gemini/commands/**,crewrig.config.toml" --key-env "" -- bash scripts/test-build-components.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  model-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            model-resolution:
              - 'scripts/build-components.sh'
              - 'scripts/test-build-components.sh'
              - 'scripts/tests/test-model-resolution.sh'
              - 'scripts/tests/test-agent-profile-migration.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'docs/agent-profile-migration.md'
              - 'model-mappings/**'
      - name: Install yq
        if: steps.filter.outputs.model-resolution == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.model-resolution == 'true'
        with:
          path: .ci-cache
          key: model-resolution-${{ hashFiles('scripts/build-components.sh', 'scripts/test-build-components.sh', 'scripts/tests/test-model-resolution.sh', 'scripts/tests/test-agent-profile-migration.sh', 'scripts/lib/**', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt', 'docs/agent-profile-migration.md', 'model-mappings/**', 'scripts/ci-cache-guard.sh') }}
      - name: Test Model Resolution
        if: steps.filter.outputs.model-resolution == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,scripts/ci-cache-guard.sh" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-model-resolution.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  agent-profile-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            agent-profile-migration:
              - 'scripts/build-components.sh'
              - 'scripts/test-build-components.sh'
              - 'scripts/tests/test-model-resolution.sh'
              - 'scripts/tests/test-agent-profile-migration.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'docs/agent-profile-migration.md'
              - 'model-mappings/**'
      - name: Install yq
        if: steps.filter.outputs.agent-profile-migration == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.agent-profile-migration == 'true'
        with:
          path: .ci-cache
          key: agent-profile-migration-${{ hashFiles('scripts/build-components.sh', 'scripts/test-build-components.sh', 'scripts/tests/test-model-resolution.sh', 'scripts/tests/test-agent-profile-migration.sh', 'scripts/lib/**', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt', 'docs/agent-profile-migration.md', 'model-mappings/**', 'scripts/ci-cache-guard.sh') }}
      - name: Test Agent Profile Migration
        if: steps.filter.outputs.agent-profile-migration == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/test-build-components.sh,scripts/tests/test-model-resolution.sh,scripts/tests/test-agent-profile-migration.sh,scripts/lib/**,artifacts/**,extensions/**,.crewrig/core-paths.txt,docs/agent-profile-migration.md,model-mappings/**,scripts/ci-cache-guard.sh" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-agent-profile-migration.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  extension-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-render:
              - 'scripts/check-extension-pivot.sh'
              - 'scripts/build-extension.sh'
              - 'scripts/install-extension.sh'
              - 'scripts/lib/extension-manifest.sh'
              - 'scripts/lib/extension-percli-keys.json'
              - 'scripts/lib/extension-generated-class.json'
              - 'scripts/tests/test-check-extension-pivot.sh'
              - 'scripts/tests/test-build-extension.sh'
              - 'scripts/tests/test-extension-render-conformance.sh'
              - 'Taskfile.yml'
              - 'extensions/**'
              - 'artifacts/**'
              - 'scripts/lib/extension-hooks.sh'
              - 'scripts/lib/extension-targets.json'
              - 'scripts/check-extension-hook-tokens.sh'
              - 'scripts/check-extension-hook-map.sh'
              - 'docs/extension-hook-events.md'
              - 'extension-skeleton/**'
              - 'scripts/create-extension.sh'
              - 'scripts/build-claude-plugin.sh'
              - 'scripts/build-copilot-plugin.sh'
              - 'scripts/build-antigravity-extension.sh'
              - 'scripts/tests/test-check-extension-hook-tokens.sh'
              - 'scripts/tests/test-check-extension-hook-map.sh'
              - 'scripts/lib/common.sh'
              - 'scripts/probe-extension-mcp-token.sh'
              - 'scripts/tests/test-extension-mcp-manifest.sh'
              - 'scripts/install-antigravity-extension.sh'
              - 'scripts/lib/render-context.sh'
              - 'scripts/lib/extension-legacy-shape.json'
              - 'scripts/migrate-extension.sh'
              - 'scripts/tests/test-migrate-extension.sh'
              - 'scripts/release-package-extension.sh'
              - 'scripts/lib/extension-install.sh'
              - 'scripts/tests/test-release-package-extension.sh'
              - 'scripts/tests/test-create-extension-combinations.sh'
      - name: Install yq
        if: steps.filter.outputs.extension-render == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Pivot
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/check-extension-pivot.sh
      - name: Test Check Extension Pivot
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-pivot.sh
      - name: Test Build Extension
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-build-extension.sh
      - name: Test Extension Render Conformance
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-extension-render-conformance.sh
      - name: Test Extension MCP Manifest
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-extension-mcp-manifest.sh
      - name: Build Extension --check
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/build-extension.sh --check
      - name: Check Extension Hook Tokens
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/check-extension-hook-tokens.sh
      - name: Test Check Extension Hook Tokens
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-hook-tokens.sh
      - name: Check Extension Hook Map
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/check-extension-hook-map.sh
      - name: Test Check Extension Hook Map
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-hook-map.sh
      - name: Test Migrate Extension
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-migrate-extension.sh
      - name: Test Release Package Extension
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-release-package-extension.sh
      - name: Test Create Extension Combinations
        if: steps.filter.outputs.extension-render == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-create-extension-combinations.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  extension-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-provenance:
              - 'scripts/check-extension-provenance.sh'
              - 'scripts/tests/test-check-extension-provenance.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-provenance == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Provenance
        if: steps.filter.outputs.extension-provenance == 'true'
        run: bash scripts/check-extension-provenance.sh
      - name: Test Check Extension Provenance
        if: steps.filter.outputs.extension-provenance == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-provenance.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  extension-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-manifest:
              - 'scripts/check-extension-manifest-version.sh'
              - 'scripts/check-extension-version-bump.sh'
              - 'scripts/lib/base-ref-resolve.sh'
              - 'scripts/tests/test-check-extension-manifest-version.sh'
              - 'scripts/tests/test-check-extension-version-bump.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-manifest == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Manifest Version
        if: steps.filter.outputs.extension-manifest == 'true'
        run: bash scripts/check-extension-manifest-version.sh
      - name: Test Check Extension Manifest Version
        if: steps.filter.outputs.extension-manifest == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-manifest-version.sh
      - name: Test Check Extension Version Bump
        if: steps.filter.outputs.extension-manifest == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-extension-version-bump.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  extension-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-install:
              - 'scripts/tests/test-install-claude-plugin-marketplace.sh'
              - 'scripts/tests/test-build-claude-plugin-agents-glob.sh'
              - 'scripts/tests/test-gemini-agent-frontmatter.sh'
              - 'scripts/tests/test-install-extension-all.sh'
              - 'scripts/build-claude-plugin.sh'
              - 'scripts/build-gemini-agent.sh'
              - 'scripts/install-extension-all.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-install == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Test Install Claude Plugin Marketplace
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-install-claude-plugin-marketplace.sh
      - name: Test Build Claude Plugin Agents Glob
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-build-claude-plugin-agents-glob.sh
      - name: Test Gemini Agent Frontmatter
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-gemini-agent-frontmatter.sh
      - name: Test Install Extension All
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-install-extension-all.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  core-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-paths:
              - 'scripts/check-core-paths.sh'
              - 'scripts/sync-from-upstream.sh'
              - 'scripts/tests/test-check-core-paths.sh'
              - 'scripts/tests/test-sync-from-upstream.sh'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
              - 'model-mappings/**'
      - name: Install yq
        if: steps.filter.outputs.core-paths == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Core Paths
        if: steps.filter.outputs.core-paths == 'true'
        run: bash scripts/check-core-paths.sh
      - name: Test Check Core Paths
        if: steps.filter.outputs.core-paths == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-core-paths.sh
      - name: Test Sync From Upstream
        if: steps.filter.outputs.core-paths == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-sync-from-upstream.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci-parity:
              - 'scripts/check-ci-parity.sh'
              - 'scripts/build-ci.sh'
              - 'scripts/ci-cache-guard.sh'
              - 'scripts/ci-changeset-coverage.sh'
              - 'scripts/tests/test-check-ci-parity.sh'
              - 'scripts/tests/test-build-ci.sh'
              - 'ci/ci-capabilities.yml'
              - '.gitlab-ci.yml'
              - '.github/workflows/build.yml'
              - 'docs/ci-reference-format.md'
      - name: Install yq
        if: steps.filter.outputs.ci-parity == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.ci-parity == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/check-ci-parity.sh', 'scripts/build-ci.sh', 'scripts/ci-cache-guard.sh', 'scripts/ci-changeset-coverage.sh', 'scripts/tests/test-check-ci-parity.sh', 'scripts/tests/test-build-ci.sh', 'ci/ci-capabilities.yml', '.gitlab-ci.yml', '.github/workflows/build.yml', 'docs/ci-reference-format.md') }}
      - name: Test Check Ci Parity
        if: steps.filter.outputs.ci-parity == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/check-ci-parity.sh,scripts/build-ci.sh,scripts/ci-cache-guard.sh,scripts/ci-changeset-coverage.sh,scripts/tests/test-check-ci-parity.sh,scripts/tests/test-build-ci.sh,ci/ci-capabilities.yml,.gitlab-ci.yml,.github/workflows/build.yml,docs/ci-reference-format.md" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-ci-parity.sh
      - name: Test Build Ci
        if: steps.filter.outputs.ci-parity == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/check-ci-parity.sh,scripts/build-ci.sh,scripts/ci-cache-guard.sh,scripts/ci-changeset-coverage.sh,scripts/tests/test-check-ci-parity.sh,scripts/tests/test-build-ci.sh,ci/ci-capabilities.yml,.gitlab-ci.yml,.github/workflows/build.yml,docs/ci-reference-format.md" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-build-ci.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  docs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs-index:
              - 'scripts/build-docs-index.sh'
              - 'scripts/tests/test-build-docs-index.sh'
              - 'docs/**'
      - uses: actions/cache@v4
        if: steps.filter.outputs.docs-index == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/build-docs-index.sh', 'scripts/tests/test-build-docs-index.sh', 'docs/**', 'scripts/ci-cache-guard.sh') }}
      - name: Build Docs Index
        if: steps.filter.outputs.docs-index == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-docs-index.sh,scripts/tests/test-build-docs-index.sh,docs/**,scripts/ci-cache-guard.sh" --key-env "" -- bash scripts/build-docs-index.sh --check
      - name: Test Build Docs Index
        if: steps.filter.outputs.docs-index == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-docs-index.sh,scripts/tests/test-build-docs-index.sh,docs/**,scripts/ci-cache-guard.sh" --key-env "" -- bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-build-docs-index.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  figure-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            figure-labels:
              - 'scripts/check-figure-labels.sh'
              - 'scripts/lib/check-figure-labels.py'
              - 'scripts/tests/test-check-figure-labels.sh'
              - 'docs/assets/**/*.png'
              - 'docs/assets/**/*.prompt.md'
      - name: Install tesseract
        if: steps.filter.outputs.figure-labels == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Install python3
        if: steps.filter.outputs.figure-labels == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3
      - name: Check Figure Labels
        if: steps.filter.outputs.figure-labels == 'true'
        run: bash scripts/check-figure-labels.sh
      - name: Test Check Figure Labels
        if: steps.filter.outputs.figure-labels == 'true'
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-check-figure-labels.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
  mempalace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
