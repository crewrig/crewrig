name: Build & Validate

on:
  pull_request:
    branches: [main, "release/**"]
  push:
    branches: [main, "release/**"]
    tags-ignore:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build all extensions
        run: npm run build --workspaces --if-present

  component-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            component-drift:
              - 'scripts/build-components.sh'
              - 'scripts/test-build-components.sh'
              - 'scripts/lib/**'
              - 'artifacts/**'
              - 'extensions/**'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
      - name: Install yq
        if: steps.filter.outputs.component-drift == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.component-drift == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/build-components.sh', 'scripts/test-build-components.sh', 'scripts/lib/common.sh', 'artifacts/**', 'extensions/**', '.crewrig/core-paths.txt') }}
      - name: Build Components
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/test-build-components.sh,scripts/lib/common.sh,artifacts/**,extensions/**,.crewrig/core-paths.txt" --key-env "" -- bash scripts/build-components.sh --target all --check
      - name: Test Build Components
        if: steps.filter.outputs.component-drift == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-components.sh,scripts/test-build-components.sh,scripts/lib/common.sh,artifacts/**,extensions/**,.crewrig/core-paths.txt" --key-env "" -- bash scripts/test-build-components.sh
  extension-pivot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-pivot:
              - 'scripts/check-extension-pivot.sh'
              - 'scripts/build-extension-pivot.sh'
              - 'scripts/tests/test-check-extension-pivot.sh'
              - 'scripts/tests/test-build-extension-pivot.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-pivot == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Pivot
        if: steps.filter.outputs.extension-pivot == 'true'
        run: bash scripts/check-extension-pivot.sh
      - name: Test Check Extension Pivot
        if: steps.filter.outputs.extension-pivot == 'true'
        run: bash scripts/tests/test-check-extension-pivot.sh
      - name: Test Build Extension Pivot
        if: steps.filter.outputs.extension-pivot == 'true'
        run: bash scripts/tests/test-build-extension-pivot.sh
      - name: Build Extension Pivot
        if: steps.filter.outputs.extension-pivot == 'true'
        run: bash scripts/build-extension-pivot.sh --check
  extension-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-provenance:
              - 'scripts/check-extension-provenance.sh'
              - 'scripts/tests/test-check-extension-provenance.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-provenance == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Provenance
        if: steps.filter.outputs.extension-provenance == 'true'
        run: bash scripts/check-extension-provenance.sh
      - name: Test Check Extension Provenance
        if: steps.filter.outputs.extension-provenance == 'true'
        run: bash scripts/tests/test-check-extension-provenance.sh
  extension-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-manifest:
              - 'scripts/check-extension-manifest-version.sh'
              - 'scripts/tests/test-check-extension-manifest-version.sh'
              - 'scripts/tests/test-check-extension-version-bump.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-manifest == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Extension Manifest Version
        if: steps.filter.outputs.extension-manifest == 'true'
        run: bash scripts/check-extension-manifest-version.sh
      - name: Test Check Extension Manifest Version
        if: steps.filter.outputs.extension-manifest == 'true'
        run: bash scripts/tests/test-check-extension-manifest-version.sh
      - name: Test Check Extension Version Bump
        if: steps.filter.outputs.extension-manifest == 'true'
        run: bash scripts/tests/test-check-extension-version-bump.sh
  extension-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            extension-install:
              - 'scripts/tests/test-install-claude-plugin-marketplace.sh'
              - 'scripts/tests/test-build-claude-plugin-agents-glob.sh'
              - 'scripts/tests/test-gemini-agent-frontmatter.sh'
              - 'scripts/build-claude-plugin.sh'
              - 'scripts/build-gemini-agent.sh'
              - 'extensions/**'
              - 'artifacts/**'
      - name: Install yq
        if: steps.filter.outputs.extension-install == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Test Install Claude Plugin Marketplace
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/tests/test-install-claude-plugin-marketplace.sh
      - name: Test Build Claude Plugin Agents Glob
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/tests/test-build-claude-plugin-agents-glob.sh
      - name: Test Gemini Agent Frontmatter
        if: steps.filter.outputs.extension-install == 'true'
        run: bash scripts/tests/test-gemini-agent-frontmatter.sh
  core-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core-paths:
              - 'scripts/check-core-paths.sh'
              - 'scripts/tests/test-check-core-paths.sh'
              - 'scripts/tests/test-sync-from-upstream.sh'
              - '.crewrig/core-paths.txt'
              - 'docs/layers.md'
      - name: Install yq
        if: steps.filter.outputs.core-paths == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Check Core Paths
        if: steps.filter.outputs.core-paths == 'true'
        run: bash scripts/check-core-paths.sh
      - name: Test Check Core Paths
        if: steps.filter.outputs.core-paths == 'true'
        run: bash scripts/tests/test-check-core-paths.sh
      - name: Test Sync From Upstream
        if: steps.filter.outputs.core-paths == 'true'
        run: bash scripts/tests/test-sync-from-upstream.sh
  ci-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci-parity:
              - 'scripts/check-ci-parity.sh'
              - 'scripts/build-ci.sh'
              - 'scripts/tests/test-check-ci-parity.sh'
              - 'scripts/tests/test-build-ci.sh'
              - 'ci/ci-capabilities.yml'
              - '.gitlab-ci.yml'
              - '.github/workflows/build.yml'
              - 'docs/ci-reference-format.md'
      - name: Install yq
        if: steps.filter.outputs.ci-parity == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/cache@v4
        if: steps.filter.outputs.ci-parity == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/check-ci-parity.sh', 'scripts/build-ci.sh', 'scripts/tests/test-check-ci-parity.sh', 'scripts/tests/test-build-ci.sh', 'ci/ci-capabilities.yml', '.gitlab-ci.yml', '.github/workflows/build.yml', 'docs/ci-reference-format.md') }}
      - name: Test Check Ci Parity
        if: steps.filter.outputs.ci-parity == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/check-ci-parity.sh,scripts/build-ci.sh,scripts/tests/test-check-ci-parity.sh,scripts/tests/test-build-ci.sh,ci/ci-capabilities.yml,.gitlab-ci.yml,.github/workflows/build.yml,docs/ci-reference-format.md" --key-env "" -- bash scripts/tests/test-check-ci-parity.sh
      - name: Test Build Ci
        if: steps.filter.outputs.ci-parity == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/check-ci-parity.sh,scripts/build-ci.sh,scripts/tests/test-check-ci-parity.sh,scripts/tests/test-build-ci.sh,ci/ci-capabilities.yml,.gitlab-ci.yml,.github/workflows/build.yml,docs/ci-reference-format.md" --key-env "" -- bash scripts/tests/test-build-ci.sh
  docs-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            docs-index:
              - 'scripts/build-docs-index.sh'
              - 'scripts/tests/test-build-docs-index.sh'
              - 'docs/**'
      - uses: actions/cache@v4
        if: steps.filter.outputs.docs-index == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/build-docs-index.sh', 'scripts/tests/test-build-docs-index.sh', 'docs/**') }}
      - name: Build Docs Index
        if: steps.filter.outputs.docs-index == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-docs-index.sh,scripts/tests/test-build-docs-index.sh,docs/**" --key-env "" -- bash scripts/build-docs-index.sh --check
      - name: Test Build Docs Index
        if: steps.filter.outputs.docs-index == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/build-docs-index.sh,scripts/tests/test-build-docs-index.sh,docs/**" --key-env "" -- bash scripts/tests/test-build-docs-index.sh
  mempalace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mempalace:
              - 'scripts/tests/test-mempalace-*.sh'
              - 'scripts/tests/test-system-context-store.sh'
              - 'scripts/tests/test-setup-antigravity-transcript.sh'
              - 'scripts/tests/test-setup-copilot-transcript.sh'
              - 'scripts/tests/test-antigravity-component-install.sh'
              - 'scripts/tests/test-antigravity-discovery-probe.sh'
              - 'scripts/lib/**'
              - 'artifacts/library/skills/mempalace/**'
              - 'artifacts/library/skills/harness-report/**'
      - name: Install yq
        if: steps.filter.outputs.mempalace == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/setup-python@v5
        if: steps.filter.outputs.mempalace == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.filter.outputs.mempalace == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/tests/test-mempalace-*.sh', 'scripts/tests/test-system-context-store.sh', 'scripts/tests/test-setup-antigravity-transcript.sh', 'scripts/tests/test-setup-copilot-transcript.sh', 'scripts/tests/test-antigravity-component-install.sh', 'scripts/tests/test-antigravity-discovery-probe.sh', 'scripts/lib/**', 'artifacts/library/skills/mempalace/**', 'artifacts/library/skills/harness-report/**') }}
      - name: Test Mempalace Transcript Hook
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-mempalace-transcript-hook.sh
      - name: Test Setup Antigravity Transcript
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-setup-antigravity-transcript.sh
      - name: Test Setup Copilot Transcript
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-setup-copilot-transcript.sh
      - name: Test Antigravity Component Install
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-antigravity-component-install.sh
      - name: Test Antigravity Discovery Probe
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-antigravity-discovery-probe.sh
      - name: Test Mempalace Version Range
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-mempalace-version-range.sh
      - name: Python3  M Pip Install   Quiet Packaging
        if: steps.filter.outputs.mempalace == 'true'
        run: python3 -m pip install --quiet packaging
      - name: Test Mempalace Pin
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-mempalace-pin.sh
      - name: Test Mempalace Runtime Guard
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-mempalace-runtime-guard.sh
      - name: Test Mempalace Doctor
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-mempalace-doctor.sh
      - name: Test System Context Store
        if: steps.filter.outputs.mempalace == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-mempalace-*.sh,scripts/tests/test-system-context-store.sh,scripts/tests/test-setup-antigravity-transcript.sh,scripts/tests/test-setup-copilot-transcript.sh,scripts/tests/test-antigravity-component-install.sh,scripts/tests/test-antigravity-discovery-probe.sh,scripts/lib/**,artifacts/library/skills/mempalace/**,artifacts/library/skills/harness-report/**" --key-env "" -- bash scripts/tests/test-system-context-store.sh
  test-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            test-wiring:
              - 'scripts/check-test-wiring.sh'
              - 'scripts/tests/test-check-test-wiring.sh'
              - 'scripts/check-test-strays.sh'
              - 'scripts/tests/test-check-test-strays.sh'
              - 'scripts/tests/**'
      - name: Check Test Wiring
        if: steps.filter.outputs.test-wiring == 'true'
        run: bash scripts/check-test-wiring.sh
      - name: Test Check Test Wiring
        if: steps.filter.outputs.test-wiring == 'true'
        run: bash scripts/tests/test-check-test-wiring.sh
      - name: Check Test Strays
        if: steps.filter.outputs.test-wiring == 'true'
        run: bash scripts/check-test-strays.sh
      - name: Test Check Test Strays
        if: steps.filter.outputs.test-wiring == 'true'
        run: bash scripts/tests/test-check-test-strays.sh
  chroma-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            chroma-mcp:
              - 'scripts/tests/test-chroma-*.sh'
              - 'scripts/tests/test-mcp-daemon.sh'
              - 'scripts/tests/test-worktree-claim.sh'
              - 'scripts/mcp-daemon.sh'
              - 'scripts/lib/**'
      - name: Install yq
        if: steps.filter.outputs.chroma-mcp == 'true'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - uses: actions/setup-python@v5
        if: steps.filter.outputs.chroma-mcp == 'true'
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        if: steps.filter.outputs.chroma-mcp == 'true'
        with:
          path: .ci-cache
          key: ${{ hashFiles('scripts/tests/test-chroma-*.sh', 'scripts/tests/test-mcp-daemon.sh', 'scripts/tests/test-worktree-claim.sh', 'scripts/mcp-daemon.sh', 'scripts/lib/**') }}
      - name: Test Chroma Fd Limits
        if: steps.filter.outputs.chroma-mcp == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-chroma-*.sh,scripts/tests/test-mcp-daemon.sh,scripts/tests/test-worktree-claim.sh,scripts/mcp-daemon.sh,scripts/lib/**" --key-env "" -- bash scripts/tests/test-chroma-fd-limits.sh
      - name: Test Chroma Health Race
        if: steps.filter.outputs.chroma-mcp == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-chroma-*.sh,scripts/tests/test-mcp-daemon.sh,scripts/tests/test-worktree-claim.sh,scripts/mcp-daemon.sh,scripts/lib/**" --key-env "" -- bash scripts/tests/test-chroma-health-race.sh
      - name: Test Chroma Server
        if: steps.filter.outputs.chroma-mcp == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-chroma-*.sh,scripts/tests/test-mcp-daemon.sh,scripts/tests/test-worktree-claim.sh,scripts/mcp-daemon.sh,scripts/lib/**" --key-env "" -- bash scripts/tests/test-chroma-server.sh
      - name: Test Mcp Daemon
        if: steps.filter.outputs.chroma-mcp == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-chroma-*.sh,scripts/tests/test-mcp-daemon.sh,scripts/tests/test-worktree-claim.sh,scripts/mcp-daemon.sh,scripts/lib/**" --key-env "" -- bash scripts/tests/test-mcp-daemon.sh
      - name: Test Worktree Claim
        if: steps.filter.outputs.chroma-mcp == 'true'
        run: bash scripts/ci-cache-guard.sh --cache-dir .ci-cache --key-files "scripts/tests/test-chroma-*.sh,scripts/tests/test-mcp-daemon.sh,scripts/tests/test-worktree-claim.sh,scripts/mcp-daemon.sh,scripts/lib/**" --key-env "" -- bash scripts/tests/test-worktree-claim.sh
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            e2e:
              - 'scripts/tests/test-e2e-*.sh'
              - 'tests/e2e/**'
      - name: Install yq
