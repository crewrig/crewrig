name: Build & Validate

on:

  pull_request:
    # Spec 0168 delta-01 R11: the draft/ready transitions must re-run the
    # workflow so R1 is enforced in full after a spec-PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main, "release/**"]

  push:
    branches: [main, "release/**"]
    tags-ignore:
      - "**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  gate:
    uses: ./.github/workflows/_ci-gate.yml

  modules:
    needs: [gate]
    uses: ./.github/workflows/_ci-modules.yml

  governance:
    needs: [gate]
    uses: ./.github/workflows/_ci-governance.yml

  extensions:
    needs: [gate]
    uses: ./.github/workflows/_ci-extensions.yml

  integration:
    needs: [gate]
    uses: ./.github/workflows/_ci-integration.yml

  windows:
    uses: ./.github/workflows/_ci-windows.yml
