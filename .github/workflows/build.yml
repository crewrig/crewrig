              - 'scripts/lib/node-floor-guard.js'
              - 'scripts/hook-wiring.ts'
              - 'scripts/tests/worktree-*.test.ts'
              - 'scripts/tests/lib/worktree-*.ts'
              - 'scripts/tests/lib/spawn-spy.ts'
              - 'scripts/tests/lib/windows-invocation.ts'
              - 'scripts/tests/fixtures/worktree-claim/**'
              - 'scripts/tests/fixtures/worktree-guard/**'
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.worktree-guard == 'true'
        with:
          node-version: 24

      - name: Validate the worktree git guard and worktree claim tool
        if: steps.filter.outputs.worktree-guard == 'true'
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-*.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure

  # Spec 0248 R10: the guard and claim entries print nothing on the oldest
  # Node.js 24 release, where type stripping still emits an ExperimentalWarning.
  worktree-guard-node-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0

      - name: Entry form and unstubbed silence runs on Node.js 24.0.0
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/worktree-entry-form.test.ts
      - name: Cancel workflow on job failure
        if: failure()
