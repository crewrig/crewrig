name: Spec View Check

# Spec 0273: mirrors the `spec-view`
# capability of ci/ci-capabilities.yml.
on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/spec-view.ts"
      - "scripts/lib/spec-view.ts"
      - "scripts/lib/ts-scope.ts"
      - "scripts/tests/spec-view.test.ts"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "scripts/lib/taskfile-tree.ts"
      - "scripts/lib/taskfile-tree-parse.ts"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/spec-view.ts"
      - "scripts/lib/spec-view.ts"
      - "scripts/lib/ts-scope.ts"
      - "scripts/tests/spec-view.test.ts"
      - "Taskfile.yml"
      - "taskfiles/**"
      - "scripts/lib/taskfile-tree.ts"
      - "scripts/lib/taskfile-tree-parse.ts"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  spec-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false

      - name: Test the spec effective view
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/spec-view.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
