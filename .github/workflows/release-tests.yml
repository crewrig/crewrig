name: Release Driver Tests

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.sh"
      - "scripts/monorepo-release.ts"
      - "scripts/release-sync-manifests.ts"
      - "scripts/release-package-extension.ts"
      - "scripts/lib/monorepo-release/**"
      - "scripts/lib/packaging/**"
      - "scripts/lib/release-rehearse.mjs"
      - "scripts/lib/release-pr.ts"
      - "scripts/release-pr.ts"
      - "scripts/tests/release-pr.test.ts"
      - ".github/workflows/release-monorepo.yml"
      - "scripts/lib/release-notes/**"
      - "scripts/tests/test-monorepo-release*.sh"
      - "scripts/tests/release-changelog.test.ts"
      - "scripts/tests/release-driver-sandbox.test.ts"
      - "scripts/tests/monorepo-release-blackbox-*.test.ts"
      - "scripts/tests/lib/release-*.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/tests/fixtures/release-blackbox/**"
      - ".markdownlintrc"
      - "scripts/tests/fixtures/release/**"
      - "scripts/release-package-extension.sh"
      - "scripts/build-extension.sh"
      - "scripts/build-extension.ts"
      - "scripts/lib/extension/**"
      - "scripts/lib/org-mcp.ts"
      - "scripts/lib/node-floor-guard.js"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.sh"
      - "scripts/monorepo-release.ts"
      - "scripts/release-sync-manifests.ts"
      - "scripts/release-package-extension.ts"
      - "scripts/lib/monorepo-release/**"
      - "scripts/lib/packaging/**"
      - "scripts/lib/release-rehearse.mjs"
      - "scripts/lib/release-pr.ts"
      - "scripts/release-pr.ts"
      - "scripts/tests/release-pr.test.ts"
      - ".github/workflows/release-monorepo.yml"
      - "scripts/lib/release-notes/**"
      - "scripts/tests/test-monorepo-release*.sh"
      - "scripts/tests/release-changelog.test.ts"
      - "scripts/tests/release-driver-sandbox.test.ts"
      - "scripts/tests/monorepo-release-blackbox-*.test.ts"
      - "scripts/tests/lib/release-*.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/tests/fixtures/release-blackbox/**"
      - ".markdownlintrc"
      - "scripts/tests/fixtures/release/**"
      - "scripts/release-package-extension.sh"
      - "scripts/build-extension.sh"
      - "scripts/build-extension.ts"
      - "scripts/lib/extension/**"
      - "scripts/lib/org-mcp.ts"
      - "scripts/lib/node-floor-guard.js"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq

      - name: Install dependencies
        run: npm install --include=dev

      - name: Test the release driver (hermetic)
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-monorepo-release.sh

      - name: Test the release driver (real engine, local forge stub)
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-monorepo-release-engine.sh

      - name: Test the lint-safe changelog facade (issue #1364)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-changelog.test.ts

      - name: Test the GitHub release-PR sync (issue #1379)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-pr.test.ts

      - name: Test the release driver black-box sandbox (spec 0257)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/release-driver-sandbox.test.ts

      - name: Test the release driver black box, preflight (spec 0257)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-preflight.test.ts

      - name: Test the release driver black box, configuration (spec 0257)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-config.test.ts

      - name: Test the release driver black box, flows (spec 0257)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-flows.test.ts

      - name: Test the release driver black box, flows part 2 (spec 0257)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-blackbox-flows2.test.ts

      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
