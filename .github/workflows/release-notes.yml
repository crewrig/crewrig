name: Release Notes Render Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.sh"
      - "scripts/monorepo-release.ts"
      - "scripts/release-sync-manifests.ts"
      - "scripts/release-package-extension.ts"
      - "scripts/lib/monorepo-release/**"
      - "scripts/lib/packaging/**"
      - "scripts/lib/release-notes/**"
      - "scripts/tests/monorepo-release-notes-real-engine.test.ts"
      - "scripts/tests/lib/release-*.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/lib/release-rehearse.mjs"
      - "scripts/lib/release-pr.ts"
      - "scripts/release-pr.ts"
      - "scripts/tests/fixtures/release/forge-stub.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.sh"
      - "scripts/monorepo-release.ts"
      - "scripts/release-sync-manifests.ts"
      - "scripts/release-package-extension.ts"
      - "scripts/lib/monorepo-release/**"
      - "scripts/lib/packaging/**"
      - "scripts/lib/release-notes/**"
      - "scripts/tests/monorepo-release-notes-real-engine.test.ts"
      - "scripts/tests/lib/release-*.ts"
      - "scripts/tests/lib/build-fixture-tree.ts"
      - "scripts/lib/release-rehearse.mjs"
      - "scripts/lib/release-pr.ts"
      - "scripts/release-pr.ts"
      - "scripts/tests/fixtures/release/forge-stub.mjs"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render extension release notes through the monorepo release config
        run: bash scripts/ci-cache-guard.sh --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/monorepo-release-notes-real-engine.test.ts
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
