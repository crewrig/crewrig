name: Release Notes Render Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.sh"
      - "scripts/lib/release-notes/**"
      - "scripts/lib/monorepo-release-lib.sh"
      - "scripts/tests/test-monorepo-release-notes.sh"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/monorepo-release.sh"
      - "scripts/lib/release-notes/**"
      - "scripts/lib/monorepo-release-lib.sh"
      - "scripts/tests/test-monorepo-release-notes.sh"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render extension release notes through the monorepo release config
        run: bash scripts/tests/test-monorepo-release-notes.sh
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
