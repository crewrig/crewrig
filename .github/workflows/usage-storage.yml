name: Usage Storage Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-store/**"
      - "scripts/lib/usage-inventory/**"
      - "scripts/usage-query.ts"
      - "scripts/usage-prune.ts"
      - "scripts/usage-mirror.ts"
      - "scripts/usage-inventory.ts"
      - "scripts/usage-drain.ts"
      - "scripts/usage-task.ts"
      - "scripts/usage-attribute.ts"
      - "scripts/usage-backfill.ts"
      - "scripts/build-usage-validator.js"
      - "scripts/tests/usage-mirror-catchup.test.ts"
      - "scripts/tests/usage-mirror-prune.test.ts"
      - "scripts/tests/usage-mirror-failures.test.ts"
      - "scripts/tests/usage-mirror-mutants.test.ts"
      - "scripts/tests/lib/usage-mirror-rig.ts"
      - "scripts/tests/lib/usage-mirror-records.ts"
      - "scripts/tests/lib/usage-mirror-backlog.ts"
      - "scripts/tests/usage-storage-journal.test.ts"
      - "scripts/tests/usage-storage-query.test.ts"
      - "scripts/tests/usage-storage-gate.test.ts"
      - "scripts/tests/usage-mirror-spawn.test.ts"
      - "scripts/tests/usage-storage-wing.test.ts"
      - "scripts/tests/usage-storage-drain.test.ts"
      - "scripts/tests/usage-storage-prune.test.ts"
      - "scripts/tests/lib/usage-storage-rig.ts"
      - "scripts/tests/lib/usage-storage-driver.ts"
      - "scripts/tests/lib/usage-mutants.ts"
      - "scripts/tests/lib/mutation-copy.ts"
      - "scripts/tests/lib/capability.ts"
      - "scripts/tests/usage-inventory.test.ts"
      - "scripts/lib/usage-wrapper.ts"
      - "scripts/tests/usage-wrappers-oracle.test.ts"
      - "scripts/tests/usage-wrappers.test.ts"
      - "scripts/tests/hermetic-env.test.ts"
      - "scripts/tests/lib/hermetic-env.ts"
      - "scripts/tests/fixtures/usage-storage/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "docs/usage-storage.md"
      - "docs/usage-organization.md"
  push:
    branches: [main, "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  usage-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node@24 (bumped from node@22): scripts/usage-inventory.ts and its
          # test now run directly from .ts source via Node's built-in type
          # stripping (spec 0238), which requires Node >= 24 — see
          # DEVELOPMENT.md, "TypeScript toolchain and ratchet".
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate the usage-record storage contract (no daemon)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-storage-journal.test.ts scripts/tests/usage-storage-query.test.ts scripts/tests/usage-storage-gate.test.ts scripts/tests/usage-mirror-spawn.test.ts scripts/tests/usage-storage-wing.test.ts scripts/tests/usage-storage-drain.test.ts scripts/tests/usage-storage-prune.test.ts

      - name: Validate the usage-record mirror against a fake daemon
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-cache-guard.ts --stray-scan -- node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-mirror-catchup.test.ts scripts/tests/usage-mirror-prune.test.ts scripts/tests/usage-mirror-failures.test.ts scripts/tests/usage-mirror-mutants.test.ts

      - name: Validate the MemPalace drawer inventory against a fake daemon
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-inventory.test.ts

      - name: Check the usage wrapper oracle and the hermetic environment helper (POSIX only)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-wrappers-oracle.test.ts scripts/tests/usage-wrappers.test.ts scripts/tests/hermetic-env.test.ts

      - name: Verify the standalone validator matches the generator
        run: node scripts/build-usage-validator.js --check
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
