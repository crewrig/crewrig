name: Usage Storage Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-store/**"
      - "scripts/usage-query.sh"
      - "scripts/usage-prune.sh"
      - "scripts/usage-mirror.sh"
      - "scripts/usage-inventory.ts"
      - "scripts/usage-drain.sh"
      - "scripts/usage-task.sh"
      - "scripts/usage-attribute.sh"
      - "scripts/usage-backfill.sh"
      - "scripts/build-usage-validator.js"
      - "scripts/tests/test-usage-storage*.sh"
      - "scripts/tests/usage-inventory.test.ts"
      - "scripts/tests/fixtures/usage-storage/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "docs/usage-storage.md"
      - "docs/usage-organization.md"
  push:
    branches: [main, "release/**"]
    paths:
      - "scripts/lib/usage-store/**"
      - "scripts/usage-query.sh"
      - "scripts/usage-prune.sh"
      - "scripts/usage-mirror.sh"
      - "scripts/usage-inventory.ts"
      - "scripts/usage-drain.sh"
      - "scripts/usage-task.sh"
      - "scripts/usage-attribute.sh"
      - "scripts/usage-backfill.sh"
      - "scripts/build-usage-validator.js"
      - "scripts/tests/test-usage-storage*.sh"
      - "scripts/tests/usage-inventory.test.ts"
      - "scripts/tests/fixtures/usage-storage/**"
      - "schemas/**"
      - "package.json"
      - "package-lock.json"
      - "docs/usage-storage.md"
      - "docs/usage-organization.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  usage-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node@24 (bumped from node@22): scripts/usage-inventory.ts and its
          # test now run directly from .ts source via Node's built-in type
          # stripping (spec 0238), which requires Node >= 24 — see
          # DEVELOPMENT.md, "TypeScript toolchain and ratchet".
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate the usage-record storage contract (no daemon)
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-storage.sh

      - name: Validate the usage-record mirror against a fake daemon
        run: bash scripts/ci-cache-guard.sh --stray-scan -- bash scripts/tests/test-usage-storage-mirror.sh

      - name: Validate the MemPalace drawer inventory against a fake daemon
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --test scripts/tests/usage-inventory.test.ts

      - name: Verify the standalone validator matches the generator
        run: node scripts/build-usage-validator.js --check
      - name: Cancel workflow on job failure
        if: failure()
        uses: ./.github/actions/cancel-on-failure
