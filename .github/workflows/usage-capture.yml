name: Usage Capture Check

on:
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "hooks/usage-capture.sh"
      - "hooks/antigravity-statusline-shim.sh"
      - "hooks/claude-transcript-hooks.json"
      - "hooks/gemini-transcript-hooks.json"
      - "hooks/copilot-transcript-hooks.json"
      - "scripts/lib/usage-capture/**"
      - "scripts/lib/usage-headless.sh"
      - "scripts/usage-backfill.sh"
      - "scripts/tests/test-usage-capture.sh"
      - "scripts/tests/fixtures/usage-capture/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main, "release/**"]
    paths:
      - "hooks/usage-capture.sh"
      - "hooks/antigravity-statusline-shim.sh"
      - "hooks/claude-transcript-hooks.json"
      - "hooks/gemini-transcript-hooks.json"
      - "hooks/copilot-transcript-hooks.json"
      - "scripts/lib/usage-capture/**"
      - "scripts/lib/usage-headless.sh"
      - "scripts/usage-backfill.sh"
      - "scripts/tests/test-usage-capture.sh"
      - "scripts/tests/fixtures/usage-capture/**"
      - "package.json"
      - "package-lock.json"

jobs:
  usage-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate usage capture adapters and fixtures
        run: bash scripts/tests/test-usage-capture.sh
