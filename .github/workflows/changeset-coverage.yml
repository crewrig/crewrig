name: Exhaustive Run

# Spec 0147 delta-01 R21, R22: mirrors the `changeset-coverage` capability of
# ci/ci-capabilities.yml. It runs every command of every changeset-gated
# capability, with no diff and no base ref. It is deliberately a workflow of its
# own: a `schedule:` trigger on build.yml would start every job of that file on
# the cron. A scheduled run uses the default branch; `workflow_dispatch` runs it
# on demand (the file must exist on the branch that is dispatched).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, the same checkout as the other engines
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /usr/local/bin/yq" | sha256sum -c -
          sudo chmod +x /usr/local/bin/yq
      # Spec 0147 delta-02 R26, R27: every tool of the gated union is installed here, and a
      # failed install fails the step. Spec 0282: Task comes from the pinned, checksum-verified
      # composite action, which ends with a failing `task --version` check.
      - uses: ./.github/actions/setup-task
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Secondary runtime: the full suite includes the setup suites, whose
      # capture-enabled cases hit the Node.js floor guard (spec 0243 R24, v1-F2)
      # on ubuntu-latest's default Node.js 22 (#1391 CI).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --workspaces=false
      - name: Floor guard accepts Node.js 24
        run: node scripts/lib/node-floor-guard.js
      - name: Exhaustive run of every changeset-gated check (spec 0147 delta-01 R21)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-changeset-coverage.ts
  # Spec 0284: a red scheduled run opens, or comments on, one issue; a manual dispatch does not.
  alert: # ci-capability: alert-scheduled-failure
    runs-on: ubuntu-latest
    needs: changeset-coverage
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --omit=dev --workspaces=false
      - run: node scripts/lib/node-floor-guard.js
      - uses: ./.github/actions/setup-task
      - run: task ci:alert-scheduled-failure -- --result ${{ needs.changeset-coverage.result }}
        env:
          GH_TOKEN: ${{ github.token }}
