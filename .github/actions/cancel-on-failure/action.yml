name: Cancel workflow on failure
description: >-
  Cancels the current workflow run, so that independent sibling jobs stop
  early instead of running to completion on a workflow that is already
  doomed to fail. Intended to be invoked only from a step gated on
  `if: failure()` in the calling job. The calling workflow must grant
  `actions: write` to the GITHUB_TOKEN. Cancellation is best-effort: a
  refused cancel (e.g. the read-only token of a fork pull request) emits a
  warning instead of failing the step, since the job has already failed.
  Because the cancel also turns the failing job into `cancelled`, the action
  first records the failing job and step in an error annotation and in the
  run summary (best-effort). See docs/runbooks/ci-cancelled-run-diagnosis.md.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Record the real failure before the cancel rewrites it as `cancelled`.
        step="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
          --jq '[.jobs[] | select(.name == env.GITHUB_JOB or (.name | startswith(env.GITHUB_JOB + " (")) or (.name | endswith(" / " + env.GITHUB_JOB)) or (.name | contains(" / " + env.GITHUB_JOB + " ("))) | .steps[] | select(.conclusion == "failure") | .name] | first // empty' 2>/dev/null || true)"
        msg="Job '${GITHUB_JOB}' failed at step '${step:-unknown}'; the run is cancelled, so this job will read 'cancelled'."
        echo "::error title=cancel-on-failure::${msg}"
        echo "### cancel-on-failure: ${GITHUB_JOB}" >> "${GITHUB_STEP_SUMMARY}"
        echo "${msg}" >> "${GITHUB_STEP_SUMMARY}"
        if ! gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"; then
          echo "::warning title=cancel-on-failure::Could not cancel run ${GITHUB_RUN_ID}; sibling jobs will run to completion. Check that the workflow grants 'actions: write'."
        fi
      env:
        GH_TOKEN: ${{ github.token }}
