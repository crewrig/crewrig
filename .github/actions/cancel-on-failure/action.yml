name: Cancel workflow on failure
description: >-
  Cancels the current workflow run when the calling job has failed, so that
  independent sibling jobs stop early instead of running to completion on a
  workflow that is already doomed to fail.
runs:
  using: composite
  steps:
    - if: failure()
      shell: bash
      run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
      env:
        GH_TOKEN: ${{ github.token }}
