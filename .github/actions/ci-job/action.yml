name: CI job
description: >-
  The thin CI job body (spec 0283 R5/R6): a checkout deepening to two commits, setup-node, the runtime path gate,
  setup-task, an optional pinned yq (ci/yq-pin.json), the dependency install, the Node floor guard, `task ci:<id>` and
  cancel-on-failure. Call it after a plain `actions/checkout` (the default depth is deepened here).
  A job whose files do not match skips every step after the gate and reports success, so required checks stay
  satisfiable. Logic is inline: the shell-allowlist ratchet forbids a new shell file.
inputs:
  id:
    description: Capability id in ci/ci-capabilities.yml.
    required: true
  node:
    description: Node.js major version.
    default: "24"
  install:
    description: "Dependency install: ci, install, omit-dev or none."
    default: omit-dev
  gate:
    description: >-
      'false' skips the runtime path gate (a job whose capability has no `paths:` always runs); the
      run decision is then forced true. Checked by scripts/check-ci-parity.ts against `paths:`.
    default: "true"
  task:
    description: Provision the pinned Task and run `task ci:<id>`.
    default: "true"
  cache:
    description: Cache `.ci-cache` keyed by the ci-cache-guard content hash.
    default: "false"
  yq:
    description: >-
      yq version to install (a key of ci/yq-pin.json; empty installs none). The binary is
      downloaded, its sha256 verified against the pin, then installed to /usr/local/bin.
    default: ""
  apt:
    description: >-
      Explicit space-separated apt package names (no wildcard) installed with
      `sudo apt-get update && sudo apt-get install -y --no-install-recommends` before the task. Must equal the
      packages implied by the capability's `requires.tools` (checked by scripts/check-ci-parity.ts).
    default: ""
  python:
    description: >-
      Python version (x.y, for example 3.12) provisioned with actions/setup-python before the task. Must equal
      the capability's secondary `runtime` entry `python@<version>`.
    default: ""
runs:
  using: composite
  steps:
    # The path gate diffs HEAD^1..HEAD (pull_request merge commit) or <before>..HEAD (push), so the
    # shallow default checkout is deepened to two commits. A full clone (fetch-depth: 0) is left alone.
    - shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --depth=2 origin "$(git rev-parse HEAD)"
        fi
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node }}
        cache: ${{ inputs.install != 'none' && 'npm' || '' }}
    # The gate needs js-yaml, so this production install precedes it. It is the only production
    # install: `omit-dev` jobs need nothing more, `ci`/`install` jobs add the full one. With the gate
    # off it runs only as the job's own `omit-dev` install.
    - if: inputs.gate != 'false' || inputs.install == 'omit-dev'
      shell: bash
      run: npm ci --omit=dev --workspaces=false
    - id: gate
      if: inputs.gate != 'false'
      shell: bash
      env:
        GATE_BEFORE: ${{ github.event.before }}
        JOB_ID: ${{ inputs.id }}
      run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-paths-gate.ts --capability "${JOB_ID}"
    # Every later step reads `steps.decide.outputs.run`: forced true when the gate is off.
    - id: decide
      shell: bash
      env:
        GATE_ENABLED: ${{ inputs.gate }}
        GATE_CHANGED: ${{ steps.gate.outputs.changed }}
      run: |
        if [ "${GATE_ENABLED}" = "false" ]; then
          echo "run=true" >> "${GITHUB_OUTPUT}"
        else
          echo "run=${GATE_CHANGED}" >> "${GITHUB_OUTPUT}"
        fi
    - if: steps.decide.outputs.run == 'true' && inputs.yq != ''
      shell: bash
      env:
        YQ_VERSION: ${{ inputs.yq }}
      run: |
        set -euo pipefail
        pin_file="ci/yq-pin.json"
        if [[ ! "${YQ_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error title=ci-job-yq::invalid yq version '${YQ_VERSION}'" >&2
          exit 1
        fi
        sum="$(sed -n 's/^ *"'"${YQ_VERSION}"'": *"\([0-9a-f]\{64\}\)".*/\1/p' "${pin_file}")"
        if [ -z "${sum}" ]; then
          echo "::error title=ci-job-yq::no pinned checksum for yq ${YQ_VERSION} in ${pin_file}" >&2
          exit 1
        fi
        work="$(mktemp -d)"
        curl --fail --silent --show-error --location --retry 3 -o "${work}/yq" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
        actual="$(sha256sum "${work}/yq" | cut -d' ' -f1)"
        if [ "${actual}" != "${sum}" ]; then
          echo "::error title=ci-job-yq::checksum mismatch for yq ${YQ_VERSION}: expected ${sum}, got ${actual}" >&2
          exit 1
        fi
        sudo install -m 0755 "${work}/yq" /usr/local/bin/yq
        yq --version
    - if: steps.decide.outputs.run == 'true' && inputs.apt != ''
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.apt }}
      run: |
        set -euo pipefail
        if [[ ! "${APT_PACKAGES}" =~ ^[a-z0-9][a-z0-9+.-]*(\ [a-z0-9][a-z0-9+.-]*)*$ ]]; then
          echo "::error title=ci-job-apt::invalid apt package list '${APT_PACKAGES}'" >&2
          exit 1
        fi
        read -r -a packages <<< "${APT_PACKAGES}"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends "${packages[@]}"
    - if: steps.decide.outputs.run == 'true' && inputs.python != ''
      shell: bash
      env:
        PYTHON_VERSION: ${{ inputs.python }}
      run: |
        set -euo pipefail
        if [[ ! "${PYTHON_VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "::error title=ci-job-python::invalid python version '${PYTHON_VERSION}'" >&2
          exit 1
        fi
    - if: steps.decide.outputs.run == 'true' && inputs.python != ''
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python }}
    - if: steps.decide.outputs.run == 'true' && inputs.task == 'true'
      uses: ./.github/actions/setup-task
    - if: steps.decide.outputs.run == 'true' && inputs.install == 'ci'
      shell: bash
      run: npm ci
    - if: steps.decide.outputs.run == 'true' && inputs.install == 'install'
      shell: bash
      run: npm install
    - if: steps.decide.outputs.run == 'true' && inputs.node == '24'
      shell: bash
      run: node scripts/lib/node-floor-guard.js
    - id: cachekey
      if: steps.decide.outputs.run == 'true' && inputs.cache == 'true'
      shell: bash
      env:
        JOB_ID: ${{ inputs.id }}
      run: echo "key=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-cache-guard.ts --capability "${JOB_ID}" --print-key)" >> "${GITHUB_OUTPUT}"
    - if: steps.decide.outputs.run == 'true' && inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: .ci-cache
        key: ci-${{ inputs.id }}-${{ steps.cachekey.outputs.key }}
    - if: steps.decide.outputs.run == 'true' && inputs.task == 'true' && runner.os != 'Windows'
      shell: bash
      env:
        JOB_ID: ${{ inputs.id }}
      run: task "ci:${JOB_ID}"
    # Windows: the task runs from pwsh, the runner's native environment (Git Bash would put its own
    # PATH and HOME in front of the proofs, which test that no POSIX layer is needed).
    - if: steps.decide.outputs.run == 'true' && inputs.task == 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        JOB_ID: ${{ inputs.id }}
      run: task "ci:$env:JOB_ID"
    - if: steps.decide.outputs.run == 'true' && failure()
      uses: ./.github/actions/cancel-on-failure
