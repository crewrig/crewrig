gitlab-ci-check:
  image: node:24
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends wget ca-certificates
    - wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
    - echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /usr/local/bin/yq" | sha256sum -c -
    - chmod +x /usr/local/bin/yq
  script:
    - "npm ci --omit=dev --workspaces=false"
    - "node scripts/lib/node-floor-guard.js"
    - "node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/build-ci.ts --check"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^main$|^release\//'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^main$|^release\//'

