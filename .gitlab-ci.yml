grep-anti-patterns:
  image: debian:stable-slim
  script:
    - |
        set -uo pipefail
        hits=$(grep -rnE '\[\[?[^]]*\]\]?[[:space:]]+&&[[:space:]]+.*&&[[:space:]]+exit[[:space:]]+[0-9]+' \
                scripts/ hooks/ \
              | grep -v 'acknowledged-exception:' || true)
        if [ -n "$hits" ]; then
          echo "::error::Rule 3 violation — chained-test exit pattern (see docs/scripting-conventions.md)"
          echo "$hits"
          exit 1
        fi
        echo "Rule 3 clean."
    - |
        set -uo pipefail
        hits=$(grep -rnE 'except[[:space:]]*:|except[[:space:]]+(Exception|BaseException)[[:space:]]*(as[[:space:]]+\w+)?[[:space:]]*:' \
                scripts/ hooks/ \
              | grep -v 'acknowledged-exception:' || true)
        if [ -n "$hits" ]; then
          echo "::error::Rule 1 violation — bare/broad except (see docs/scripting-conventions.md)"
          echo "$hits"
          exit 1
        fi
        echo "Rule 1 clean."
    - "bash scripts/check-bash32-portability.sh"
    - "bash scripts/check-pipefail-grep.sh"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^main$|^release\//'
      changes:
        - "scripts/**"
        - "hooks/**"
        - ".github/workflows/scripting-conventions.yml"
        - "ci/bash32-forbidden.txt"

