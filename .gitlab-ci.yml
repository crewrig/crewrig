workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

.task-install:
  script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
    - curl --fail --silent --show-error --location --retry 3 -o /tmp/task.tar.gz https://github.com/go-task/task/releases/download/v3.54.0/task_linux_amd64.tar.gz
    - echo "680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb  /tmp/task.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/task.tar.gz -C /usr/local/bin task
    - task --version

build:
  image: node:22
  script:
    - "npm install"
    - "npm run build --workspaces --if-present"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^main$|^release\//'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^main$|^release\//'

