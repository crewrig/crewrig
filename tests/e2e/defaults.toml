# tests/e2e/defaults.toml — committed defaults for the e2e runner.
#
# Schema overview (see docs/adr/0003-e2e-runner-toml.md for the full contract):
#
#   [cli.<name>]
#     image         = "<docker-image-tag>"      # required
#     command       = ["<argv0>", "<arg1>"]     # required
#     command_args  = ["<extra>", ...]          # optional, default []
#     mounts        = ["host:container[:mode]"] # required, may be []
#     env_keys      = ["VAR_NAME", ...]         # required, may be []
#     byok_provider = "<name>"                  # optional, cli.copilot only — the
#                                                #   bring-your-own-key provider
#                                                #   probe A (05-copilot-model-
#                                                #   routing, spec 0194) is
#                                                #   exercised against. Unset here;
#                                                #   the default machine skips
#                                                #   probe A. Declarative only —
#                                                #   the scenario additionally
#                                                #   requires .command to differ
#                                                #   from a defaults-only merge
#                                                #   before it trusts the label.
#     byok_model    = "<name>"                  # optional, cli.copilot only — the
#                                                #   model exercised through that
#                                                #   provider. Same backing rule.
#
#   [scenarios.<name>]                          # populated by issue #80
#     description  = "..."
#     command_args = [...]
#     applies_to   = ["claude", "gemini", "copilot"]
#
# Path interpolation:
#   The literal token "${CREWRIG_E2E_HOME}" in mount strings is replaced by
#   the runner at execution time with the host's e2e home dir
#   (typically "$HOME/.crewrig-e2e", overridable via $CREWRIG_E2E_HOME).
#   This keeps the committed defaults portable across machines.
#
# Local overrides:
#   Copy tests/e2e/local.toml.example to tests/e2e/local.toml (gitignored)
#   to override any field. Arrays APPEND, scalars REPLACE, new tables graft
#   in. See ADR 0003 Decision 2 for the full merge semantics.

[cli.claude]
image        = "crewrig/e2e-claude:latest"
command      = ["claude"]
command_args = []
mounts       = [
  "${CREWRIG_E2E_HOME}/claude:/home/agent/.claude:ro",
  "${CREWRIG_E2E_HOME}/claude/.claude.json:/home/agent/.claude.json:ro"
]
env_keys     = ["ANTHROPIC_API_KEY"]

[cli.gemini]
image        = "crewrig/e2e-gemini:latest"
# Container-side bootstrap (issue #148 Decision 5 Revision 3): copy the
# auth bundle + layered-context rules into a writable home owned by
# `agent`, then patch settings.json.context.fileName with the dynamic
# basename manifest so `gemini -p` autoloads the 00–60 rules. The
# sandboxed login's settings.json carries only the `security` block;
# without this manifest patch, rules sit inert in the container and
# the CLI hallucinates instead of reading PROFILE.md (tester evidence
# at commit 6260e5e). jq is shipped in crewrig/e2e-base (/usr/bin/jq).
#
# `set -e` makes mkdir/cp fatal. `cp -a` preserves modes so
# oauth_creds.json stays 0600 (Med-3 from the #148 security review).
# The `[ -n "$M" ]` guard means a soft-skipped rules copy also skips
# the manifest patch — no stale context.fileName pointing at absent
# files. `> tmp && mv` is atomic: a jq error mid-pipeline leaves the
# bundle's settings.json untouched. Per Rev 3, chown collapses back to
# `|| true` (the bounded-ugliness threshold favours readability now
# the chain is longer).
command      = [
  "bash", "-c",
  "set -e; D=/home/agent/.gemini; mkdir -p $D && cp -a /run/gemini-creds/. $D/ && { cp -a /run/gemini-rules/[0-6]0_*.md $D/ 2>/dev/null || echo '[bootstrap] no layered-context rules found at /run/gemini-rules/ — gemini/01 will likely fail' >&2; } && M=$(ls $D/[0-6]0_*.md 2>/dev/null | xargs -r -n1 basename | jq -R . | jq -s .) && [ \"$M\" != \"[]\" ] && jq --argjson m \"$M\" '.context.fileName = $m' $D/settings.json > $D/settings.json.tmp && mv $D/settings.json.tmp $D/settings.json; chown -R agent:agent $D 2>/dev/null || true; exec gemini \"$@\"",
  "sh"
]
command_args = []
# Two-mount layout (issue #148 Decision 5 Revision 2):
#   /run/gemini-creds — sandboxed auth bundle (load-bearing for login).
#   /run/gemini-rules — host's deployed layered-context rules (00–60 files).
# DO NOT widen the bootstrap glob from `[0-6]0_*.md` to anything broader
# (e.g. `cp -a /run/gemini-rules/. …`) without revisiting Decision 5
# Revision 2 — the user's host `~/.gemini` carries personal state
# (history/, extensions/, MCP configs) that MUST NOT leak into the
# scenario container.
mounts       = [
  "${CREWRIG_E2E_HOME}/gemini:/run/gemini-creds:ro",
  "${HOME}/.gemini:/run/gemini-rules:ro",
]
env_keys     = ["GEMINI_API_KEY"]

[cli.copilot]
# Copilot accepts either an env-var token (ADR 0002 Decision 4 —
# COPILOT_GITHUB_TOKEN canonical, GH_TOKEN a fallback honored by
# e2e_auth_ready) OR the workstation's own persisted credential (spec 0194
# R1-R3): scripts/e2e/auth-copilot.sh already copies ~/.copilot/config.json
# into the bundle, and the mount below is what makes that copy visible to
# scenario containers. Mode is `rw` because Copilot writes session-state/
# into its config dir at runtime (tests/e2e/scenarios/01-layered-context/
# run.sh:102-103 records the same fact for the CLI's rules-dir mount) — the
# residual (a container can corrupt or replace the copied config.json) is
# accepted and stated in tests/e2e/README.md. The runner's
# e2e_ensure_bundle_dir / e2e_assert_bundle_modes bracket keeps the host
# path safe to mount and its modes correct (spec 0194 R5).
image        = "crewrig/e2e-copilot:latest"
command      = ["copilot"]
command_args = []
mounts       = [
  "${CREWRIG_E2E_HOME}/copilot:/home/agent/.copilot:rw"
]
env_keys     = ["COPILOT_GITHUB_TOKEN"]

# [judge] — LLM-as-judge wrapper config (see ADR 0004 Decision 4 and
# tests/e2e/lib/llm_judge.sh). All fields are overridable via local.toml.
# `api_key_env` is intentionally distinct from `ANTHROPIC_API_KEY` so the
# judge's billing/quota line stays separated from the runtime CLI key
# (which may point at the same upstream key value — separation is about
# accounting, not secrecy).
[judge]
backend     = "anthropic"                    # Selects tests/e2e/lib/llm_judge_drivers/<backend>.sh.
model       = "claude-sonnet-4-6"            # Update when a newer stable Sonnet ships.
api_key_env = "ANTHROPIC_JUDGE_API_KEY"
auth_mode   = "api_key"                      # "api_key" (default) | "oauth" — see ADR 0008. Only honored by drivers that branch on it (e.g. claude-code).
# gcp_project = ""                       # Optional Google Cloud project; forwarded as x-goog-user-project when set.
endpoint    = "https://api.anthropic.com/v1/messages"
max_tokens  = 256
strict      = false                          # UNCERTAIN warns; does NOT fail.
temperature = 0.0                            # Forwarded to the backend driver. Deterministic by default.
max_calls   = 30                             # Per-run hard cap on Messages API calls.

# [scenarios.*] — the four pillar scenarios (issue #80, ADR 0005).
#
# Each scenario owns a host-side orchestrator at
# tests/e2e/scenarios/<name>/run.sh. The runner exports the env-var
# contract (E2E_LIB_DIR, E2E_REPORT_DIR, E2E_CLI, E2E_IMAGE,
# E2E_EFFECTIVE_JSON, E2E_CREWRIG_E2E_HOME, E2E_SCENARIO_DIR,
# E2E_RUN_ID) and delegates. `command_args` is intentionally omitted —
# scenarios assemble their own docker argv.

[scenarios.01-layered-context]
description = "00-60 rule files steer the CLI's profile-aware answer (location probe)."
applies_to  = ["claude", "gemini", "copilot"]

[scenarios.02-cross-tool-memory]
description = "A drawer written by CLI A is read by CLI B via a shared MemPalace sidecar."
applies_to  = ["claude", "gemini"]

[scenarios.03-skill-build]
description = "scripts/build-components.sh emits CLI-specific artefacts inside the container."
applies_to  = ["claude", "gemini", "copilot"]

[scenarios.04-harness-loop]
description = "harness-report → MemPalace → harness-curator round-trip."
applies_to  = ["claude", "gemini", "copilot"]

# [scenarios.05-copilot-model-routing] — probe A (spec 0194 R8-R11). Adjudicates
# github/copilot-cli#4437: a `model:` hint in a repository agent declaration on
# a bring-your-own-key session either fires the upstream bug or it does not.
# Declarative-only precondition (byok_provider/byok_model above); the scenario
# itself verifies the declaration is backed before trusting it. Not gated by
# requirements 1-7 — runs on whichever Copilot credential path is already
# ready (spec 0194 R10).
[scenarios.05-copilot-model-routing]
description = "Differential probe for github/copilot-cli#4437 — does a model: hint in a repo agent declaration break BYOK subagent routing?"
applies_to  = ["copilot"]

# [scenarios.06-agent-surface-consumption] — probe B (spec 0194 R12-R15).
# Determines, per CLI and per per-file layout, whether that CLI's agent
# reader consumes a repository .claude/agents/ declaration. Grounds epic
# #1100's compiled-layout seam. R12 "at least" — covers copilot and claude.
[scenarios.06-agent-surface-consumption]
description = "Per-CLI, per-layout determination of whether .claude/agents/ declarations are consumed (nested vs flat)."
applies_to  = ["copilot", "claude"]
