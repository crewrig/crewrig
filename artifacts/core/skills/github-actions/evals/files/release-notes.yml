name: Publish release notes
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
