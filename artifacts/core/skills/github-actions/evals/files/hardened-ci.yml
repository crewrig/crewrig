name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@0c26a3a7c9b3d5fa30cfaba9743cecd359447653  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a934ffe7b56651f0108d79e0921ed964fde62c03  # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Log the branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "Tested branch $BRANCH"
