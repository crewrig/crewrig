<!doctype html>
<html>
<head><title>Acme Roasters</title></head>
<body>
  <header>
    <nav><a href="/">Home</a><a href="/shop">Shop</a></nav>
  </header>
  <div class="hero">
    <h3>Fresh coffee, delivered</h3>
    <img src="/img/beans.jpg">
    <img src="/img/logo.svg" alt="logo.svg">
  </div>
  <main>
    <h1>Our beans</h1>
    <h4>Single origin</h4>
    <form action="/subscribe">
      <input type="email" name="email" placeholder="Your email">
      <label for="qty">Quantity</label>
      <input type="number" id="qty" name="qty">
      <select name="grind"><option>Whole</option></select>
      <button type="submit">Subscribe</button>
    </form>
  </main>
  <nav><a href="/privacy">Privacy</a></nav>
</body>
</html>
